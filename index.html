            className={`btn flex-1 py-2.5 text-[12px] border ${isGlobalListening ? 'bg-rose-50 text-crimson border-rose-200' : 'bg-paper text-slate-500 border-transparent'}`}>
            {isGlobalListening
              ? <><span className="w-2.5 h-2.5 bg-crimson rounded-sm pulse-ring" /> Đang nghe — bấm để dừng</>
              : <><I.Mic width="15" height="15" /> Nhập liệu bằng giọng nói</>}
          </button>
          <button onClick={() => setShowMicPicker(true)}
            className="btn px-3 py-2.5 text-[11.5px] font-bold bg-paper text-slate-500 border border-transparent hover:text-brand shrink-0"
            title="Chọn thiết bị micro">
            <I.Settings width="14" height="14" />
            <span className="hidden sm:inline max-w-[130px] truncate">{selectedMicLabel || 'Chọn micro'}</span>
          </button>
        </div>

        <div className="flex-1 overflow-y-auto p-4 sm:p-6 pb-24">
          <div className="max-w-3xl mx-auto space-y-4">

            {/* identity */}
            <section className="bg-white border border-line rounded-2xl p-5 sm:p-6 space-y-4">
              <Field label="Tên khách hàng / nhà thuốc *">
                <div className="flex gap-2">
                  <input value={formData.name} onFocus={() => handleFocus('name')}
                         onChange={e => setFormData({ ...formData, name: e.target.value })}
                         placeholder="Nhập tên..." className="fld font-display text-[17px] font-bold flex-1" />
                  <button onClick={handleFindInfo} disabled={isFindingInfo}
                          className="btn px-3.5 bg-violet-50 text-violet2 shrink-0" title="Tra cứu thông tin bằng AI">
                    {isFindingInfo ? <I.Loader width="16" height="16" className="animate-spin" /> : <I.Search width="16" height="16" />}
                  </button>
                </div>
              </Field>
              <div className="grid sm:grid-cols-2 gap-4">
                <Field label="Người liên hệ">
                  <input value={formData.contactPerson} onFocus={() => handleFocus('contactPerson')}
                         onChange={e => setFormData({ ...formData, contactPerson: e.target.value })} placeholder="..." className="fld" />
                </Field>
                <Field label="Số điện thoại">
                  <input type="tel" inputMode="tel" value={formData.phone} onFocus={() => handleFocus('phone')}
                         onChange={e => setFormData({ ...formData, phone: e.target.value })} placeholder="..." className="fld font-mono" />
                </Field>
              </div>
              <Field label="Địa chỉ chi tiết">
                <input value={formData.address} onFocus={() => handleFocus('address')}
                       onChange={e => setFormData({ ...formData, address: e.target.value })} placeholder="..." className="fld" />
              </Field>
              <div className="grid sm:grid-cols-2 gap-4">
                <Field label="Tỉnh / thành phố">
                  <select value={formData.province} onChange={e => setFormData({ ...formData, province: e.target.value })} className="fld">
                    {VIETNAM_PROVINCES.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                </Field>
                <Field label="Phân loại khách">
                  <select value={formData.type} onChange={e => setFormData({ ...formData, type: e.target.value })} className="fld">
                    {Object.values(CustomerType).map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </Field>
              </div>
              <div className="grid sm:grid-cols-2 gap-4">
                <Field label="Ngày giao dịch">
                  <input type="date" value={formData.transactionDate}
                         onChange={e => setFormData({ ...formData, transactionDate: e.target.value })} className="fld" />
                </Field>
                <Field label="Email / MST">
                  <input value={formData.emailMST} onFocus={() => handleFocus('emailMST')}
                         onChange={e => setFormData({ ...formData, emailMST: e.target.value })} placeholder="..." className="fld" />
                </Field>
              </div>
              <Field label="Trạng thái giao dịch">
                <div className="grid gap-2">
                  {Object.values(TransactionStatus).map(s => (
                    <button key={s} onClick={() => setFormData({ ...formData, status: s })}
                      className={`btn justify-start px-4 py-3 text-[13px] border text-left ${formData.status === s ? `${tone(s).solid} text-white border-transparent shadow-lift` : 'bg-paper text-slate-500 border-transparent'}`}>
                      <span className={`w-2 h-2 rounded-full shrink-0 ${formData.status === s ? 'bg-white' : ''}`}
                            style={formData.status === s ? {} : { background: tone(s).spine }} />
                      {s}
                    </button>
                  ))}
                </div>
              </Field>

              {formData.status === TransactionStatus.KHONG_THANH_CONG && (
                <div className="spine bg-rose-50/60 border border-rose-100 rounded-2xl p-4 pl-5" style={{ '--spine': '#d8324b' }}>
                  <p className="text-[10px] font-extrabold uppercase tracking-wider text-crimson mb-1">Khách không hợp tác</p>
                  <p className="text-[12.5px] text-slate-600 leading-relaxed mb-3">
                    Bạn có thể xóa hẳn khách hàng này khỏi Firebase để danh sách gọn lại. Toàn bộ báo cáo và lịch hẹn sẽ mất vĩnh viễn.
                  </p>
                  <button onClick={handleRemoveCustomerCompletely}
                    className="btn w-full py-3 bg-crimson text-white text-[12.5px] uppercase tracking-wider shadow-lift">
                    <I.Trash width="15" height="15" /> Xóa khách hàng khỏi hệ thống
                  </button>
                </div>
              )}
            </section>

            {/* report + AI */}
            <section className="bg-white border border-line rounded-2xl p-5 sm:p-6">
              <div className="flex flex-wrap justify-between items-center gap-2 mb-3">
                <h3 className="font-display text-[15px] font-extrabold text-ink flex items-center gap-2">
                  <I.Sparkles width="16" height="16" className="text-violet2" /> Báo cáo & AI tối ưu
                </h3>
                <div className="flex gap-2">
                  <button onClick={handleEnhanceText} disabled={isEnhancing} className="btn px-3 py-2 bg-blue-50 text-brand text-[11px]">
                    {isEnhancing ? <I.Loader width="13" height="13" className="animate-spin" /> : <I.Sparkles width="13" height="13" />} Hoàn thiện
                  </button>
                  <button onClick={handleAnalyze} disabled={isAnalyzing} className="btn px-3 py-2 bg-violet-50 text-violet2 text-[11px]">
                    {isAnalyzing ? <I.Loader width="13" height="13" className="animate-spin" /> : <I.Sparkles width="13" height="13" />} Lời khuyên IDECO
                  </button>
                </div>
              </div>
              <textarea value={formData.report} onFocus={() => handleFocus('report')}
                onChange={e => setFormData({ ...formData, report: e.target.value })}
                placeholder="Ghi rõ: sản phẩm đã chào, phản hồi của khách, vướng mắc và hướng xử lý tiếp theo..."
                className="fld h-44 leading-relaxed resize-y text-[14px]" />
              <p className="text-[11px] text-slate-400 mt-2">
                {formData.report ? formData.report.trim().split(/\s+/).filter(Boolean).length : 0} từ · nên từ 25 từ trở lên, có tên sản phẩm và phản hồi khách hàng.
              </p>
            </section>

            {/* appointments */}
            {!(formData.status === TransactionStatus.THANH_CONG || formData.status === TransactionStatus.THANH_CONG_SP_MOI || formData.status === TransactionStatus.KHONG_THANH_CONG) && (
              <section className="bg-white border border-line rounded-2xl p-5 sm:p-6">
                <div className="flex flex-wrap justify-between items-center gap-2 mb-4">
                  <h3 className="font-display text-[15px] font-extrabold text-ink flex items-center gap-2">
                    <I.Clock width="16" height="16" className="text-amber2" /> Thiết lập lịch hẹn *
                  </h3>
                  <Badge cls="bg-rose-50 text-crimson border-rose-200">Bắt buộc có lịch hẹn mới</Badge>
                </div>

                <div className="bg-paper rounded-2xl p-4 space-y-3">
                  <div className="grid grid-cols-2 gap-3">
                    <Field label="Ngày hẹn">
                      <input type="date" value={newAppointment.date} onChange={e => setNewAppointment({ ...newAppointment, date: e.target.value })} className="fld bg-white" />
                    </Field>
                    <Field label="Giờ hẹn">
                      <input type="time" value={newAppointment.time} onChange={e => setNewAppointment({ ...newAppointment, time: e.target.value })} className="fld bg-white" />
                    </Field>
                  </div>
                  <Field label="Nội dung hẹn">
                    <input value={newAppointment.content} onFocus={() => handleFocus('appointmentContent')}
                      onChange={e => setNewAppointment({ ...newAppointment, content: e.target.value })}
                      placeholder="VD: Gọi điện tư vấn lại..." className="fld bg-white" />
                  </Field>
                  <button onClick={handleAddAppointment} className="btn w-full py-3 bg-ink text-white text-[13px] uppercase tracking-wider">
                    <I.Plus width="15" height="15" /> Lập lịch hẹn
                  </button>
                </div>

                <div className="space-y-2 mt-4">
                  {(formData.appointments || []).map(a => {
                    const past = a.date < getLocalDateString(new Date());
                    return (
                      <div key={a.id} className={`spine rounded-2xl border p-4 pl-5 flex items-center gap-3 ${a.isCompleted ? 'bg-paper border-transparent opacity-50' : 'bg-white border-line'}`}
                           style={{ '--spine': a.isCompleted ? '#cbd5e1' : (past ? '#d8324b' : '#1d6fd0') }}>
                        <div className="flex-1 min-w-0">
                          <p className="font-mono font-bold text-[13px] text-ink">{viDate(a.date)} · {a.time}</p>
                          <p className="text-[12.5px] text-slate-500 mt-0.5">{a.content}</p>
                        </div>
                        <button onClick={() => setFormData({ ...formData, appointments: formData.appointments.filter(x => x.id !== a.id) })}
                          className="btn w-9 h-9 bg-rose-50 text-crimson shrink-0"><I.Trash width="15" height="15" /></button>
                      </div>
                    );
                  })}
                  {(formData.appointments || []).length === 0 && (
                    <p className="text-center text-[12.5px] text-slate-400 py-4">Chưa có lịch hẹn. Thêm một lịch hẹn để lưu được hồ sơ.</p>
                  )}
                </div>
              </section>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}


/* ============================== POPUPS ============================== */
function Popups({
  celebrationQueue, setCelebrationQueue,
  performanceAlert, setPerformanceAlert,
  showTargetPopup, targetGoal, setTargetGoal, handleConfirmTarget,
  targetWarning, setTargetWarning,
  quickReportCustomer, setQuickReportCustomer
}) {
  const firedRef = useRef(null);

  const markSeen = (id) => {
    let seen = [];
    try { seen = JSON.parse(localStorage.getItem('seenCelebrationIds') || '[]'); } catch (e) {}
    if (!seen.includes(id)) {
      seen.push(id);
      if (seen.length > 100) seen.shift();
      localStorage.setItem('seenCelebrationIds', JSON.stringify(seen));
    }
  };

  const dismissCelebration = () => {
    if (!celebrationQueue.length) return;
    markSeen(celebrationQueue[0].id);
    setCelebrationQueue(prev => prev.slice(1));
  };

  useEffect(() => {
    if (!celebrationQueue.length) return;
    const cur = celebrationQueue[0];
    if (firedRef.current !== cur.id) { firedRef.current = cur.id; burstConfetti(); }
    const t = setTimeout(dismissCelebration, 6000);
    return () => clearTimeout(t);
  }, [celebrationQueue]);

  return (
    <React.Fragment>
      {/* celebration */}
      <Modal open={celebrationQueue.length > 0} z={1100} max="max-w-md">
        {celebrationQueue.length > 0 && (
          <div className="p-8 text-center relative overflow-hidden rounded-[26px]">
            <div className="absolute inset-x-0 top-0 h-1.5" style={{ background: 'linear-gradient(90deg,#e08a1e,#f5c451,#e08a1e)' }} />
            <Ring color="bg-amber-50 text-amber2" icon={<I.Trophy width="28" height="28" />} />
            <p className="lbl">Vinh danh chiến binh</p>
            <p className="font-display text-[30px] font-extrabold text-ink leading-tight mt-1 mb-2">{celebrationQueue[0].staffName}</p>
            <p className="text-[13.5px] text-slate-500 mb-5">
              Đã chốt thành công khách hàng <span className="font-bold text-ink">{celebrationQueue[0].customerName}</span>. Ban giám đốc chúc mừng Em!
            </p>
            <div className="spine bg-emerald-50/70 rounded-2xl p-4 pl-5 text-left mb-6" style={{ '--spine': '#0f9d76' }}>
              <p className="text-[12.5px] font-bold text-emerald-800 leading-relaxed uppercase">
                "Chúc mừng bạn đã chốt thành công, mong bạn phát huy và duy trì tốt phát triển khách hàng. Ban giám đốc chúc mừng Em!"
              </p>
            </div>
            <button onClick={dismissCelebration} className="btn w-full py-4 bg-amber2 text-white text-[13px] uppercase tracking-wider shadow-lift">
              Tuyệt vời — xin chúc mừng {celebrationQueue.length > 1 ? `(còn ${celebrationQueue.length - 1})` : ''}
            </button>
          </div>
        )}
      </Modal>

      {/* performance */}
      <Modal open={!!performanceAlert && celebrationQueue.length === 0} z={1060} max="max-w-md">
        {performanceAlert && (
          <div className="p-8 text-center">
            <Ring color="bg-amber-50 text-amber2" icon={<I.BarChart width="26" height="26" />} />
            <h3 className="font-display text-[19px] font-extrabold text-ink mb-4">Nhắc nhở hiệu suất</h3>
            <div className="spine bg-amber-50/60 rounded-2xl p-4 pl-5 text-left mb-5" style={{ '--spine': '#e08a1e' }}>
              <p className="font-bold text-ink text-[13.5px] mb-1.5">Hệ thống ghi nhận bạn khai thác khách hàng hôm qua quá ít!</p>
              <p className="text-[12.5px] text-slate-600 leading-relaxed">Dưới 3 khách hàng là mức báo động. Nếu không tăng số lượng lên, bạn sẽ rất khó đạt chỉ tiêu doanh thu tháng này!</p>
            </div>
            <p className="lbl">Nhân viên cần nỗ lực</p>
            <div className="flex flex-wrap justify-center gap-2 mb-7 max-h-28 overflow-y-auto">
              {performanceAlert.map(n => (
                <span key={n} className="px-3 py-1.5 bg-paper rounded-xl text-[12px] font-bold text-slate-600">{n}</span>
              ))}
            </div>
            <button onClick={() => setPerformanceAlert(null)} className="btn w-full py-4 bg-ink text-white text-[13px] uppercase tracking-wider">Tôi sẽ cố gắng hơn</button>
          </div>
        )}
      </Modal>

      {/* target goal */}
      <Modal open={showTargetPopup} z={1090} max="max-w-md">
        <div className="p-8 text-center">
          <Ring color="bg-blue-50 text-brand" icon={<I.Target width="26" height="26" />} />
          <h3 className="font-display text-[19px] font-extrabold text-ink mb-4">Mục tiêu hôm nay</h3>
          <div className="spine bg-paper rounded-2xl p-4 pl-5 text-left mb-5 max-h-[38vh] overflow-y-auto" style={{ '--spine': '#1d6fd0' }}>
            <p className="text-[13px] text-slate-600 leading-relaxed">
              Huyền chia sẽ nè bạn ơi ! hãy kiên định với mục tiêu mình trong việc MỞ MỚI KHÁCH HÀNG, không chỉ bạn có thưởng mà chúng ta góp vào sự phát triển công ty IDECO mình nhé! Khách hàng mở mới cần thời gian đàm phán, rồi từ chối, yêu sách nên bạn phải mở trong 1 ngày càng nhiều càng tốt thì cuối tháng mới đạt mục tiêu. Nếu bạn ý thức lời khuyên này của Huyền -Trợ lý BGD thì hãy quyết tâm. Luôn mong bạn thành công đó. Mến nha!
            </p>
          </div>
          <input type="number" min="0" inputMode="numeric"
            value={targetGoal === null ? '' : targetGoal}
            onChange={e => setTargetGoal(parseInt(e.target.value) || 0)}
            onKeyDown={e => e.key === 'Enter' && handleConfirmTarget()}
            placeholder="Số khách hàng mục tiêu"
            className="fld text-center font-mono font-bold text-[20px] py-4 mb-4" />
          <button onClick={handleConfirmTarget} className="btn w-full py-4 bg-brand text-white text-[13px] uppercase tracking-wider shadow-lift">Xác nhận mục tiêu</button>
        </div>
      </Modal>

      {/* target warning */}
      <Modal open={targetWarning} z={1090} max="max-w-sm">
        <div className="p-8 text-center">
          <Ring color="bg-rose-50 text-crimson" icon={<I.AlertCircle width="26" height="26" />} />
          <h3 className="font-display text-[19px] font-extrabold text-ink mb-4">Cảnh báo mục tiêu</h3>
          <p className="text-[13.5px] text-slate-600 leading-relaxed mb-7">
            Bạn đã không giữ lời hứa chính mục tiêu của mình rồi, việc này bạn phải nỗ lực hơn nếu muốn chúng ta và cả bạn đặt mục tiêu kinh doanh và về doanh số tốt hơn. Hãy tập trung cao khả năng tiếp cận khách hàng bạn nhé
          </p>
          <button onClick={() => setTargetWarning(false)} className="btn w-full py-4 bg-ink text-white text-[13px] uppercase tracking-wider">Tôi đã hiểu</button>
        </div>
      </Modal>

      {/* quick report */}
      <Modal open={!!quickReportCustomer} z={1080} max="max-w-lg" onClose={() => setQuickReportCustomer(null)}>
        {quickReportCustomer && (
          <div className="p-6 sm:p-7 flex flex-col max-h-[88vh]">
            <div className="flex justify-between items-center gap-3 mb-5">
              <h3 className="font-display text-[17px] font-extrabold text-ink flex items-center gap-2">
                <I.Sparkles width="17" height="17" className="text-violet2" /> Báo cáo nhanh
              </h3>
              <button onClick={() => setQuickReportCustomer(null)} className="btn w-9 h-9 bg-paper text-slate-400 hover:text-crimson"><I.X width="16" height="16" /></button>
            </div>

            <div className="flex-1 overflow-y-auto space-y-4 pr-1">
              <div className="spine bg-paper rounded-2xl p-4 pl-5" style={{ '--spine': tone(quickReportCustomer.status).spine }}>
                <p className="lbl mb-1">Khách hàng</p>
                <p className="font-display text-[18px] font-extrabold text-ink">{quickReportCustomer.name}</p>
                <p className="text-[12px] text-slate-500 mt-1">{quickReportCustomer.address}{quickReportCustomer.address ? ', ' : ''}{quickReportCustomer.province}</p>
                <div className="flex flex-wrap items-center gap-2 mt-3">
                  <Badge cls={tone(quickReportCustomer.status).chip}>{quickReportCustomer.status}</Badge>
                  <Badge cls="bg-slate-50 text-slate-500 border-slate-200">{quickReportCustomer.type}</Badge>
                  {quickReportCustomer.phone && <PhoneAction phone={quickReportCustomer.phone} compact />}
                </div>
              </div>

              <div>
                <p className="lbl">Nội dung báo cáo</p>
                <div className="spine bg-violet-50/40 rounded-2xl p-4 pl-5" style={{ '--spine': '#6d4de0' }}>
                  <p className="text-[13.5px] text-ink leading-relaxed whitespace-pre-line">
                    {quickReportCustomer.report || 'Chưa có nội dung báo cáo.'}
                  </p>
                </div>
              </div>

              {(quickReportCustomer.appointments || []).length > 0 && (
                <div>
                  <p className="lbl">Lịch hẹn</p>
                  <div className="space-y-2">
                    {quickReportCustomer.appointments.map(a => (
                      <div key={a.id} className={`spine rounded-2xl p-3.5 pl-5 border ${a.isCompleted ? 'bg-paper border-transparent opacity-60' : 'bg-white border-line'}`}
                           style={{ '--spine': a.isCompleted ? '#cbd5e1' : '#e08a1e' }}>
                        <p className="font-mono font-bold text-[12.5px] text-ink">{viDate(a.date)} · {a.time}</p>
                        <p className="text-[12.5px] text-slate-500 mt-0.5">{a.content}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div>
                <p className="lbl">Lời khuyên từ IDECO</p>
                <div className="spine bg-amber-50/40 rounded-2xl p-4 pl-5" style={{ '--spine': '#e08a1e' }}>
                  <p className="text-[12.5px] text-slate-600 italic leading-relaxed">
                    Báo cáo này đã được AI tối ưu để đảm bảo tính chuyên nghiệp và rõ ràng cho Ban Giám đốc.
                  </p>
                </div>
              </div>
            </div>

            <button onClick={() => setQuickReportCustomer(null)} className="btn w-full py-4 mt-5 bg-ink text-white text-[13px] uppercase tracking-wider shrink-0">Đóng cửa sổ</button>
          </div>
        )}
      </Modal>
    </React.Fragment>
  );
}

/* ============================== MOUNT ============================== */
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

<script>
(function () {
  function fatal(msg, detail) {
    document.getElementById('root').innerHTML =
      '<div style="max-width:560px;margin:12vh auto;padding:28px;font-family:system-ui;background:#fff;'
      + 'border-radius:20px;box-shadow:0 20px 50px -20px rgba(11,37,69,.4)">'
      + '<h2 style="margin:0 0 10px;font-size:19px;color:#0b2545">Khong tai duoc ung dung</h2>'
      + '<p style="margin:0 0 14px;font-size:14px;color:#5b6b86">' + msg + '</p>'
      + '<pre style="white-space:pre-wrap;font-size:12px;color:#d8324b;background:#fff5f6;padding:12px;border-radius:10px">'
      + (detail || '') + '</pre></div>';
  }
  try {
    if (!window.Babel) { fatal('Thieu thu vien Babel. Kiem tra ket noi mang roi tai lai trang.', ''); return; }
    var src = document.getElementById('app-source').textContent;
    var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]], filename: 'app.jsx' }).code;
    (0, eval)(out);
  } catch (e) {
    fatal('Loi khi khoi tao ung dung.', (e && (e.message || e)) + '');
    console.error(e);
  }
})();
</script>
