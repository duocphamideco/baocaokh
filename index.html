/* fetch co gioi han thoi gian -> KHONG BAO GIO treo vo han khi mang chap chon */
async function fetchTimeout(url, opts = {}, ms = 20000) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try {
    return await fetch(url, { ...opts, signal: ctl.signal });
  } finally {
    clearTimeout(timer);
  }
}

    return r.ok;

}
async function dbUpdate(path, value) {

}
/* Ghi 1 lo co thu lai nhieu lan — TRA VE LY DO THAT SU khi that bai */
async function dbUpdateDetailed(path, value, tries = 3, ms = 25000) {
  /* --- Duong chinh: SDK (WebSocket) --- */
  if (FB_READY) {
    for (let t = 0; t < tries; t++) {
      try {
        await Promise.race([
          FBDB.ref(path).update(value),
          new Promise((_, rej) => setTimeout(() => rej(new Error('SDK_TIMEOUT')), ms))
        ]);
        return { ok: true, via: 'SDK' };
      } catch (e) {
        const msg = String((e && (e.message || e.code)) || e);
        if (/permission|denied/i.test(msg)) {
          return { ok: false, err: `Firebase SDK: ${msg}`, fatal: true,
                   hint: 'Database Rules đang chặn ghi. Vào Firebase Console → Realtime Database → Rules, đặt ".write": true rồi bấm Publish.' };
        }
        if (t === tries - 1) { console.warn('[IDECO] SDK ghi lỗi, chuyển sang REST:', msg); break; }
        await new Promise(res => setTimeout(res, 800 * Math.pow(2, t)));
      }
    }
  }

  /* --- Du phong: REST --- */
  let lastErr = 'Không rõ nguyên nhân';
  for (let t = 0; t < tries; t++) {
    try {
      const r = await fetchTimeout(dbUrl(path), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(value)
      }, ms);
      if (r.ok) return { ok: true, via: 'REST' };

      /* Doc thong bao loi that cua Firebase */
      let body = '';
      try { body = (await r.text()).slice(0, 300); } catch (e) {}
      lastErr = `HTTP ${r.status}${body ? ' — ' + body : ''}`;

      if (r.status === 401 || r.status === 403) {
        return { ok: false, err: lastErr, code: r.status, fatal: true,
                 hint: 'Database Rules đang chặn ghi. Vào Firebase Console → Realtime Database → Rules, đặt ".write": true rồi Publish.' };
      }
      if (r.status === 404) {
        return { ok: false, err: lastErr, code: 404, fatal: true,
                 hint: 'Sai databaseURL — kiểm tra lại địa chỉ Realtime Database (chú ý vùng, ví dụ ...-default-rtdb.asia-southeast1.firebasedatabase.app).' };
      }
      if (r.status === 413) {
        return { ok: false, err: lastErr, code: 413, fatal: true,
                 hint: 'Gói dữ liệu quá lớn — hãy giảm số dòng mỗi lô.' };
      }
      if (r.status >= 400 && r.status < 500 && r.status !== 429) {
        return { ok: false, err: lastErr, code: r.status, fatal: true,
                 hint: 'Firebase từ chối dữ liệu. Xem chi tiết lỗi ở trên.' };
      }
    } catch (e) {
      lastErr = e.name === 'AbortError'
        ? `Quá thời gian chờ ${Math.round(ms / 1000)}s (mạng chậm hoặc bị chặn)`
        : `${e.name}: ${e.message}`;
      /* TypeError = bi CORS / tuong lua / chan mang chan hoan toan */
      if (e instanceof TypeError && t === tries - 1) {
        return { ok: false, err: lastErr, fatal: true,
                 hint: 'Trình duyệt không gửi được yêu cầu. Thường do: mở file bằng file:// thay vì http, tường lửa/VPN công ty chặn firebaseio.com, hoặc tiện ích chặn quảng cáo.' };
      }
    }
    if (t < tries - 1) await new Promise(res => setTimeout(res, 800 * Math.pow(2, t)));
  }
  return { ok: false, err: lastErr, hint: 'Mạng không ổn định — thử lại khi đường truyền tốt hơn.' };
}

/** Co the tam dung moi listener khi dang upload lo lon -> tranh nghen mang */
const RT = { paused: false, pending: new Set(), guard: null };
function rtPause()  {
  RT.paused = true;
  /* Chot an toan: du co loi bat ngo, realtime luon tu bat lai sau 3 phut */
  clearTimeout(RT.guard);
  RT.guard = setTimeout(() => { if (RT.paused) rtResume(); }, 180000);
}
function rtResume() {
  clearTimeout(RT.guard); RT.guard = null;
  RT.paused = false;
  RT.pending.forEach(fn => { try { fn(); } catch (e) {} });
  RT.pending.clear();
}

/** Realtime subscription via EventSource (Firebase REST streaming). */
function dbOnValue(path, cb) {
  let es = null, dead = false, poll = null, last = null, fbRef = null, fbHandler = null;
  const emit = (v) => {
    const s = JSON.stringify(v);
    if (s !== last) { last = s; cb(v); }
  };

  /* ---- Duong chinh: SDK onValue (giong het ban goc) ---- */
  if (FB_READY) {
    try {
      fbRef = FBDB.ref(path);
      fbHandler = fbRef.on('value', (snap) => {
        if (dead) return;
        const v = snap.exists() ? snap.val() : null;
        /* Dang upload -> hoan lai de khong ve lai giao dien lien tuc */
        if (RT.paused) { RT.pending.add(() => { if (!dead) emit(v); }); return; }
        emit(v);
      }, (err) => { console.error('[IDECO] onValue lỗi:', path, err); });
      return () => {
        dead = true;
        try { fbRef.off('value', fbHandler); } catch (e) {}
      };
    } catch (e) { console.error('[IDECO] Không đăng ký được onValue:', e); }
  }

  /* ---- Du phong: EventSource / polling qua REST ---- */
  const refresh = async () => { if (!dead) emit(await dbGet(path)); };
  const onChange = () => {
    if (dead) return;
    if (RT.paused) { RT.pending.add(refresh); return; }
    refresh();
  };
  const startPoll = () => {
    if (poll) return;
    onChange();
    poll = setInterval(onChange, 12000);
  };
  try {
    es = new EventSource(dbUrl(path));
    es.addEventListener('put', onChange);
    es.addEventListener('patch', onChange);
    es.onerror = () => { startPoll(); };
    dbGet(path).then(v => { if (!dead) emit(v); });
  } catch (e) { startPoll(); }
  return () => {
    dead = true;
    if (es) try { es.close(); } catch (e) {}
    if (poll) clearInterval(poll);
  };
}

function extractKieGeminiText(payload) {
  const chunks = Array.isArray(payload) ? payload : [payload];
  let out = '';
  for (const chunk of chunks) {
    const candidates = chunk?.candidates || [];
    for (const c of candidates) {
      const parts = c?.content?.parts || [];
      for (const p of parts) {
        /* Kie/Gemini có thể trả phần suy nghĩ riêng. Không đưa thought ra giao diện. */
        if (p?.thought === true) continue;
        if (typeof p?.text === 'string') out += p.text;
      }
    }
  }
  return out.trim();
}

async function callHuyenTurbo(prompt, { json = true } = {}) {
  if (!KIE_TURBO_API_KEY) throw new Error('NO_TURBO_KEY');

  const body = {
    stream: true,
    contents: [{ role: 'user', parts: [{ text: prompt }] }],
    generationConfig: {
      ...(json ? { responseMimeType: 'application/json' } : {}),
      thinkingConfig: {
        includeThoughts: true,
        thinkingLevel: 'high'
      }
    }
  };

  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 90000);
  let res;
  try {
    res = await fetch(KIE_TURBO_ENDPOINT, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${KIE_TURBO_API_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body),
      signal: ctl.signal
    });
  } finally { clearTimeout(timer); }

  if (!res.ok) {
    let detail = '';
    try { detail = (await res.text()).slice(0, 600); } catch (e) {}
    const err = new Error(`TURBO_HTTP_${res.status}${detail ? ' — ' + detail : ''}`);
    err.status = res.status;
    throw err;
  }

  const rawText = await res.text();
  let answer = '';

  /* Kie có thể trả SSE (data: {...}) hoặc JSON/JSON-array tùy gateway. */
  if (/^\s*data:/m.test(rawText)) {
    const payloads = [];
    for (const line of rawText.split(/\r?\n/)) {
      const t = line.trim();
      if (!t.startsWith('data:')) continue;
      const data = t.slice(5).trim();
      if (!data || data === '[DONE]') continue;
      try { payloads.push(JSON.parse(data)); } catch (e) {}
    }
    answer = extractKieGeminiText(payloads);
  } else {
    try { answer = extractKieGeminiText(JSON.parse(rawText)); }
    catch (e) { answer = rawText.trim(); }
  }

  if (!answer) throw new Error('TURBO_EMPTY');
  window.__IDECO_HUYEN_TURBO_LAST__ = { model: 'gemini-3.7-flash', provider: 'Kie.ai', at: Date.now() };
  return answer;
}

async function callGemini(prompt, { model = 'gemini-3.6-flash', json = true, tools = null, temperature } = {}) {
  const entries = geminiKeyEntries();
  if (!entries.length) throw new Error('NO_KEY');

  // Bắt đầu từ key đã chạy thành công gần nhất, nhưng bỏ qua key đang cooldown.
  const start = Math.min(GEMINI_ACTIVE_KEY_INDEX, Math.max(0, entries.length - 1));
  const ordered = entries.slice(start).concat(entries.slice(0, start));
  const ready = ordered.filter(x => !isKeyCooling(x.key));
  const queue = ready.length ? ready : ordered; // Nếu tất cả cooldown, vẫn thử lại lần lượt.

  let lastErr = null;
  for (const entry of queue) {
    try {
      const body = { contents: [{ parts: [{ text: prompt }] }] };
      const cfg = {};
      if (json && !tools) cfg.responseMimeType = 'application/json';
      if (temperature !== undefined) cfg.temperature = temperature;
      if (Object.keys(cfg).length) body.generationConfig = cfg;
      if (tools) body.tools = tools;

      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 45000);
      let res;
      try {
        res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(entry.key)}`,
          { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal }
        );
      } finally { clearTimeout(timer); }

      if (!res.ok) {
        let detail = '';
        try { detail = (await res.text()).slice(0, 500); } catch (e) {}
        const err = new Error(`HTTP ${res.status}${detail ? ' — ' + detail : ''}`);
        err.status = res.status; err.keyLabel = entry.label;
        lastErr = err;

        // 429/quota: nghỉ key này 2 phút; lỗi auth: nghỉ 10 phút; 5xx: nghỉ 30 giây.
        if (res.status === 429) GEMINI_KEY_COOLDOWN.set(entry.key, Date.now() + 120000);
        else if (res.status === 401 || res.status === 403) GEMINI_KEY_COOLDOWN.set(entry.key, Date.now() + 600000);
        else if (res.status >= 500) GEMINI_KEY_COOLDOWN.set(entry.key, Date.now() + 30000);

        // Với lỗi có thể khắc phục bằng key khác thì tự chuyển ngay.
        if ([401,403,408,429].includes(res.status) || res.status >= 500) continue;
        // Các lỗi 4xx khác thường do request/model, đổi key cũng không giúp; vẫn thử key kế để dự phòng.
        continue;
      }

      const data = await res.json();
      const parts = data?.candidates?.[0]?.content?.parts || [];
      const text = parts.map(p => p.text || '').join('').trim();
      if (text) {
        const realIndex = entries.findIndex(x => x.key === entry.key);
        if (realIndex >= 0) GEMINI_ACTIVE_KEY_INDEX = realIndex;
        GEMINI_KEY_COOLDOWN.delete(entry.key);
        window.__IDECO_GEMINI_LAST_KEY__ = { label: entry.label, masked: maskGeminiKey(entry.key), at: Date.now() };
        return text;
      }
      lastErr = Object.assign(new Error('EMPTY'), { keyLabel: entry.label });
    } catch (e) {
      lastErr = e;
      // Timeout/network: chuyển sang key kế tiếp, tránh treo phân tích.
      if (e && e.name === 'AbortError') GEMINI_KEY_COOLDOWN.set(entry.key, Date.now() + 30000);
    }
  }
  throw lastErr || new Error('AI_FAIL');
}

function safeJson(txt, fallback) {
  if (!txt) return fallback;
  let t = txt.replace(/```json/gi, '').replace(/```/g, '').trim();
  try { return JSON.parse(t); } catch (e) {}
  const m = t.match(/[\{\[][\s\S]*[\}\]]/);
  if (m) { try { return JSON.parse(m[0]); } catch (e) {} }
  return fallback;
}

/** Nhiệm vụ 1: chỉnh sửa văn bản — Nhiệm vụ 2: lời khuyên từ IDECO (giữ nguyên prompt gốc) */
async function analyzeAndRefineReport(text, customerFeedback = '') {

    3. Kiểm tra Phản hồi Khách Hàng:
       - Xem cả NỘI DUNG BÁO CÁO và PHẢN HỒI KHÁCH HÀNG ĐÃ KHAI. Nếu cả hai KHÔNG nêu phản hồi thực tế của khách -> nhắc: "Bạn nên khai báo phản hồi cụ thể của khách hàng: đồng ý/từ chối/quan tâm sản phẩm nào, vướng giá hay chính sách gì, cần xem thêm điều gì."

    4. Xử lý Từ Khóa Về Giá (giá cao, chiết khấu thấp, giá đắt, giá bán cao, chiết khấu không cao):
       - Nếu xuất hiện -> Thêm lời khuyên: "Hãy phân tích rõ cho khách hàng giá mua vào, hãy thêm yếu tố đổi trả tốt hơn, thậm chí bàn lại công nợ hỗ trợ hay đề nghị nhóm sản phẩm giá phù hợp, đồng thời hỏi khách hàng so sánh giá với sản phẩm nào cụ thể cùng quy cách, cùng tác dụng."

    5. Xử lý Từ Khóa Trì Hoãn (để xem xét, trả lời sau, để hỏi lại, xem sau):
       - Nếu xuất hiện -> Thêm lời khuyên: "Nên hỏi rõ thời điểm phản hồi từ khách hàng và chủ động thiết lập cuộc hẹn."

    6. Kiểm tra bước tiếp theo:
       - Nếu chưa có hành động tiếp theo/hẹn phản hồi/gửi báo giá/gọi lại/chốt thời điểm theo dõi -> nhắc nhân viên nêu rõ bước tiếp theo và thời điểm dự kiến.

    7. Lời khuyên mặc định (LUÔN LUÔN THÊM VÀO CUỐI):
       - "Bạn nên chủ động hỏi lý do từ chối, hay xem xét và chủ động gợi ý thêm nhiều sản phẩm khác, dò hỏi nhu cầu tiềm ẩn của khách hàng và luôn chủ động xin cuộc hẹn."

    Output định dạng JSON chuẩn (không dùng markdown block):
    {
      "refinedText": "Văn bản đã chỉnh sửa...",
      "advice": "Tổng hợp các lời khuyên dựa trên logic trên..."
    }
  `;
  try {
    const raw = await callGemini(prompt, { model: 'gemini-3.6-flash', json: true });
    const r = safeJson(raw, null);
    if (!r) return { status: 'warning', text, message: 'Lỗi xử lý dữ liệu AI.' };
    return { status: 'success', text: r.refinedText || text, message: r.advice || 'Đã chuẩn hóa văn bản.' };
  } catch (e) {
    if (e && e.message === 'NO_KEY') {
      return { status: 'warning', text, message: 'Chưa có API key Gemini. Vào Hệ thống → Cài đặt AI để nhập key dự phòng.' };
    }
    return { status: 'warning', text, message: 'Lỗi kết nối AI, vui lòng thử lại.' };
  }
}

async function analyzeVoiceCustomerDeclaration(text) {
  const empty = {
    name: '', contactPerson: '', phone: '', address: '', province: '', type: '',
    report: '', customerFeedback: '', missing: [], summary: '', qualityIssues: [], qualityAdvice: ''
  };
  if (!text || !text.trim()) return { ...empty, missing: ['Nội dung khai báo'] };
  const prompt = `
Bạn là trợ lý CRM và trợ lý phân tích báo cáo kinh doanh của IDECO. Hãy đọc nội dung khai báo bằng giọng nói/văn bản của nhân viên kinh doanh, sau đó thực hiện HAI nhiệm vụ: TRÍCH XUẤT DỮ LIỆU và KIỂM TRA CHẤT LƯỢNG BÁO CÁO.

NGUYÊN TẮC BẮT BUỘC:
- Chỉ lấy dữ liệu thật sự xuất hiện hoặc được nói rõ trong văn bản. KHÔNG tự bịa, KHÔNG tự tra cứu bên ngoài.

- "province" chỉ điền tỉnh/thành phố nếu xác định được trực tiếp từ địa chỉ được khai báo.

- "report" là phần nội dung giao dịch/trao đổi/cập nhật còn lại: đã giới thiệu/chào gì, trao đổi chính sách gì, vướng mắc, việc đã làm và bước tiếp theo. Viết rõ ràng, chuyên nghiệp nhưng KHÔNG thêm sự kiện mới.

- "missing" phải liệt kê các mục còn thiếu trong 6 nhóm nhận diện bắt buộc: Tên doanh nghiệp/khách hàng, Người liên hệ, Số điện thoại, Địa chỉ, Đối tượng khách hàng, Nội dung trao đổi/cập nhật.

KIỂM TRA CHẤT LƯỢNG BÁO CÁO — điền vào "qualityIssues":
1. Nếu không nêu sản phẩm/thuốc/nhãn hàng/danh mục/nhóm sản phẩm cụ thể đã chào hoặc trao đổi -> thêm "Chưa nêu sản phẩm/danh mục cụ thể đã chào khách hàng".
2. Nếu không nêu chính sách bán hàng đã trao đổi/áp dụng (ví dụ giá, chiết khấu, chương trình, công nợ, đổi trả, hỗ trợ, thưởng doanh số, điều kiện đơn hàng), VÀ cũng không nói rõ là chưa báo/chưa có chính sách -> thêm "Chưa nêu chính sách bán hàng đã trao đổi hoặc lý do chưa áp dụng".
3. Nếu không có phản hồi thực tế của khách -> thêm "Chưa nêu phản hồi cụ thể của khách hàng".
4. Nếu không có bước xử lý tiếp theo/hẹn gọi lại/gửi báo giá/gửi danh mục/chốt thời gian phản hồi -> thêm "Chưa nêu bước xử lý tiếp theo hoặc thời điểm theo dõi".
5. Nếu nội dung mơ hồ, quá chung chung, không đủ để Ban Giám đốc hiểu tình huống và hỗ trợ ra quyết định -> thêm "Nội dung còn chung chung, cần nêu rõ tình huống/vướng mắc cần hỗ trợ".
- "qualityAdvice" là một đoạn nhắc ngắn gọn, thân thiện, ưu tiên đúng các qualityIssues đã phát hiện; mục tiêu là giúp nhân viên bổ sung báo cáo để Ban Giám đốc dễ hiểu tình huống và hỗ trợ xử lý. KHÔNG tự điền chính sách hay sản phẩm mà nhân viên chưa khai.

VĂN BẢN KHAI BÁO:
${text}

Chỉ trả về JSON chuẩn theo cấu trúc:
{
  "name":"",
  "contactPerson":"",
  "phone":"",
  "address":"",
  "province":"",
  "type":"",
  "report":"",
  "customerFeedback":"",
  "missing":[],
  "summary":"",
  "qualityIssues":[],
  "qualityAdvice":""
}`;
  try {
    const raw = await callGemini(prompt, { model: 'gemini-3.6-flash', json: true, temperature: 0.1 });
    const r = safeJson(raw, null);
    if (!r || typeof r !== 'object') return empty;
    return {
      name: String(r.name || '').trim(),
      contactPerson: String(r.contactPerson || '').trim(),
      phone: String(r.phone || '').trim(),
      address: String(r.address || '').trim(),
      province: String(r.province || '').trim(),
      type: String(r.type || '').trim(),
      report: String(r.report || '').trim(),
      customerFeedback: String(r.customerFeedback || '').trim(),
      missing: Array.isArray(r.missing) ? r.missing.filter(Boolean).map(String) : [],
      summary: String(r.summary || '').trim(),
      qualityIssues: Array.isArray(r.qualityIssues) ? r.qualityIssues.filter(Boolean).map(String) : [],
      qualityAdvice: String(r.qualityAdvice || '').trim()
    };
  } catch (e) {
    if (e && e.message === 'NO_KEY') throw e;
    throw new Error('VOICE_AI_FAIL');
  }
}

function normalizeKnowledgeEntries(d) {
  if (!d) return [];
  const arr = Array.isArray(d) ? d : Object.values(d);
  return arr.filter(x => x && x.title && x.content)
    .sort((a,b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
}

async function analyzeLatestCustomerStrategy(customer, { turbo = false } = {}) {
  if (!customer) throw new Error('NO_CUSTOMER');

  /*
     V6.1 — ỔN ĐỊNH HUYỀN GỢI Ý
     - Hồ sơ "Không thành công / khách không hợp tác" vẫn được phân tích bình thường.
     - Turbo lỗi / timeout / JSON lỗi -> TỰ ĐỘNG rơi về Gemini 3.6 + 3 API dự phòng.
     - Giới hạn prompt để tránh hồ sơ dài làm request bị ngắt giữa chừng.
  */

/* Doc noi dung PDF/Word de dua vao Kho kien thuc; chi luu TEXT, khong luu file nhi phan */
async function extractKnowledgeFileText(file) {
  if (!file) throw new Error('NO_FILE');
  const name = String(file.name || '').toLowerCase();
  const buf = await file.arrayBuffer();

  if (name.endsWith('.pdf') || file.type === 'application/pdf') {
    if (!window.pdfjsLib) throw new Error('PDF_LIB_MISSING');
    const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      pages.push(tc.items.map(it => it.str || '').join(' ').replace(/\s+/g, ' ').trim());
    }
    return pages.filter(Boolean).join('\n\n');
  }

  if (name.endsWith('.docx')) {
    if (!window.mammoth) throw new Error('DOCX_LIB_MISSING');
    const r = await window.mammoth.extractRawText({ arrayBuffer: buf });
    return String(r.value || '').trim();
  }

  if (name.endsWith('.txt') || (file.type || '').startsWith('text/')) {
    return new TextDecoder('utf-8').decode(buf).trim();
  }

  if (name.endsWith('.doc')) throw new Error('OLD_DOC_UNSUPPORTED');
  throw new Error('UNSUPPORTED_FILE');
}

const getLocalDateString = (d) => {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
};

const isCustomerOverdue = (c) => {
  if (c.status !== TransactionStatus.DANG_THEO_DOI) return false;
  const today = getLocalDateString(new Date());
  const un = (c.appointments || []).filter(a => !a.isCompleted);
  const overdue = un.filter(a => a.date < today);
  const future = un.some(a => a.date >= today);
  return overdue.length > 0 && !future;
};

// Chuan hoa SDT VN: bo khoang trang, dau cham, gach; +84 -> 0
function normPhone(p) {
  let s = String(p || '').replace(/[^\d+]/g, '');
  if (s.startsWith('+84')) s = '0' + s.slice(3);
  else if (s.startsWith('84') && s.length >= 10) s = '0' + s.slice(2);
  return s;
}
// Zalo dung so quoc te khong dau +
function zaloPhone(p) {
  const s = normPhone(p);
  return s.startsWith('0') ? '84' + s.slice(1) : s.replace(/^\+/, '');
}
const telHref  = (p) => 'tel:' + normPhone(p);
const smsHref  = (p) => 'sms:' + normPhone(p);

function Toast({ n }) {

/** Nut so dien thoai: bam ra menu Goi / SMS / Zalo */
function PhoneAction({ phone, compact }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  useEffect(() => {
    if (!open) return;
    const away = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', away);
    document.addEventListener('touchstart', away);
    return () => { document.removeEventListener('mousedown', away); document.removeEventListener('touchstart', away); };
  }, [open]);
  if (!phone) return null;
  const stop = (e) => { e.stopPropagation(); };
  const items = [
    { k: 'call', label: 'Gọi điện',   href: telHref(phone),  icon: <I.Phone width="15" height="15" />,   cls: 'text-jade' },
    { k: 'sms',  label: 'Nhắn SMS',   href: smsHref(phone),  icon: <I.Message width="15" height="15" />, cls: 'text-brand' },
    { k: 'zalo', label: 'Nhắn Zalo',  href: zaloHref(phone), icon: <I.Zalo width="15" height="15" />,    cls: 'text-[#0068ff]', ext: true }
  ];
  return (
    <span className="relative inline-block" ref={wrapRef} onClick={stop}>
      <button onClick={(e) => { stop(e); setOpen(o => !o); }}
        className={`btn font-mono font-bold text-brand hover:bg-blue-50 ${compact ? 'text-[13px] px-2 py-1' : 'text-[15px] px-2.5 py-1.5'} -ml-2`}
        title="Bấm để gọi, nhắn SMS hoặc Zalo">
        <I.Phone width={compact ? 13 : 14} height={compact ? 13 : 14} /> {phone}
      </button>
      {open && (
        <span className="absolute left-0 top-full mt-1 z-50 bg-white rounded-2xl shadow-pop border border-line p-1.5 min-w-[168px] flex flex-col pop-in">
          {items.map(it => (
            <a key={it.k} href={it.href}
               {...(it.ext ? { target: '_blank', rel: 'noopener' } : {})}
               onClick={(e) => { stop(e); setOpen(false); }}
               className={`btn justify-start px-3 py-2.5 text-[13px] hover:bg-paper ${it.cls}`}>
              {it.icon} <span className="text-ink font-semibold">{it.label}</span>
            </a>
          ))}
        </span>
      )}
    </span>
  );
}

function burstConfetti() {
  const colors = ['#e08a1e', '#0f9d76', '#1d6fd0', '#d8324b', '#6d4de0', '#f5c451'];
  for (let i = 0; i < 44; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[i % colors.length];
    el.style.animationDuration = (2.4 + Math.random() * 1.8) + 's';
    el.style.animationDelay = (Math.random() * .5) + 's';
    el.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4600);
  }
}


/* ========================= KHO KIEN THUC XU LY TINH HUONG ========================= */
function KnowledgeBaseSettings({ notify }) {
  const [items, setItems] = useState([]);
  const [editingId, setEditingId] = useState('');
  const [title, setTitle] = useState('');
  const [content, setContent] = useState('');
  const [saving, setSaving] = useState(false);
  const [fileBusy, setFileBusy] = useState(false);
  const [listening, setListening] = useState(false);
  const recRef = useRef(null);
  const speechBaseRef = useRef('');
  const fileRef = useRef(null);

  useEffect(() => {
    const off = dbOnValue('settings/aiHandlingKnowledge', d => setItems(normalizeKnowledgeEntries(d)));
    return () => { off && off(); stopSpeech(); };
  }, []);

  const newItem = () => {
    stopSpeech();
    setEditingId(''); setTitle(''); setContent('');
  };

  const editItem = (it) => {
    stopSpeech();
    setEditingId(it.id || ''); setTitle(it.title || ''); setContent(it.content || '');
  };

  const saveItem = async () => {
    const t = title.trim(), c = content.trim();
    if (!t) { notify('Vui lòng nhập tiêu đề tình huống', 'warning'); return; }
    if (!c) { notify('Vui lòng nhập nội dung cách xử lý', 'warning'); return; }
    const id = editingId || uuid();
    const old = items.find(x => x.id === id);
    const payload = {
      id, title: t, content: c,
      createdAt: old?.createdAt || Date.now(),
      updatedAt: Date.now()
    };
    setSaving(true);
    const ok = await dbSet(`settings/aiHandlingKnowledge/${id}`, payload);
    setSaving(false);
    if (!ok) { notify('Không lưu được kho kiến thức lên Firebase', 'error'); return; }
    setEditingId(id);
    notify('Đã lưu tình huống vào Kho kiến thức AI', 'success');
  };

  const removeItem = async (it) => {
    if (!window.confirm(`Xóa tình huống “${it.title}”?`)) return;
    const ok = await dbRemove(`settings/aiHandlingKnowledge/${it.id}`);
    if (!ok) { notify('Không xóa được nội dung', 'error'); return; }
    if (editingId === it.id) newItem();
    notify('Đã xóa tình huống', 'success');
  };

  function stopSpeech() {
    const r = recRef.current; recRef.current = null;
    if (r) { r.onend = null; r.onresult = null; try { r.stop(); } catch (e) {} }
    setListening(false);
  }

  const toggleSpeech = () => {
    if (recRef.current) { stopSpeech(); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { notify('Trình duyệt này chưa hỗ trợ chuyển giọng nói thành văn bản', 'error'); return; }
    const rec = new SR();
    rec.lang = 'vi-VN'; rec.interimResults = true; rec.continuous = true;
    speechBaseRef.current = content || '';
    rec.onresult = (e) => {
      let interim = '', finalText = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (finalText) {
        const f = finalText.charAt(0).toUpperCase() + finalText.slice(1);
        speechBaseRef.current += (speechBaseRef.current ? '\n' : '') + f;
      }
      setContent(speechBaseRef.current + (interim ? (speechBaseRef.current ? '\n' : '') + interim : ''));
    };
    rec.onerror = () => { stopSpeech(); };
    rec.onend = () => { if (recRef.current === rec) { try { rec.start(); } catch (e) { stopSpeech(); } } };
    recRef.current = rec; setListening(true);
    try { rec.start(); } catch (e) { stopSpeech(); }
  };

  const uploadFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setFileBusy(true);
    try {
      let txt = await extractKnowledgeFileText(file);
      if (!txt) throw new Error('EMPTY_FILE_TEXT');
      const max = 150000;
      if (txt.length > max) {
        txt = txt.slice(0, max) + '\n\n[Phần còn lại của tài liệu đã được lược bớt do dung lượng quá lớn.]';
        notify('Tài liệu rất dài — đã lấy 150.000 ký tự đầu để tránh kho dữ liệu quá nặng', 'warning', 5000);
      } else notify(`Đã đọc nội dung từ ${file.name}`, 'success');
      if (!title.trim()) setTitle(file.name.replace(/\.(pdf|docx|txt)$/i, ''));
      setContent(prev => (prev.trim() ? prev.trim() + '\n\n' : '') + txt);
    } catch (err) {
      const code = String(err && err.message || err);
      const msg = code.includes('OLD_DOC') ? 'File .doc đời cũ chưa đọc trực tiếp được. Hãy lưu lại thành .docx rồi tải lên.'
        : code.includes('PDF_LIB') ? 'Không tải được bộ đọc PDF. Kiểm tra kết nối Internet rồi thử lại.'
        : code.includes('DOCX_LIB') ? 'Không tải được bộ đọc Word. Kiểm tra kết nối Internet rồi thử lại.'
        : code.includes('EMPTY_FILE_TEXT') ? 'Không trích xuất được chữ từ tài liệu này. PDF có thể là bản scan hình ảnh.'
        : 'Chỉ hỗ trợ Word .docx, PDF hoặc TXT.';
      notify(msg, 'error', 5500);
    } finally { setFileBusy(false); }
  };

  return (
    <section className="bg-white border border-line rounded-2xl p-5 sm:p-7">
      <div className="flex flex-wrap items-start justify-between gap-3 mb-2">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-amber-50 text-amber2 flex items-center justify-center"><I.Sparkles width="18" height="18" /></div>
          <div>
            <h3 className="font-display text-[17px] font-extrabold text-ink">Kho kiến thức xử lý tình huống AI</h3>
            <p className="text-[11px] text-slate-400 font-semibold">Kinh nghiệm nội bộ để AI tư vấn sát cách IDECO xử lý khách hàng</p>
          </div>
        </div>
        <button onClick={newItem} className="btn px-3.5 py-2.5 bg-ink text-white text-[11.5px]">
          <I.Plus width="14" height="14" /> Thêm mới
        </button>
      </div>

      <p className="text-[12.5px] text-slate-500 leading-relaxed mb-5">
        Mỗi mục gồm một tình huống và cách xử lý chuẩn. AI sẽ tham chiếu kho này khi phân tích hồ sơ khách hàng mới nhất. Có thể nhập bằng bàn phím, giọng nói hoặc lấy chữ từ Word/PDF.
      </p>

      <div className="space-y-4">
        <Field label="Tiêu đề tình huống">
          <input value={title} onChange={e => setTitle(e.target.value)} className="fld font-bold" placeholder="Ví dụ: Khách chê giá cao và yêu cầu tăng chiết khấu" />
        </Field>
        <Field label="Nội dung / cách xử lý">
          <textarea value={content} onChange={e => setContent(e.target.value)} className="fld leading-relaxed text-[13px]"
            placeholder="Mô tả tình huống, nguyên tắc xử lý, câu hỏi cần khai thác, chính sách được phép đề xuất, bước tiếp theo..."
            style={{ resize:'vertical', minHeight:'170px', maxHeight:'520px' }} />
        </Field>

        <div className="grid sm:grid-cols-2 gap-2">
          <button onClick={toggleSpeech}
            className={`btn py-3 text-[12px] border ${listening ? 'bg-crimson text-white border-crimson' : 'bg-blue-50 text-brand border-blue-100'}`}>
            {listening ? <><span className="w-2.5 h-2.5 bg-white rounded-sm pulse-ring" /> Đang nghe — bấm để dừng</>
              : <><I.Mic width="15" height="15" /> Nói thành văn bản</>}
          </button>
          <button onClick={() => fileRef.current && fileRef.current.click()} disabled={fileBusy}
            className="btn py-3 bg-paper text-slate-600 border border-line text-[12px] disabled:opacity-60">
            {fileBusy ? <I.Loader width="15" height="15" className="animate-spin" /> : <I.Upload width="15" height="15" />}
            {fileBusy ? 'Đang đọc tài liệu…' : 'Tải Word / PDF'}
          </button>
          <input ref={fileRef} type="file" accept=".docx,.pdf,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain"
            onChange={uploadFile} className="hidden" />
        </div>

        <button onClick={saveItem} disabled={saving}
          className="btn w-full py-3.5 bg-amber2 text-white text-[13px] uppercase tracking-wider shadow-lift disabled:opacity-60">
          {saving ? <I.Loader width="16" height="16" className="animate-spin" /> : <I.Save width="16" height="16" />}
          {saving ? 'Đang lưu…' : (editingId ? 'Lưu cập nhật' : 'Lưu vào kho kiến thức')}
        </button>
      </div>

      <div className="mt-6 pt-5 border-t border-line">
        <div className="flex items-center justify-between gap-2 mb-3">
          <p className="lbl mb-0">Nội dung đã lưu ({items.length})</p>
          {editingId && <span className="text-[10.5px] font-bold text-amber2">Đang sửa 1 mục</span>}
        </div>
        {items.length === 0 ? (
          <div className="rounded-2xl bg-paper p-4 text-[12.5px] text-slate-400 text-center">Chưa có tình huống nào trong kho.</div>
        ) : (
          <div className="space-y-2 max-h-[360px] overflow-y-auto pr-1">
            {items.map(it => (
              <div key={it.id} className={`spine rounded-2xl border p-4 pl-5 ${editingId === it.id ? 'bg-amber-50/60 border-amber-200' : 'bg-paper border-transparent'}`}
                   style={{ '--spine': editingId === it.id ? '#e08a1e' : '#cbd5e1' }}>
                <p className="font-bold text-ink text-[13.5px]">{it.title}</p>
                <p className="text-[11.5px] text-slate-500 mt-1.5 line-clamp-2 leading-relaxed">{it.content}</p>
                <div className="flex gap-2 mt-3">
                  <button onClick={() => editItem(it)} className="btn px-3 py-2 bg-white border border-line text-brand text-[11px]"><I.Edit width="13" height="13" /> Sửa</button>
                  <button onClick={() => removeItem(it)} className="btn px-3 py-2 bg-white border border-rose-100 text-crimson text-[11px]"><I.Trash width="13" height="13" /> Xóa</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </section>
  );
}

  /* ============== report validation (identical rules) ============== */
  const isReportValid = (text, customerFeedback = '') => {
    if (!text || text.trim().length === 0) return { valid: false, msg: 'Vui lòng nhập nội dung báo cáo giao dịch.' };
    const lowerText = text.toLowerCase();
    const feedbackText = String(customerFeedback || '').toLowerCase();
    const combinedFeedbackText = `${lowerText} ${feedbackText}`;
    const wordCount = text.trim().split(/\s+/).length;

    if (wordCount < 25) {
      return { valid: false, msg: `Bạn ơi, báo cáo giao dịch quá ngắn (dưới 25 từ). Làm sao bàn bạc giải pháp để phát triển tiếp theo?\n\nBạn nên viết rất cụ thể tên sản phẩm/thuốc và phản hồi của khách.\n\nBạn nên hiểu việc báo cáo tốt giúp bạn quản lý tốt hơn, hiểu tình huống hơn và cấp trên của bạn và đặc biệt BGĐ hiểu rõ bạn đang giao dịch vì để hỗ trợ xử lý khi cần cho bạn. Bạn phải cập nhật tình huống khi giao dịch xong nhé. Nếu BGĐ đọc mà nội dung cũ thì không tốt. Tôi là trợ lý IDECO của BGĐ giúp bạn tốt hơn.\n\n(Lưu ý: Hệ thống sẽ KHÔNG CHO LƯU hồ sơ nếu nội dung báo cáo không rõ ràng!)` };
    }

    const hasFeedback = /(phản hồi|ý kiến|nói|bảo|chê|khen|đắt|rẻ|giá|cần|muốn|hỏi|quan tâm|ok|chốt|không nhu cầu|chưa có nhu cầu|để xem lại|gởi báo giá|gửi báo giá|hẹn lần sau|loại thuốc nào|từ chối|đồng ý|mua|lấy|xem xét|tham khảo)/i.test(combinedFeedbackText);
    if (!hasFeedback) {
      return { valid: false, msg: `Bạn ơi, báo cáo giao dịch mà không có nội dung phản hồi của khách hàng (ví dụ: chê giá cao, không nhu cầu, để xem lại, hãy gởi báo giá, hẹn lần sau, loại thuốc nào...)? Dù là lần đầu tiếp xúc cũng cần ghi rõ phản hồi của khách.\n\nBạn nên hiểu việc báo cáo tốt giúp bạn quản lý tốt hơn, hiểu tình huống hơn và cấp trên của bạn và đặc biệt BGĐ hiểu rõ bạn đang giao dịch vì để hỗ trợ xử lý khi cần cho bạn. Bạn phải cập nhật tình huống khi giao dịch xong nhé. Nếu BGĐ đọc mà nội dung cũ thì không tốt. Tôi là trợ lý IDECO của BGĐ giúp bạn tốt hơn.\n\n(Lưu ý: Hệ thống sẽ KHÔNG CHO LƯU hồ sơ nếu nội dung báo cáo không rõ ràng!)` };
    }

    const stopWords = 'cho|đến|tới|về|ở|tại|của|và|các|những|với';
    let hasSpecificProduct = false;
    try {
      hasSpecificProduct =
        lowerText.includes('tất cả') ||
        new RegExp(`uvs\\s+(?!(${stopWords})\\b)\\p{L}+`, 'ui').test(lowerText) ||
        new RegExp(`danh mục( thuốc)?\\s+(?!(${stopWords})\\b)\\p{L}+`, 'ui').test(lowerText) ||
        new RegExp(`nhóm thuốc\\s+(?!(${stopWords})\\b)\\p{L}+`, 'ui').test(lowerText) ||
        new RegExp(`loại thuốc\\s+(?!(${stopWords})\\b)\\p{L}+`, 'ui').test(lowerText) ||
        new RegExp(`thuốc\\s+(?!(${stopWords})\\b)\\p{L}+`, 'ui').test(lowerText);
    } catch (e) {
      hasSpecificProduct = lowerText.includes('tất cả');
    }

    const genericMatch = lowerText.match(/\b(dmp|nhóm thuốc|tên thuốc|danh mục|gam thuốc|loại thuốc|nhóm sp|nhóm sản phẩm)\b/i);
    const hasProductKeyword = /(sản phẩm|sp|máy|thiết bị|bơm|van|model|hàng|catalogue|website|web|báo giá|chào|uvs|thuốc)/i.test(lowerText);

    if (genericMatch && !hasSpecificProduct) {
      return { valid: false, msg: `Bạn ơi, bạn đang viết chung chung là "${genericMatch[0].toUpperCase()}" mà không rõ ${genericMatch[0].toUpperCase()} là gì, tên thuốc cụ thể là gì? Báo cáo giao dịch mà không cụ thể sản phẩm nào, không có ý kiến khách hàng ra sao? Làm sao bàn bạc giải pháp để phát triển tiếp theo? Bạn nên viết rất cụ thể, trình bày những gì bạn đã trao đổi, đặc biệt đã chào sản phẩm, có gởi website báo giá không? Có nội dung gì cần bàn bạc lại vế Sếp, BGĐ không? Bạn đã tính trước các tình huống phản đổi để xoay sở thuyết phục không? Nên nhớ chúng ta bán cảm xúc, bán giải pháp giúp họ kinh doanh nên nói rỏ giải pháp hơn là cứ báo cáo chung chung.` };
    } else if (!hasProductKeyword && !hasSpecificProduct) {
      return { valid: false, msg: `Bạn ơi, báo cáo giao dịch mà không cụ thể sản phẩm nào, không có ý kiến khách hàng ra sao? Làm sao bàn bạc giải pháp để phát triển tiếp theo? Bạn nên viết rất cụ thể, trình bày những gì bạn đã trao đổi, đặc biệt đã chào sản phẩm, có gởi website báo giá không? Có nội dung gì cần bàn bạc lại vế Sếp, BGĐ không? Bạn đã tính trước các tình huống phản đổi để xoay sở thuyết phục không? Nên nhớ chúng ta bán cảm xúc, bán giải pháp giúp họ kinh doanh nên nói rỏ giải pháp hơn là cứ báo cáo chung chung.` };
    }
    return { valid: true };

  /* ============== Hall of fame ============== */
  useEffect(() => {

    const THREE_DAYS = 72 * 60 * 60 * 1000, now = Date.now();
    const wins = customers.filter(c => {
      const ok = c.status === TransactionStatus.THANH_CONG || c.status === TransactionStatus.THANH_CONG_SP_MOI;
      return ok && (now - (c.updatedAt || 0)) < THREE_DAYS;
    });

    let seen = [];
    try { seen = JSON.parse(localStorage.getItem('seenCelebrationIds') || '[]'); } catch (e) {}
    const unseen = wins.filter(c => !seen.includes(c.id));
    if (!unseen.length) return;
    unseen.sort((a, b) => (a.updatedAt || 0) - (b.updatedAt || 0));
    setCelebrationQueue(prev => {
      const fresh = unseen.filter(c => !prev.some(q => q.id === c.id));
      if (!fresh.length) return prev;
      return [...prev, ...fresh.map(c => ({ id: c.id, staffName: c.salesRep, customerName: c.name }))];

    const under = [];
    staffList.forEach(s => {
      const count = customers.filter(c => c.salesRep === s.name && c.transactionDate === yStr).length;
      const isNewbie = (Date.now() - (s.joinedAt || 0)) < 86400000;
      if (count < 3 && !isNewbie) under.push(s.name);

  /* ============== auto lock staff with >2 overdue ============== */
  useEffect(() => {
    if (!isUnlocked || !customers.length || !staffList.length) return;
    const overdue = customers.filter(isCustomerOverdue);
    const byStaff = overdue.reduce((acc, c) => { acc[c.salesRep] = (acc[c.salesRep] || 0) + 1; return acc; }, {});
    Object.entries(byStaff).forEach(([name, count]) => {
      const s = staffList.find(x => x.name === name);
      if (!s) return;
      if (count > 2 && !s.isLocked) {
        const recentlyUnlocked = s.unlockedAt && (Date.now() - s.unlockedAt < 86400000);
        if (!recentlyUnlocked) dbUpdate(`staff/${s.id}`, { isLocked: true });
      } else if (count <= 2 && s.unlockedAt) {
        dbUpdate(`staff/${s.id}`, { unlockedAt: null });
      }
    });
    staffList.forEach(s => { if (!byStaff[s.name] && s.unlockedAt) dbUpdate(`staff/${s.id}`, { unlockedAt: null }); });
  }, [customers, staffList, isUnlocked]);

  useEffect(() => {

      if (activeAlert || confirmModal || overdueReminder || adviceModal || quickReportCustomer || advisorCustomer) return;
      const now = new Date();
      let found = false;
      for (const c of customers) {
        if (c.salesRep !== currentStaff.name) continue;
        for (const apt of (c.appointments || [])) {
          if (apt.isCompleted) continue;
          const at = new Date(`${apt.date}T${apt.time}`);
          const diff = (at.getTime() - now.getTime()) / 60000;
          if (diff > 0 && diff <= 1440) {
            if (!dismissedOverdueRef.current.has(apt.id + '_upcoming')) {
              setActiveAlert({ id: apt.id, customerId: c.id, staffName: c.salesRep, customerName: c.name, type: c.type, alertType: 'upcoming',
                msg: `Bạn có cuộc hẹn với khách hàng ${c.name} vào lúc ${apt.time} ngày ${viDate(apt.date)}.` });
              found = true; break;
            }
          } else if (diff < 0) {
            if (!dismissedOverdueRef.current.has(apt.id + '_late')) {
              setActiveAlert({ id: apt.id, customerId: c.id, staffName: c.salesRep, customerName: c.name, type: c.type, alertType: 'late',
                msg: `Bạn đã bị trễ hẹn với khách hàng ${c.name} lúc ${apt.time} ngày ${viDate(apt.date)}. Vui lòng xác nhận đã hẹn hoặc thiết lập lịch hẹn mới!` });
              found = true; break;

        const today = getLocalDateString(new Date());

      }

        if (Date.now() - saved.timestamp < 12 * 3600 * 1000) return;

        if (made < saved.goal) {

  /* ============== GOP Y CUA CAP QUAN LY / BAN GIAM DOC ============== */
  const handleSaveFeedback = async (customerId, text) => {

  const handleFileUpload = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setPendingFileName(file.name);
    setExcelRawData(null); setExcelHeaders([]);
    setUploadBusy(true); setUploadMsg('Đang đọc file...');
    const reader = new FileReader();
    reader.onerror = () => {
      setUploadBusy(false); setUploadMsg('');
      notify('Không đọc được file (lỗi trình duyệt)', 'error'); setPendingFileName('');
    };
    reader.onload = (ev) => {
      try {
        /* ArrayBuffer thay cho readAsBinaryString: doc dung file .xlsx lon, khong loi ky tu */
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array', cellDates: true });
        if (!wb.SheetNames.length) throw new Error('no sheet');
        const ws = wb.Sheets[wb.SheetNames[0]];

        /* Doc dang mang 2 chieu de KHONG bo sot cot khi o dau tien trong */
        const matrix = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', blankrows: false, raw: false });
        if (matrix.length < 2) {
          setUploadBusy(false); setUploadMsg('');
          notify('File Excel không có dữ liệu (cần ít nhất 1 dòng tiêu đề + 1 dòng dữ liệu)', 'error');
          setPendingFileName(''); return;
        }

        /* Tim dong tieu de that su: dong dau tien co >=2 o co chu */
        let hIdx = 0;
        for (let i = 0; i < Math.min(matrix.length, 12); i++) {
          const filled = matrix[i].filter(v => String(v ?? '').trim() !== '').length;
          if (filled >= 2) { hIdx = i; break; }
        }

        const rawHeaders = matrix[hIdx].map((h, i) => {
          const t = String(h ?? '').trim();
          return t || `Cột ${i + 1}`;
        });
        /* Chong trung ten cot -> tranh mat cot khi Excel co 2 cot cung ten */
        const seen = {};
        const headers = rawHeaders.map(h => {
          if (seen[h] === undefined) { seen[h] = 0; return h; }
          seen[h] += 1; return `${h} (${seen[h] + 1})`;
        });

        const data = [];
        for (let i = hIdx + 1; i < matrix.length; i++) {
          const row = matrix[i];
          if (!row || row.every(v => String(v ?? '').trim() === '')) continue;
          const obj = {};
          headers.forEach((h, c) => { obj[h] = row[c] ?? ''; });
          data.push(obj);
        }

        if (!data.length) {
          setUploadBusy(false); setUploadMsg('');
          notify('File Excel không có dòng dữ liệu nào', 'error'); setPendingFileName(''); return;
        }

        setExcelHeaders(headers);
        setExcelRawData(data);

        /* Tu doan cot theo dung khung: Ten KH - Nguoi lien he - Dien thoai - Dia chi.
           Moi cot chi duoc nhan 1 lan (taken) de "Người liên hệ" khong bi cot SDT cuop mat. */
        const low = headers.map(h => h.toLowerCase().trim().replace(/\s+/g, ' '));
        const taken = new Set();
        const pick = (exact, partial) => {
          for (const k of exact) {
            const i = low.findIndex((h, idx) => !taken.has(idx) && h === k);
            if (i > -1) { taken.add(i); return headers[i]; }
          }
          for (const k of partial) {
            const i = low.findIndex((h, idx) => !taken.has(idx) && h.includes(k));
            if (i > -1) { taken.add(i); return headers[i]; }
          }
          return '';
        };

        /* Thu tu doan quan trong: doan cai co tu khoa dac trung nhat truoc */
        const mPhone = pick(
          ['số điện thoại', 'điện thoại', 'sđt', 'sdt', 'phone', 'mobile', 'số đt', 'đt'],
          ['điện thoại', 'sđt', 'sdt', 'phone', 'mobile']);
        const mContact = pick(
          ['người liên hệ', 'nguoi lien he', 'người đại diện', 'đại diện', 'liên hệ',
           'contact', 'người phụ trách', 'chủ nhà thuốc', 'dược sĩ'],
          ['người liên hệ', 'đại diện', 'liên hệ', 'contact', 'phụ trách', 'dược sĩ']);
        const mAddress = pick(
          ['địa chỉ', 'dia chi', 'address'],
          ['địa chỉ', 'dia chi', 'address']);
        const mName = pick(
          ['tên khách hàng', 'tên kh', 'khách hàng', 'tên nhà thuốc', 'nhà thuốc', 'tên', 'name'],
          ['tên', 'name', 'khách hàng', 'nhà thuốc', 'công ty', 'cơ sở']);

        setExcelMapping({ name: mName, contactPerson: mContact, phone: mPhone, address: mAddress });
        setUploadBusy(false);
        setUploadMsg(`Đã đọc ${data.length} dòng · ${headers.length} cột`);
        notify(`Đã đọc file: ${data.length} dòng, ${headers.length} cột`, 'success');
      } catch (err) {
        console.error('Excel read error:', err);
        setUploadBusy(false); setUploadMsg('');
        notify('Không đọc được file Excel. Hãy lưu lại dạng .xlsx rồi thử lại.', 'error');
        setPendingFileName('');
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';
  };

  /* Bo ve an toan: du loi gi xay ra, giao dien khong bao gio ket o trang thai "Dang luu" */
  const safeFinish = () => { try { rtResume(); } catch (e) {} setUploadBusy(false); setUploadMsg(''); };

  /* Them file moi vao Firebase (KHONG xoa cac file da co) — chia lo de khong vo gioi han REST */
  const handleConfirmMapping = async () => {
    if (!excelRawData) return;
    if (!excelMapping.name) { notify('Vui lòng chọn cột Tên khách hàng', 'error'); return; }
    if (uploadBusy) return;

    const fileId = uuid();
    const norm = (v) => {
      if (v === null || v === undefined) return '';
      if (v instanceof Date) return v.toLocaleDateString('vi-VN');
      return String(v).trim();
    };

    const rows = excelRawData.map(r => ({
      id: uuid(),
      fileId,
      name: norm(r[excelMapping.name]),
      /* Nguoi lien he: khong bat buoc -> de trong neu file khong co */
      contactPerson: excelMapping.contactPerson ? norm(r[excelMapping.contactPerson]) : '',
      /* SDT: bo dau cach/cham/gach, giu lai so 0 dau neu Excel da cat mat */
      phone: excelMapping.phone ? norm(r[excelMapping.phone]).replace(/[\s.\-()]/g, '') : '',
      address: excelMapping.address ? norm(r[excelMapping.address]) : '',
      isCalled: false,
      claimedBy: ''
    })).filter(c => c.name);

    if (!rows.length) {
      notify(`Không có dòng nào hợp lệ — cột "${excelMapping.name}" đang trống. Hãy chọn lại cột tên khách hàng.`, 'error', 5200);
      return;
    }

    /* AN TOAN: hien danh sach + luu localStorage NGAY, truoc khi dung toi Firebase.
       Du Firebase co hong hoan toan, nhan vien van co danh sach de goi. */
    setExcelCustomers(prev => {
      const ids = new Set(prev.map(p => p.id));
      const merged = [...prev, ...rows.filter(r => !ids.has(r.id))];
      try { localStorage.setItem('ideco_excelBackup', JSON.stringify(merged.slice(0, 8000))); } catch (e) {}
      return merged;
    });

    setUploadBusy(true);
    uploadCancelRef.current = false;
    setUploadMsg(`Kiểm tra kết nối Firebase...`);
    try {

    /* Thu ghi 1 ban ghi nho truoc -> phat hien ngay loi quyen/mang,
       thay vi treo giua chung khi da lưu do dang */
    const probeId = '__probe__';
    const probe = await dbUpdateDetailed('excelCustomers', { [probeId]: { t: Date.now() } }, 2, 12000);
    if (!probe.ok) {
      setUploadBusy(false); setUploadMsg('');
      setDbError({
        stage: 'Kiểm tra ghi thử',
        err: probe.err,
        hint: probe.hint,
        url: `${DB}/excelCustomers.json`
      });
      notify('Không ghi được vào Firebase — xem khung đỏ để biết nguyên nhân', 'error', 6000);
      return;
    }
    setDbError(null);
    await dbRemove(`excelCustomers/${probeId}`);

    setUploadMsg(`Chuẩn bị lưu ${rows.length} dòng...`);
    rtPause();   /* tam dung realtime -> khong tai lai ca danh sach giua chung */

    /* Chia lo theo DUNG LUONG (khong theo so dong): tieng Viet co dau 3 byte/ky tu,
       nen 400 dong co the vuot 1MB va Firebase se im lang tu choi -> treo. */
    const MAX_BYTES = 256 * 1024;   /* 256KB / lo — an toan tuyet doi */
    const MAX_ROWS  = 150;
    const batches = [];
    let cur = {}, curBytes = 0, curCount = 0;
    for (const r of rows) {
      const sz = JSON.stringify(r).length + r.id.length + 4;
      if (curCount > 0 && (curBytes + sz > MAX_BYTES || curCount >= MAX_ROWS)) {
        batches.push(cur); cur = {}; curBytes = 0; curCount = 0;
      }
      cur[r.id] = r; curBytes += sz; curCount++;
    }
    if (curCount > 0) batches.push(cur);

    let saved = 0;
    const failedBatches = [];
    let lastErr = null;
    for (let b = 0; b < batches.length; b++) {
      if (uploadCancelRef.current) break;
      const n = Object.keys(batches[b]).length;
      setUploadMsg(`Đang lưu ${saved}/${rows.length} dòng  ·  lô ${b + 1}/${batches.length}`);
      const res = await dbUpdateDetailed('excelCustomers', batches[b], 3, 25000);
      if (res.ok) saved += n;
      else {
        failedBatches.push(batches[b]);
        lastErr = res;
        /* Loi khong the khac phuc (rules/URL) -> dung ngay, khong nem tiep 30 lo vo ich */
        if (res.fatal) {
          setDbError({ stage: `Lưu lô ${b + 1}/${batches.length}`, err: res.err, hint: res.hint, url: `${DB}/excelCustomers.json` });
          break;
        }
      }
      /* nhuong CPU cho giao dien ve lai -> khong bi "dung hinh" */
      await new Promise(res2 => setTimeout(res2, 60));
    }
    if (lastErr && !lastErr.fatal) {
      setDbError({ stage: 'Lưu dữ liệu', err: lastErr.err, hint: lastErr.hint, url: `${DB}/excelCustomers.json` });
    }

    const cancelled = uploadCancelRef.current;

    if (saved === 0) {
      rtResume();
      setUploadBusy(false); setUploadMsg('');
      notify(cancelled
        ? 'Đã hủy — chưa lưu dòng nào.'
        : 'Không lưu được lên Firebase. Kiểm tra mạng / quyền ghi Database rồi thử lại.', 'error', 5500);
      return;
    }

    const okFile = await dbSet(`excelFiles/${fileId}`, {
      id: fileId,
      name: pendingFileName || ('File ' + new Date().toLocaleDateString('vi-VN')),
      uploadedAt: Date.now(),
      uploadedBy: currentStaff?.name || '',
      count: saved
    });

    /* Hien ngay tren man hinh, khong doi realtime day ve */
    const savedIds = new Set();
    batches.forEach((bt, i) => { if (!failedBatches.includes(bt)) Object.keys(bt).forEach(k => savedIds.add(k)); });
    setExcelCustomers(prev => {
      const ids = new Set(prev.map(p => p.id));
      return [...prev, ...rows.filter(r => savedIds.has(r.id) && !ids.has(r.id))];
    });
    if (okFile) {
      setExcelFiles(prev => ({
        ...prev,
        [fileId]: { id: fileId, name: pendingFileName || ('File ' + new Date().toLocaleDateString('vi-VN')),
                    uploadedAt: Date.now(), uploadedBy: currentStaff?.name || '', count: saved }
      }));
    }

    rtResume();
    setUploadBusy(false); setUploadMsg('');
    const missing = rows.length - saved;

    if (missing > 0) {
      /* Giu lai phan chua luu de bam "Lưu tiếp phần còn thiếu", khong phai lam lai tu dau */
      const savedNameSet = new Set(rows.filter(r => savedIds.has(r.id)).map(r => r.name));
      setResumeState({
        fileId,
        fileName: pendingFileName || 'File',
        rows: rows.filter(r => !savedIds.has(r.id)),
        total: rows.length,
        saved
      });
      notify(cancelled
        ? `Đã dừng — lưu được ${saved}/${rows.length} dòng. Bấm "Lưu tiếp" để hoàn tất.`
        : `Lưu được ${saved}/${rows.length} dòng — còn ${missing} dòng lỗi mạng. Bấm "Lưu tiếp" để hoàn tất.`, 'warning', 6000);
    } else {
      setResumeState(null);
      notify(`Đã thêm ${saved} khách hàng từ file "${pendingFileName}"`, 'success');
    }
    setExcelRawData(null); setExcelHeaders([]); setPendingFileName('');
    } catch (err) {
      console.error('upload error:', err);
      safeFinish();
      notify('Có lỗi bất ngờ khi lưu. Phần đã lưu vẫn giữ nguyên — hãy thử lại.', 'error', 5500);
    }
  };

  /* Luu tiep phan con thieu — dung lai dung fileId cu */
  const handleResumeUpload = async () => {
    if (!resumeState || uploadBusy) return;
    const { fileId, rows, total, saved: already } = resumeState;
    setUploadBusy(true);
    uploadCancelRef.current = false;
    rtPause();
    try {
    const MAX_BYTES = 256 * 1024, MAX_ROWS = 150;
    const batches = [];
    let cur = {}, curBytes = 0, curCount = 0;
    for (const r of rows) {
      const sz = JSON.stringify(r).length + r.id.length + 4;
      if (curCount > 0 && (curBytes + sz > MAX_BYTES || curCount >= MAX_ROWS)) {
        batches.push(cur); cur = {}; curBytes = 0; curCount = 0;
      }
      cur[r.id] = r; curBytes += sz; curCount++;
    }
    if (curCount > 0) batches.push(cur);

    let saved = 0;
    const stillFailed = [];
    for (let b = 0; b < batches.length; b++) {
      if (uploadCancelRef.current) break;
      const n = Object.keys(batches[b]).length;
      setUploadMsg(`Đang lưu tiếp ${already + saved}/${total} dòng  ·  lô ${b + 1}/${batches.length}`);
      const ok = await dbUpdateRetry('excelCustomers', batches[b], 4, 25000);
      if (ok) saved += n; else stillFailed.push(batches[b]);
      await new Promise(res => setTimeout(res, 60));
    }

    const okIds = new Set();
    batches.forEach(bt => { if (!stillFailed.includes(bt)) Object.keys(bt).forEach(k => okIds.add(k)); });
    setExcelCustomers(prev => {
      const ids = new Set(prev.map(p => p.id));
      return [...prev, ...rows.filter(r => okIds.has(r.id) && !ids.has(r.id))];
    });
    const totalSaved = already + saved;
    await dbUpdate(`excelFiles/${fileId}`, { count: totalSaved });
    setExcelFiles(prev => prev[fileId] ? { ...prev, [fileId]: { ...prev[fileId], count: totalSaved } } : prev);

    rtResume();
    setUploadBusy(false); setUploadMsg('');
    const left = rows.filter(r => !okIds.has(r.id));
    if (left.length) {
      setResumeState({ ...resumeState, rows: left, saved: totalSaved });
      notify(`Còn ${left.length} dòng chưa lưu được. Thử lại khi mạng ổn định hơn.`, 'warning', 5500);
    } else {
      setResumeState(null);
      notify(`Hoàn tất — đã lưu đủ ${totalSaved}/${total} khách hàng`, 'success');
    }
    } catch (err) {
      console.error('resume error:', err);
      safeFinish();
      notify('Có lỗi bất ngờ khi lưu tiếp. Hãy thử lại.', 'error', 5000);
    }
  };

  /* Xoa 1 file va toan bo dong thuoc file do */
  const handleDeleteExcelFile = (fileId, fileName) => {
    setConfirmModal({
      title: 'Xóa file danh sách',

      message: `Xóa file "${fileName}" và toàn bộ khách hàng thuộc file này khỏi hệ thống? Thao tác này cần mật khẩu quản trị.`,
      onConfirm: async () => {
        const victims = excelCustomers.filter(c => c.fileId === fileId);

        let done = 0, fail = 0;
        /* Xoa theo lo 300 -> khong treo khi file lon */
        for (let i = 0; i < victims.length; i += 300) {
          const upd = {};
          victims.slice(i, i + 300).forEach(c => { upd[c.id] = null; });
          const ok = await dbUpdateRetry('excelCustomers', upd, 3, 25000);
          if (ok) done += Object.keys(upd).length; else fail += Object.keys(upd).length;
          setUploadMsg(`Đang xóa ${done}/${victims.length} dòng...`);
        }
        await dbRemove(`excelFiles/${fileId}`);
        /* Cap nhat giao dien ngay */
        setExcelCustomers(prev => {

          try { localStorage.setItem('ideco_excelBackup', JSON.stringify(left.slice(0, 8000))); } catch (e) {}

  /* ===== KIEM TRA KET NOI FIREBASE — chay tung buoc de biet CHINH XAC hong o dau ===== */
  const runDiagnostic = async () => {
    if (diagRunning) return;
    setDiagRunning(true);
    setDiagResult(null);
    const steps = [];
    const add = (name, ok, detail) => steps.push({ name, ok, detail });

    /* 0. Dang dung duong truyen nao */
    add('Kết nối Firebase', FB_READY,
      FB_READY ? 'Dùng SDK WebSocket (giống bản gốc AI Studio chạy tốt)'
               : 'KHÔNG tải được Firebase SDK — đang chạy REST dự phòng. Kiểm tra mạng có chặn gstatic.com không.');

    /* 1. Giao thuc trang */
    const proto = location.protocol;
    add('Giao thức trang', proto !== 'file:', proto === 'file:'
      ? 'Đang mở bằng file:// — trình duyệt chặn gọi mạng. Hãy tải file lên hosting (Netlify/GitHub Pages) hoặc mở qua http://localhost.'
      : `${proto}// — hợp lệ`);

    /* 2. Trang co online khong */
    add('Kết nối Internet', navigator.onLine, navigator.onLine ? 'Có mạng' : 'Trình duyệt báo mất mạng');

    /* 3. Doc thu (GET) */
    let readOk = false;
    try {
      const r = await fetchTimeout(`${DB}/.json?shallow=true`, {}, 12000);
      readOk = r.ok;
      let b = ''; try { b = (await r.text()).slice(0, 200); } catch (e) {}
      add('Đọc dữ liệu (GET)', r.ok, r.ok ? 'Đọc được' : `HTTP ${r.status} — ${b}`);
    } catch (e) {
      add('Đọc dữ liệu (GET)', false, e.name === 'AbortError'
        ? 'Quá thời gian chờ — mạng chặn hoặc rất chậm'
        : `${e.name}: ${e.message} — thường do tường lửa/VPN chặn firebaseio.com`);
    }

    /* 4. Ghi thu (PATCH) — day la buoc quyet dinh */
    const tId = '__diag__' + Date.now();
    const w = await dbUpdateDetailed('__diag__', { [tId]: { t: Date.now() } }, 1, 12000);
    add('Ghi dữ liệu (thử 1 dòng)', w.ok,
      w.ok ? `Ghi được qua ${w.via} — quyền ghi OK` : `${w.err}${w.hint ? '  →  ' + w.hint : ''}`);

    /* 5. Ghi thu 1 lo lon giong that */
    let bulkOk = false;
    if (w.ok) {
      const fake = {};
      for (let i = 0; i < 150; i++) {
        fake['__diag_row_' + i] = { id: '__diag_row_' + i, fileId: tId,
          name: 'Nhà thuốc kiểm tra kết nối số ' + i, phone: '0909000' + i,
          address: 'Số ' + i + ' đường Nguyễn Văn Trỗi, Phường 12, Quận Phú Nhuận, TP Hồ Chí Minh',
          isCalled: false, claimedBy: '' };
      }
      const t0 = Date.now();
      const bw = await dbUpdateDetailed('__diag__', fake, 1, 25000);
      bulkOk = bw.ok;
      const kb = (new Blob([JSON.stringify(fake)]).size / 1024).toFixed(0);
      add('Ghi lô 150 dòng thật', bw.ok,
        bw.ok ? `Ghi ${kb}KB qua ${bw.via} trong ${((Date.now() - t0) / 1000).toFixed(1)}s — tốc độ ổn`
              : `${bw.err}${bw.hint ? '  →  ' + bw.hint : ''}`);
    } else {
      add('Ghi lô 150 dòng thật', false, 'Bỏ qua — bước ghi cơ bản đã lỗi');
    }

    /* Don dep */
    try { await dbRemove('__diag__'); } catch (e) {}

    const allOk = steps.every(s => s.ok);
    setDiagResult({ steps, allOk, when: new Date().toLocaleTimeString('vi-VN') });
    setDiagRunning(false);
  };

  /* Canh bao neu dong tab khi dang luu do len Firebase */

  /* ============== micro devices ============== */
  const stopMicMonitor = useCallback(() => {
    if (micRafRef.current) { cancelAnimationFrame(micRafRef.current); micRafRef.current = null; }
    try { micStreamRef.current?.getTracks().forEach(t => t.stop()); } catch (e) {}
    micStreamRef.current = null;
    try { micAudioCtxRef.current?.close(); } catch (e) {}
    micAudioCtxRef.current = null;
    setMicLevel(0);
  }, []);

  /* Mo stream de do muc am thanh -> giup chon dung micro */
  const startMicMonitor = useCallback(async (deviceId) => {
    stopMicMonitor();
    try {
      const constraints = {
        audio: deviceId
          ? { deviceId: { exact: deviceId }, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
          : { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      micStreamRef.current = stream;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      micAudioCtxRef.current = ctx;
      const src = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      const buf = new Uint8Array(analyser.frequencyBinCount);
      const loop = () => {
        analyser.getByteTimeDomainData(buf);
        let peak = 0;
        for (let i = 0; i < buf.length; i++) { const v = Math.abs(buf[i] - 128) / 128; if (v > peak) peak = v; }
        setMicLevel(Math.min(100, Math.round(peak * 260)));
        micRafRef.current = requestAnimationFrame(loop);
      };
      loop();
      return true;
    } catch (e) {
      return false;
    }
  }, [stopMicMonitor]);

  /* Liet ke micro: xin quyen truoc de lay duoc ten thiet bi day du */
  const refreshMicDevices = useCallback(async (askPermission = true) => {
    if (!navigator.mediaDevices?.enumerateDevices) { notify('Trình duyệt không hỗ trợ chọn micro', 'error'); return []; }
    setMicLoading(true);
    try {
      if (askPermission) {
        try {
          const s = await navigator.mediaDevices.getUserMedia({ audio: true });
          s.getTracks().forEach(t => t.stop());
        } catch (e) {
          notify('Bạn cần cho phép quyền Micro trên trình duyệt', 'error');
        }
      }
      const list = await navigator.mediaDevices.enumerateDevices();
      const mics = list.filter(d => d.kind === 'audioinput');
      setMicDevices(mics);
      /* neu micro da chon khong con ton tai -> quay ve mac dinh */
      if (selectedMicId && !mics.some(m => m.deviceId === selectedMicId)) {
        setSelectedMicId(''); setSelectedMicLabel('');
        try { localStorage.removeItem('ideco_micId'); localStorage.removeItem('ideco_micLabel'); } catch (e) {}

  /* Giu stream cua micro da chon mo san khi ghi am -> trinh duyet uu tien dung thiet bi nay */
  const ensureSelectedMicStream = useCallback(async () => {
