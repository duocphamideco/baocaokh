  /* ============== KHAI BAO NHANH: speech -> text -> AI fill form ============== */
  const stopVoiceDeclaration = useCallback(() => {
    voiceDeclListeningRef.current = false;
    setIsVoiceDeclListening(false);
    const r = voiceDeclRecognitionRef.current;
    voiceDeclRecognitionRef.current = null;
    if (r) { r.onend = null; r.onresult = null; try { r.stop(); } catch (e) {} }
  }, []);

  const startVoiceDeclaration = useCallback(async () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { notify('Trình duyệt không hỗ trợ chuyển giọng nói thành văn bản. Nên dùng Chrome/Edge mới.', 'error', 5000); return; }
    if (voiceDeclListeningRef.current) { stopVoiceDeclaration(); return; }
    /* Tranh 2 bo nhan dien chay cung luc */
    if (isGlobalListeningRef.current) {
      isGlobalListeningRef.current = false; setIsGlobalListening(false);
      const old = globalRecognitionRef.current;
      if (old) { old.onend = null; old.onresult = null; try { old.stop(); } catch (e) {} }
    }
    if (listeningFieldRef.current) { listeningFieldRef.current = null; setListeningField(null); try { recognitionRef.current?.stop(); } catch (e) {} }

    await ensureSelectedMicStream();
    const rec = new SR();
    rec.lang = 'vi-VN'; rec.interimResults = true; rec.continuous = true;
    voiceDeclBaseRef.current = voiceDeclaration || '';
    let interimNow = '';
    rec.onresult = (e) => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (final) {
        const p = final.trim();
        if (p) voiceDeclBaseRef.current += (voiceDeclBaseRef.current.trim() ? ' ' : '') + p;
        interimNow = '';
      } else interimNow = interim;
      setVoiceDeclaration(voiceDeclBaseRef.current + (interimNow ? (voiceDeclBaseRef.current.trim() ? ' ' : '') + interimNow : ''));
    };
    rec.onerror = (e) => {
      if (e && ['not-allowed','service-not-allowed'].includes(e.error)) {
        stopVoiceDeclaration(); notify('Micro đang bị chặn. Hãy cấp quyền Micro cho trang web.', 'error', 5000);
      }
    };
    rec.onend = () => {
      if (voiceDeclListeningRef.current) setTimeout(() => {
        if (voiceDeclListeningRef.current) { try { rec.start(); } catch (e) {} }
      }, 180);
    };
    voiceDeclRecognitionRef.current = rec;
    voiceDeclListeningRef.current = true; setIsVoiceDeclListening(true);
    try { rec.start(); } catch (e) { stopVoiceDeclaration(); notify('Không khởi động được Micro.', 'error'); }
  }, [voiceDeclaration, ensureSelectedMicStream, notify, stopVoiceDeclaration]);

  const handleAnalyzeVoiceDeclaration = async () => {
    const text = (voiceDeclaration || '').trim();
    if (!text) { notify('Hãy nói hoặc nhập nội dung khai báo trước khi phân tích AI.', 'warning'); return; }
    stopVoiceDeclaration();
    setIsVoiceDeclAnalyzing(true); setVoiceDeclNotice(null);
    try {
      const r = await analyzeVoiceCustomerDeclaration(text);
      const allowedTypes = Object.values(CustomerType);
      setFormData(prev => ({
        ...prev,
        name: r.name || prev.name,
        contactPerson: r.contactPerson || prev.contactPerson,
        phone: r.phone ? normPhone(r.phone) : prev.phone,
        address: r.address || prev.address,
        province: (r.province && VIETNAM_PROVINCES.includes(r.province)) ? r.province : prev.province,
        type: (r.type && allowedTypes.includes(r.type)) ? r.type : prev.type,
        report: r.report || prev.report,
        customerFeedback: r.customerFeedback || prev.customerFeedback || ''
      }));
      const missing = r.missing || [];
      const qualityIssues = r.qualityIssues || [];
      setVoiceQualityIssues(qualityIssues);
      setVoiceQualityAdvice(r.qualityAdvice || '');
      if (missing.length) {
        setVoiceDeclNotice({ type: 'warning', text: `AI đã điền các thông tin nhận diện được. Còn thiếu thông tin khai báo: ${missing.join(', ')}.` });
        notify(`Còn thiếu: ${missing.join(', ')}`, 'warning', 6500);
      } else if (qualityIssues.length) {
        setVoiceDeclNotice({ type: 'warning', text: 'AI đã tự điền dữ liệu. Báo cáo vẫn còn vài điểm nên bổ sung để Ban Giám đốc dễ xử lý hơn.' });
        notify('AI đã điền dữ liệu và phát hiện nội dung báo cáo nên bổ sung', 'warning', 5200);
      } else {
        setVoiceDeclNotice({ type: 'success', text: 'AI đã nhận diện đủ thông tin và báo cáo có các nội dung chính cần thiết.' });
        notify('Đã phân tích và tự động điền thông tin khách hàng', 'success', 3600);
      }
    } catch (e) {
      if (e && e.message === 'NO_KEY') {
        setVoiceDeclNotice({ type: 'error', text: 'Chưa có Gemini API key. Vào Hệ thống → Cài đặt AI để nhập/lưu key.' });
        notify('Chưa có Gemini API key', 'error', 5000);
      } else {
        setVoiceDeclNotice({ type: 'error', text: 'Gemini chưa phân tích được nội dung. Kiểm tra mạng/API key rồi thử lại.' });
        notify('Lỗi kết nối Gemini khi phân tích khai báo', 'error');
      }
    } finally { setIsVoiceDeclAnalyzing(false); }
  };

  /* ============== speech to text ============== */
  const applyTranscript = (field, txt) => {
    if (field === 'appointmentContent') setNewAppointment(prev => ({ ...prev, content: txt }));
    else setFormData(prev => ({ ...prev, [field]: txt }));
  };

  const startGlobalRecognition = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { notify('Trình duyệt không hỗ trợ nhận diện giọng nói', 'error'); return; }
    if (globalRecognitionRef.current) {
      const old = globalRecognitionRef.current;
      old.onend = null; old.onresult = null;
      try { old.stop(); } catch (e) {}
    }
    const rec = new SR();
    rec.lang = 'vi-VN'; rec.interimResults = true; rec.continuous = true;
    globalRecognitionRef.current = rec;
    let interimNow = '';
    rec.onresult = (e) => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      const field = activeFieldRef.current;
      if (!field) return;
      if (final) {
        let p = final;
        if (field === 'phone') p = p.replace(/\s+/g, '');
        else if (['name', 'contactPerson', 'address', 'province'].includes(field))
          p = p.toLowerCase().replace(/(?:^|\s)\S/g, a => a.toUpperCase());
        else p = p.charAt(0).toUpperCase() + p.slice(1);
        textBeforeRecordingRef.current += (textBeforeRecordingRef.current ? ' ' : '') + p;
        interimNow = '';
      } else interimNow = interim;
      const stream = textBeforeRecordingRef.current + (interimNow ? (textBeforeRecordingRef.current ? ' ' : '') + interimNow : '');
      applyTranscript(field, stream);
    };
    rec.onend = () => { if (isGlobalListeningRef.current) setTimeout(() => { if (isGlobalListeningRef.current) startGlobalRecognition(); }, 120); };
    try { rec.start(); } catch (e) {
      setTimeout(() => { if (isGlobalListeningRef.current) { try { rec.start(); } catch (err) {} } }, 500);
    }
  };

  const toggleGlobalListening = () => {
    if (isGlobalListeningRef.current) {
      isGlobalListeningRef.current = false;
      setIsGlobalListening(false);
      const r = globalRecognitionRef.current;
      if (r) { r.onend = null; r.onresult = null; try { r.stop(); } catch (e) {} }
    } else {
      if (listeningFieldRef.current) { listeningFieldRef.current = null; setListeningField(null); try { recognitionRef.current?.stop(); } catch (e) {} }
      const f = activeFieldRef.current;
      textBeforeRecordingRef.current = f
        ? (f === 'appointmentContent' ? (newAppointment.content || '') : (formData[f] || ''))
        : '';
      isGlobalListeningRef.current = true;
      setIsGlobalListening(true);
      ensureSelectedMicStream().finally(() => startGlobalRecognition());
    }
  };

  const startRecognition = (field) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { notify('Trình duyệt không hỗ trợ nhận diện giọng nói', 'error'); return; }
    const rec = new SR();
    rec.lang = 'vi-VN'; rec.interimResults = true;
    recognitionRef.current = rec;
    rec.onresult = (e) => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (final) {
        let p = final;
        if (field === 'name') p = p.toLowerCase().replace(/(?:^|\s)\S/g, a => a.toUpperCase());
        if (field === 'phone') p = p.replace(/\s+/g, '');
        textBeforeRecordingRef.current += (textBeforeRecordingRef.current ? ' ' : '') + p;
      }
      const stream = textBeforeRecordingRef.current + (interim ? (textBeforeRecordingRef.current ? ' ' : '') + interim : '');
      applyTranscript(field, stream);
    };
    rec.onend = () => { if (listeningFieldRef.current === field) { try { rec.start(); } catch (e) {} } };
    try { rec.start(); } catch (e) {}
  };

  const toggleListening = (field) => {
    if (listeningFieldRef.current === field) {
      listeningFieldRef.current = null; setListeningField(null);
      try { recognitionRef.current?.stop(); } catch (e) {}
    } else {
      try { recognitionRef.current?.stop(); } catch (e) {}
      textBeforeRecordingRef.current = field === 'appointmentContent' ? (newAppointment.content || '') : (formData[field] || '');
      listeningFieldRef.current = field; setListeningField(field);
      ensureSelectedMicStream().finally(() => startRecognition(field));
    }
  };

  const handleFocus = (field) => {
    activeFieldRef.current = field;
    if (isGlobalListeningRef.current) {
      textBeforeRecordingRef.current = field === 'appointmentContent' ? (newAppointment.content || '') : (formData[field] || '');
      startGlobalRecognition();
    }
  };

  /* ============== derived ============== */
  const myCustomers = useMemo(() => customers
    .filter(c => currentStaff ? c.salesRep === currentStaff.name : true)
    .filter(c => statusFilter ? c.status === statusFilter : true)
    .filter(c => {
      const q = searchTerm.toLowerCase().trim();
      if (!q) return true;
      return (c.name || '').toLowerCase().includes(q)
        || (c.phone || '').includes(q)
        || (c.contactPerson || '').toLowerCase().includes(q)
        || (c.province || '').toLowerCase().includes(q);
    })
    .sort((a, b) => {
      const oa = isCustomerOverdue(a) ? 0 : 1, ob = isCustomerOverdue(b) ? 0 : 1;
      if (oa !== ob) return oa - ob;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    }), [customers, currentStaff, searchTerm, statusFilter]);

  const todayStats = useMemo(() => {
    const today = getLocalDateString(new Date());
    const mine = customers.filter(c => currentStaff ? c.salesRep === currentStaff.name : true);
    return {
      total: mine.length,
      today: mine.filter(c => c.transactionDate === today).length,
      won: mine.filter(c => c.status === TransactionStatus.THANH_CONG || c.status === TransactionStatus.THANH_CONG_SP_MOI).length,
      overdue: mine.filter(isCustomerOverdue).length
    };
  }, [customers, currentStaff]);


  /* ============================== LOGIN ============================== */
  if (!isUnlocked) {
    return (
      <div className="h-full flex items-center justify-center p-5 relative overflow-hidden"
           style={{ background: 'linear-gradient(150deg,#0b2545 0%,#13315c 45%,#1d6fd0 100%)' }}>
        <div className="absolute -top-24 -right-20 w-80 h-80 rounded-full blur-3xl" style={{ background: 'rgba(61,155,233,.28)' }} />
        <div className="absolute -bottom-24 -left-16 w-72 h-72 rounded-full blur-3xl" style={{ background: 'rgba(15,157,118,.22)' }} />

        <div className={`relative z-10 w-full max-w-[400px] bg-white rounded-[28px] p-8 sm:p-10 shadow-pop ${loginShake ? 'shake' : 'pop-in'}`}>
          <div className="flex items-center gap-3 mb-8">
            <div className="w-12 h-12 rounded-2xl bg-ink text-white flex items-center justify-center shrink-0">
              <I.UserCheck width="22" height="22" />
            </div>
            <div className="leading-tight">
              <p className="font-display text-[19px] font-extrabold tracking-tight text-ink">IDECO</p>
              <p className="text-[10px] font-bold tracking-[.18em] uppercase text-slate-400">Báo cáo giao dịch</p>
            </div>
          </div>

          <h1 className="font-display text-[19px] sm:text-[21px] leading-[1.28] font-extrabold text-ink mb-2">
            Hãy cùng nhau khai báo <span className="text-brand">real time</span> tại thời điểm giao để cập nhật đúng tình hình xử lý khách — giúp cùng nhau chốt thành công.
          </h1>
          <p className="text-[13px] text-slate-500 mb-7">Nhập mật khẩu truy cập để bắt đầu phiên làm việc.</p>

          <input
            type="password" autoFocus value={loginInput}
            onChange={e => setLoginInput(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleLogin()}
            placeholder="••••••••"
            className="fld text-center font-mono text-lg tracking-[.35em] py-4 mb-3"
          />

          <label className="flex items-center gap-2.5 mb-4 cursor-pointer select-none">
            <input type="checkbox" checked={rememberLogin}
                   onChange={e => {
                     const v = e.target.checked;
                     setRememberLogin(v);
                     try {
                       if (!v) { localStorage.removeItem('ideco_savedPass'); localStorage.removeItem('ideco_remember'); }
                       else localStorage.setItem('ideco_remember', '1');
                     } catch (err) {}
                   }}
                   className="w-4 h-4 accent-[#1d6fd0] shrink-0" />
            <span className="text-[12.5px] font-semibold text-slate-500">Ghi nhớ mật khẩu trên máy này</span>
          </label>

          <button onClick={handleLogin}
            className="btn w-full py-4 bg-ink text-white text-[13px] tracking-[.14em] uppercase shadow-lift hover:bg-ink2">
            Truy cập hệ thống
          </button>

          <p className="text-[11px] text-slate-400 mt-6 text-center leading-relaxed">
            Quên mật khẩu? Liên hệ quản trị viên — đổi mật khẩu trong <span className="font-bold text-slate-500">Hệ thống → Bảo mật</span>.
          </p>
          <p className="text-[10.5px] text-slate-400 mt-3 text-center font-semibold tracking-wide">
            Ứng dụng được phát triển bởi: <span className="font-extrabold text-ink">MTRIET</span>
          </p>
        </div>
      </div>
    );
  }

  const locked = !!currentStaff?.isLocked;
  /* Ban ghi dang mo trong "Bao cao nhanh" luon lay ban moi nhat tu Firebase */
  const liveQuickReport = quickReportCustomer
    ? (customers.find(c => c.id === quickReportCustomer.id) || quickReportCustomer)
    : null;
  /* Nút Huyền gợi ý ngoài danh sách cũng luôn dùng bản khách hàng mới nhất từ Firebase */
  const liveAdvisorCustomer = advisorCustomer
    ? (customers.find(c => c.id === advisorCustomer.id) || advisorCustomer)
    : null;
  /* So gop y chua xem cua nhan vien dang dang nhap */
  const unseenFeedbackCount = currentStaff
    ? customers.filter(c => c.salesRep === currentStaff.name && c.feedback && c.feedback.text && !c.feedback.seenAt).length
    : 0;

  /* ============================== MAIN ============================== */
  return (
    <div className="h-full flex flex-col bg-paper overflow-hidden">

      <Popups
        celebrationQueue={celebrationQueue} setCelebrationQueue={setCelebrationQueue}
        performanceAlert={performanceAlert} setPerformanceAlert={setPerformanceAlert}
        showTargetPopup={showTargetPopup} targetGoal={targetGoal} setTargetGoal={setTargetGoal}
        handleConfirmTarget={handleConfirmTarget}
        targetWarning={targetWarning} setTargetWarning={setTargetWarning}
        quickReportCustomer={liveQuickReport} setQuickReportCustomer={setQuickReportCustomer}
        advisorCustomer={liveAdvisorCustomer} setAdvisorCustomer={setAdvisorCustomer}
        mgrUnlocked={mgrUnlocked} setMgrUnlocked={setMgrUnlocked}
        onSaveFeedback={handleSaveFeedback} onDeleteFeedback={handleDeleteFeedback}
        notify={notify}
      />

      {/* GOP Y MOI TU BAN GIAM DOC */}
      <Modal open={!!(feedbackInbox && feedbackInbox.length)} z={1086} max="max-w-md" onClose={() => setFeedbackInbox(null)}>
        {feedbackInbox && feedbackInbox.length > 0 && (
          <div className="p-7">
            <Ring color="bg-rose-50 text-crimson pulse-ring" icon={<I.Message width="26" height="26" />} />
            <h3 className="font-display text-[19px] font-extrabold text-ink mb-1 text-center">Góp ý từ Ban Giám đốc</h3>
            <p className="text-[13px] text-slate-500 text-center mb-5">
              Bạn có <span className="font-extrabold text-crimson">{feedbackInbox.length}</span> góp ý cần xem và triển khai.
            </p>
            <div className="space-y-2 max-h-[46vh] overflow-y-auto pr-1">
              {feedbackInbox.map(c => (
                <button key={c.id} onClick={() => handleOpenFeedback(c)}
                  className="spine w-full text-left bg-paper rounded-2xl p-4 pl-5 hover:bg-white hover:shadow-soft transition"
                  style={{ '--spine': '#d8324b' }}>
                  <p className="font-bold text-ink text-[14px] truncate">{c.name}</p>
                  <p className="text-[12px] text-slate-500 mt-1 line-clamp-2">{c.feedback?.text}</p>
                  <p className="text-[10.5px] font-bold uppercase tracking-wide text-crimson mt-2">Bấm để xem chi tiết</p>
                </button>
              ))}
            </div>
            <button onClick={() => setFeedbackInbox(null)}
              className="btn w-full py-4 mt-5 bg-ink text-white text-[13px] uppercase tracking-wider">Để sau</button>
          </div>
        )}
      </Modal>

      {/* appointment alert */}
      <Modal open={!!activeAlert} z={1000} max="max-w-sm" shake={activeAlert?.alertType === 'late'}>
        {activeAlert && (
          <div className="p-8 text-center">
            <Ring color={activeAlert.alertType === 'upcoming' ? 'bg-blue-50 text-brand' : 'bg-rose-50 text-crimson pulse-ring'}
                  icon={activeAlert.alertType === 'upcoming' ? <I.Clock width="26" height="26" /> : <I.Alert width="26" height="26" />} />
            <h3 className="font-display text-[20px] font-extrabold text-ink mb-1">Cảnh báo lịch hẹn</h3>
            <p className="font-bold text-ink mb-4">Chào bạn {activeAlert.staffName}!</p>
            <div className="bg-paper rounded-2xl p-4 mb-6 text-[13px] text-slate-600 leading-relaxed">{activeAlert.msg}</div>
            <button onClick={handleConfirmAlert}
              className={`btn w-full py-4 text-white text-[13px] uppercase tracking-wider shadow-lift ${activeAlert.alertType === 'upcoming' ? 'bg-brand' : 'bg-crimson'}`}>
              {activeAlert.alertType === 'upcoming' ? 'Đã nhận thông báo' : 'Đã xác nhận'}
            </button>
          </div>
        )}
      </Modal>

      {/* overdue reminder */}
      <Modal open={!!overdueReminder} z={1010} max="max-w-sm">
        {overdueReminder && (
          <div className="p-8 text-center">
            <Ring color="bg-rose-50 text-crimson pulse-ring" icon={<I.Calendar width="26" height="26" />} />
            <h3 className="font-display text-[19px] font-extrabold text-ink mb-4">Nhắc nhở quá hạn</h3>
            <p className="lbl mb-1">Khách hàng</p>
            <p className="font-display text-[20px] font-extrabold text-ink mb-5">{overdueReminder.customerName}</p>
            <div className="spine bg-rose-50/70 rounded-2xl p-4 pl-5 text-left mb-5" style={{ '--spine': '#d8324b' }}>
              <p className="text-[10px] font-extrabold uppercase tracking-wider text-crimson mb-1">Nội dung hẹn cũ ({viDate(overdueReminder.date)})</p>
              <p className="text-[13px] font-semibold text-ink">{overdueReminder.content}</p>
            </div>
            <p className="text-[12px] text-slate-500 italic mb-6 leading-relaxed">"Nên cập nhật cuộc hẹn đúng và nội dung báo cáo giao dịch mới nhất"</p>
            <button onClick={() => { dismissedOverdueRef.current.add(overdueReminder.id); setOverdueReminder(null); }}
              className="btn w-full py-4 bg-crimson text-white text-[13px] uppercase tracking-wider shadow-lift">Đã hiểu</button>
          </div>
        )}
      </Modal>

      {/* AI advice */}
      <Modal open={!!adviceModal} z={1020} max="max-w-md" onClose={() => setAdviceModal(null)}>
        <div className="p-7">
          <div className="flex items-center gap-3 mb-5">
            <div className="w-11 h-11 rounded-2xl bg-violet-50 text-violet2 flex items-center justify-center"><I.Sparkles width="20" height="20" /></div>
            <div>
              <h3 className="font-display text-[18px] font-extrabold text-ink leading-tight">Lời khuyên từ IDECO</h3>
              <p className="text-[11px] text-slate-400 font-semibold">Trợ lý BGĐ</p>
            </div>
          </div>
          <div className="spine bg-violet-50/50 rounded-2xl p-5 pl-6 max-h-[52vh] overflow-y-auto" style={{ '--spine': '#6d4de0' }}>
            <p className="text-[13.5px] text-ink leading-relaxed whitespace-pre-line">{adviceModal}</p>
          </div>
          <button onClick={() => setAdviceModal(null)} className="btn w-full py-4 mt-6 bg-ink text-white text-[13px] uppercase tracking-wider">Đã hiểu</button>
        </div>
      </Modal>

      {/* overdue following list */}
      <Modal open={!!overdueFollowingAlert} z={1015} max="max-w-lg">
        {overdueFollowingAlert && (
          <div className="p-7">
            <div className="flex items-center gap-3 mb-4">
              <div className="w-11 h-11 rounded-2xl bg-amber-50 text-amber2 flex items-center justify-center"><I.Alert width="20" height="20" /></div>
              <h3 className="font-display text-[18px] font-extrabold text-ink leading-tight">Cảnh báo theo dõi quá hạn</h3>
            </div>
            <p className="text-[13px] text-slate-500 mb-5 leading-relaxed">Các bạn nên xem lại những khách hàng này gấp hay đổi ngay phương án khác để kịp mục tiêu:</p>
            <div className="space-y-2 max-h-[42vh] overflow-y-auto pr-1">
              {overdueFollowingAlert.map((c) => {
                const today = getLocalDateString(new Date());
                const items = (c.appointments || []).filter(a => !a.isCompleted && a.date < today).sort((a, b) => b.date.localeCompare(a.date));
                const d = items[0] ? items[0].date : c.transactionDate;
                return (
                  <button key={c.id} onClick={() => { setOverdueFollowingAlert(null); handleEditCustomer(c); }}
                    className="spine w-full text-left bg-white border border-line rounded-2xl p-4 pl-5 hover:border-amber2 transition" style={{ '--spine': '#e08a1e' }}>
                    <p className="font-bold text-ink text-[14px] mb-1">{c.name}</p>
                    <div className="flex justify-between text-[11px] font-semibold">
                      <span className="text-slate-400">NV <span className="text-amber2">{c.salesRep}</span></span>
                      <span className="text-slate-400">Hẹn trễ <span className="text-crimson font-mono">{viDate(d)}</span></span>
                    </div>
                  </button>
                );
              })}
            </div>
            <button onClick={() => setOverdueFollowingAlert(null)} className="btn w-full py-4 mt-6 bg-amber2 text-white text-[13px] uppercase tracking-wider shadow-lift">Dạ vâng</button>
          </div>
        )}
      </Modal>

      {/* report warning */}
      <Modal open={!!reportWarningMsg} z={1030} max="max-w-md">
        <div className="p-7">
          <div className="flex items-center gap-3 mb-5">

            <h3 className="font-display text-[18px] font-extrabold text-ink leading-tight">AI nhắc nhở từ BGĐ</h3>
          </div>
          <div className="spine bg-amber-50/60 rounded-2xl p-5 pl-6 max-h-[50vh] overflow-y-auto" style={{ '--spine': '#e08a1e' }}>
            <p className="text-[13.5px] text-ink leading-relaxed whitespace-pre-line">{reportWarningMsg}</p>
          </div>
          <button onClick={() => setReportWarningMsg(null)} className="btn w-full py-4 mt-6 bg-amber2 text-white text-[13px] uppercase tracking-wider shadow-lift">Đã hiểu, tôi sẽ bổ sung</button>
        </div>
      </Modal>

      {/* ============ CHON MICRO ============ */}
      <Modal open={showMicPicker} z={1060} max="max-w-md" onClose={() => setShowMicPicker(false)}>
        <div className="p-6 sm:p-7">
          <div className="flex items-center gap-3 mb-1">
            <div className="w-11 h-11 rounded-2xl bg-blue-50 text-brand flex items-center justify-center shrink-0"><I.Mic width="20" height="20" /></div>
            <div className="min-w-0">
              <h3 className="font-display text-[18px] font-extrabold text-ink leading-tight">Thiết bị micro</h3>
              <p className="text-[11.5px] text-slate-400 font-semibold">Chọn micro của máy hoặc thiết bị gắn ngoài</p>
            </div>
            <button onClick={() => refreshMicDevices(true)} className="btn ml-auto w-9 h-9 bg-paper text-slate-400 hover:text-brand shrink-0" title="Quét lại thiết bị">
              <I.Refresh width="15" height="15" className={micLoading ? 'animate-spin' : ''} />
            </button>
          </div>

          {/* thanh do muc am -> noi thu de kiem tra */}

                      placeholder="VD: Gọi điện tư vấn lại..." className="fld bg-white" />
                  </Field>
                  <button onClick={handleAddAppointment} className="btn w-full py-3 bg-ink text-white text-[13px] uppercase tracking-wider">
                    <I.Plus width="15" height="15" /> Lập lịch hẹn
                  </button>
                </div>

                <div className="space-y-2 mt-4">
                  {(formData.appointments || []).map(a => {
                    const past = a.date < getLocalDateString(new Date());
                    return (
                      <div key={a.id} className={`spine rounded-2xl border p-4 pl-5 flex items-center gap-3 ${a.isCompleted ? 'bg-paper border-transparent opacity-50' : 'bg-white border-line'}`}
                           style={{ '--spine': a.isCompleted ? '#cbd5e1' : (past ? '#d8324b' : '#1d6fd0') }}>
                        <div className="flex-1 min-w-0">
                          <p className="font-mono font-bold text-[13px] text-ink">{viDate(a.date)} · {a.time}</p>
                          <p className="text-[12.5px] text-slate-500 mt-0.5">{a.content}</p>
                        </div>
                        <button onClick={() => setFormData({ ...formData, appointments: formData.appointments.filter(x => x.id !== a.id) })}
                          className="btn w-9 h-9 bg-rose-50 text-crimson shrink-0"><I.Trash width="15" height="15" /></button>
                      </div>
                    );
                  })}
                  {(formData.appointments || []).length === 0 && (
                    <p className="text-center text-[12.5px] text-slate-400 py-4">Chưa có lịch hẹn. Thêm một lịch hẹn để lưu được hồ sơ.</p>
                  )}
                </div>
              </section>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}


/* ============================== POPUPS ============================== */
function Popups({
  celebrationQueue, setCelebrationQueue,
  performanceAlert, setPerformanceAlert,
  showTargetPopup, targetGoal, setTargetGoal, handleConfirmTarget,
  targetWarning, setTargetWarning,
  quickReportCustomer, setQuickReportCustomer,
  advisorCustomer, setAdvisorCustomer,
  mgrUnlocked, setMgrUnlocked,
  onSaveFeedback, onDeleteFeedback, notify
}) {
  const firedRef = useRef(null);

  /* ================= GOP Y CUA CAP QUAN LY / BAN GIAM DOC ================= */
  const fb = (quickReportCustomer && quickReportCustomer.feedback && quickReportCustomer.feedback.text)
    ? quickReportCustomer.feedback : null;

  const [fbEditing, setFbEditing] = useState(false);
  const [fbText, setFbText]       = useState('');
  const [fbGate, setFbGate]       = useState(false);
  const [fbPass, setFbPass]       = useState('');
  const [fbShake, setFbShake]     = useState(false);
  const [fbSaving, setFbSaving]   = useState(false);
  const [fbListening, setFbListening] = useState(false);
  const fbRecRef  = useRef(null);
  const fbBaseRef = useRef('');

  /* AI co van tren HO SO DA LUU MOI NHAT */
  const [advisorBusy, setAdvisorBusy] = useState(false);
  const [advisorResult, setAdvisorResult] = useState(null);
  const [advisorError, setAdvisorError] = useState('');

  /* Huyền Turbo chỉ áp dụng cho AI cố vấn xử lý khách hàng. */
  const [huyenTurbo, setHuyenTurbo] = useState(() => {
    try { return sessionStorage.getItem('ideco_huyen_turbo') === '1'; } catch (e) { return false; }
  });
  const [turboNotice, setTurboNotice] = useState(false);
  const turboNoticeTimerRef = useRef(null);

  const toggleHuyenTurbo = () => {
    setHuyenTurbo(prev => {
      const next = !prev;
      try { sessionStorage.setItem('ideco_huyen_turbo', next ? '1' : '0'); } catch (e) {}
      if (next) {
        setTurboNotice(true);
        clearTimeout(turboNoticeTimerRef.current);
        turboNoticeTimerRef.current = setTimeout(() => setTurboNotice(false), 7000);
        notify && notify('Huyền Turbo đã bật — Huyền sẽ ráng hết sức để phản hồi bạn nhé!', 'warning');
      } else {
        setTurboNotice(false);
        notify && notify('Huyền Turbo đã tắt — quay về chế độ thường.', 'info');
      }
      return next;
    });
  };

  const runAdvisor = async () => {
    if (!quickReportCustomer) return;
    setAdvisorBusy(true); setAdvisorError(''); setAdvisorResult(null);
    try {
      const r = await analyzeLatestCustomerStrategy(quickReportCustomer, { turbo: huyenTurbo });
      setAdvisorResult(r);
    } catch (e) {
      const msg = String(e && e.message || e);
      setAdvisorError(huyenTurbo
        ? 'Huyền đã thử Turbo và tự chuyển qua các API dự phòng nhưng vẫn chưa kết nối được. Bạn vui lòng thử lại sau ít phút.'
        : (msg === 'NO_KEY' ? 'Chưa có API AI. Vào Hệ thống → Cài đặt AI để nhập API dự phòng.' : 'Huyền đã thử các API dự phòng nhưng chưa phân tích được hồ sơ này. Bạn thử lại sau ít phút.'));
    } finally { setAdvisorBusy(false); }
  };

  /* Cố vấn mở trực tiếp từ thẻ khách hàng: mở là tự phân tích, không cần bấm lần hai */
  const [directAdvisorBusy, setDirectAdvisorBusy] = useState(false);
  const [directAdvisorResult, setDirectAdvisorResult] = useState(null);
  const [directAdvisorError, setDirectAdvisorError] = useState('');

  useEffect(() => {
    let cancelled = false;
    const run = async () => {
      if (!advisorCustomer) {
        setDirectAdvisorBusy(false); setDirectAdvisorResult(null); setDirectAdvisorError('');
        return;
      }
      setDirectAdvisorBusy(true); setDirectAdvisorResult(null); setDirectAdvisorError('');
      try {
        const r = await analyzeLatestCustomerStrategy(advisorCustomer, { turbo: huyenTurbo });
        if (!cancelled) setDirectAdvisorResult(r);
      } catch (e) {
        if (cancelled) return;
        const msg = String(e && e.message || e);
        setDirectAdvisorError(huyenTurbo
          ? 'Huyền đã thử Turbo và tự chuyển qua API dự phòng nhưng vẫn chưa kết nối được. Bạn thử lại sau ít phút.'
          : (msg === 'NO_KEY' ? 'Chưa có API AI. Vào Hệ thống → Cài đặt AI để nhập API dự phòng.' : 'Huyền đã thử các API dự phòng nhưng chưa phân tích được hồ sơ này. Bạn thử lại sau ít phút.'));
      } finally { if (!cancelled) setDirectAdvisorBusy(false); }
    };
    run();
    return () => { cancelled = true; };
  }, [advisorCustomer ? advisorCustomer.id : null, advisorCustomer ? advisorCustomer.updatedAt : null, huyenTurbo]);

  const rerunDirectAdvisor = async () => {
    if (!advisorCustomer) return;
    setDirectAdvisorBusy(true); setDirectAdvisorResult(null); setDirectAdvisorError('');
    try {
      const r = await analyzeLatestCustomerStrategy(advisorCustomer, { turbo: huyenTurbo });
      setDirectAdvisorResult(r);
    } catch (e) {
      const msg = String(e && e.message || e);
      setDirectAdvisorError(huyenTurbo
        ? 'Huyền Turbo chưa kết nối được Kie.ai Turbo 3.7 Flash. Huyền sẽ tự chuyển sang chế độ thường và các API dự phòng; bạn cũng có thể thử lại sau.'
        : (msg === 'NO_KEY' ? 'Chưa có API key AI. Vào Hệ thống → Cài đặt AI để nhập key.' : 'Huyền chưa phân tích được hồ sơ này. Kiểm tra kết nối/API key rồi thử lại.'));
    } finally { setDirectAdvisorBusy(false); }
  };


  const stopFbMic = () => {
    const r = fbRecRef.current;
    fbRecRef.current = null;
    if (r) { r.onend = null; r.onresult = null; try { r.stop(); } catch (e) {} }
    setFbListening(false);
  };

  const startFbMic = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { notify && notify('Trình duyệt không hỗ trợ nhận diện giọng nói', 'error'); return; }
    const rec = new SR();
    rec.lang = 'vi-VN'; rec.interimResults = true; rec.continuous = true;
    fbBaseRef.current = fbText || '';
    let interimNow = '';
    rec.onresult = (e) => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (final) {
        const p = final.charAt(0).toUpperCase() + final.slice(1);
        fbBaseRef.current += (fbBaseRef.current ? ' ' : '') + p;
        interimNow = '';
      } else interimNow = interim;
      setFbText(fbBaseRef.current + (interimNow ? (fbBaseRef.current ? ' ' : '') + interimNow : ''));
    };
    rec.onend = () => { if (fbRecRef.current === rec) { try { rec.start(); } catch (e) {} } };
    fbRecRef.current = rec; setFbListening(true);
    try { rec.start(); } catch (e) {}
  };

  const toggleFbMic = () => { if (fbRecRef.current) stopFbMic(); else startFbMic(); };

  /* Doi ho so -> dong o soan thao, nap lai noi dung */
  useEffect(() => {
    stopFbMic();
    setFbEditing(false); setFbGate(false); setFbPass(''); setFbSaving(false);
    setAdvisorResult(null); setAdvisorError(''); setAdvisorBusy(false);
    setFbText((quickReportCustomer && quickReportCustomer.feedback && quickReportCustomer.feedback.text) || '');
    return () => stopFbMic();
  }, [quickReportCustomer ? quickReportCustomer.id : null]);

  const fbWhen = (t) => {
    try {
      return new Date(t).toLocaleString('vi-VN',
        { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' });
    } catch (e) { return ''; }
  };

  const openFbEditor = () => {
    /* Nâng cấp: từ danh sách khách hàng -> Báo cáo nhanh -> Góp ý không hỏi lại mật khẩu */
    setFbGate(false); setFbPass('');
    setFbText(fb ? fb.text : ''); setFbEditing(true);
  };

  const tryUnlockFb = () => {
    if (fbPass === MASTER_KEY) {
      setMgrUnlocked(true); setFbGate(false); setFbPass('');
      setFbText(fb ? fb.text : ''); setFbEditing(true);
      notify && notify('Đã mở quyền góp ý cho phiên làm việc này', 'success', 2600);
    } else {
      setFbShake(true); setTimeout(() => setFbShake(false), 520);
      notify && notify('Mã bảo mật không đúng!', 'error');
    }
  };

  const doSaveFb = async () => {
    if (!quickReportCustomer) return;
    stopFbMic(); setFbSaving(true);
    const ok = await onSaveFeedback(quickReportCustomer.id, fbText);
    setFbSaving(false);
    if (ok) { setFbEditing(false); setQuickReportCustomer(null); }
  };

  const doDeleteFb = async () => {
    if (!quickReportCustomer) return;
    stopFbMic();
    if (!fb) { setFbEditing(false); setFbText(''); return; }
    setFbSaving(true);
    const ok = await onDeleteFeedback(quickReportCustomer.id);
    setFbSaving(false);
    if (ok) { setFbEditing(false); setFbText(''); }
  };

  const markSeen = (id) => {
    let seen = [];
    try { seen = JSON.parse(localStorage.getItem('seenCelebrationIds') || '[]'); } catch (e) {}
    if (!seen.includes(id)) {
      seen.push(id);
      if (seen.length > 100) seen.shift();
      localStorage.setItem('seenCelebrationIds', JSON.stringify(seen));
    }
  };

  const dismissCelebration = () => {
    if (!celebrationQueue.length) return;
    markSeen(celebrationQueue[0].id);
    setCelebrationQueue(prev => prev.slice(1));
  };

  useEffect(() => {
    if (!celebrationQueue.length) return;
    const cur = celebrationQueue[0];
    if (firedRef.current !== cur.id) { firedRef.current = cur.id; burstConfetti(); }
    const t = setTimeout(dismissCelebration, 6000);
    return () => clearTimeout(t);
  }, [celebrationQueue]);

  return (
    <React.Fragment>
      {/* celebration */}
      <Modal open={celebrationQueue.length > 0} z={1100} max="max-w-md">
        {celebrationQueue.length > 0 && (
          <div className="p-8 text-center relative overflow-hidden rounded-[26px]">
            <div className="absolute inset-x-0 top-0 h-1.5" style={{ background: 'linear-gradient(90deg,#e08a1e,#f5c451,#e08a1e)' }} />
            <Ring color="bg-amber-50 text-amber2" icon={<I.Trophy width="28" height="28" />} />
            <p className="lbl">Vinh danh chiến binh</p>
            <p className="font-display text-[30px] font-extrabold text-ink leading-tight mt-1 mb-2">{celebrationQueue[0].staffName}</p>
            <p className="text-[13.5px] text-slate-500 mb-5">
              Đã chốt thành công khách hàng <span className="font-bold text-ink">{celebrationQueue[0].customerName}</span>. Ban giám đốc chúc mừng Em!
            </p>
            <div className="spine bg-emerald-50/70 rounded-2xl p-4 pl-5 text-left mb-6" style={{ '--spine': '#0f9d76' }}>
              <p className="text-[12.5px] font-bold text-emerald-800 leading-relaxed uppercase">
                "Chúc mừng bạn đã chốt thành công, mong bạn phát huy và duy trì tốt phát triển khách hàng. Ban giám đốc chúc mừng Em!"
              </p>
            </div>
            <button onClick={dismissCelebration} className="btn w-full py-4 bg-amber2 text-white text-[13px] uppercase tracking-wider shadow-lift">
              Tuyệt vời — xin chúc mừng {celebrationQueue.length > 1 ? `(còn ${celebrationQueue.length - 1})` : ''}
            </button>
          </div>
        )}
      </Modal>

      {/* performance */}
      <Modal open={!!performanceAlert && celebrationQueue.length === 0} z={1060} max="max-w-md">
        {performanceAlert && (
          <div className="p-8 text-center">
            <Ring color="bg-amber-50 text-amber2" icon={<I.BarChart width="26" height="26" />} />
            <h3 className="font-display text-[19px] font-extrabold text-ink mb-4">Nhắc nhở hiệu suất</h3>
            <div className="spine bg-amber-50/60 rounded-2xl p-4 pl-5 text-left mb-5" style={{ '--spine': '#e08a1e' }}>
              <p className="font-bold text-ink text-[13.5px] mb-1.5">Hệ thống ghi nhận bạn khai thác khách hàng hôm qua quá ít!</p>
              <p className="text-[12.5px] text-slate-600 leading-relaxed">Dưới 3 khách hàng là mức báo động. Nếu không tăng số lượng lên, bạn sẽ rất khó đạt chỉ tiêu doanh thu tháng này!</p>
            </div>
            <p className="lbl">Nhân viên cần nỗ lực</p>
            <div className="flex flex-wrap justify-center gap-2 mb-7 max-h-28 overflow-y-auto">
              {performanceAlert.map(n => (
                <span key={n} className="px-3 py-1.5 bg-paper rounded-xl text-[12px] font-bold text-slate-600">{n}</span>
              ))}
            </div>
            <button onClick={() => setPerformanceAlert(null)} className="btn w-full py-4 bg-ink text-white text-[13px] uppercase tracking-wider">Tôi sẽ cố gắng hơn</button>
          </div>
        )}
      </Modal>

      {/* target goal */}
      <Modal open={showTargetPopup} z={1090} max="max-w-md">
        <div className="p-8 text-center">
          <Ring color="bg-blue-50 text-brand" icon={<I.Target width="26" height="26" />} />
          <h3 className="font-display text-[19px] font-extrabold text-ink mb-4">Mục tiêu hôm nay</h3>
          <div className="spine bg-paper rounded-2xl p-4 pl-5 text-left mb-5 max-h-[38vh] overflow-y-auto" style={{ '--spine': '#1d6fd0' }}>
            <p className="text-[13px] text-slate-600 leading-relaxed">
              Huyền chia sẽ nè bạn ơi ! hãy kiên định với mục tiêu mình trong việc MỞ MỚI KHÁCH HÀNG, không chỉ bạn có thưởng mà chúng ta góp vào sự phát triển công ty IDECO mình nhé! Khách hàng mở mới cần thời gian đàm phán, rồi từ chối, yêu sách nên bạn phải mở trong 1 ngày càng nhiều càng tốt thì cuối tháng mới đạt mục tiêu. Nếu bạn ý thức lời khuyên này của Huyền -Trợ lý BGD thì hãy quyết tâm. Luôn mong bạn thành công đó. Mến nha!
            </p>
          </div>
          <input type="number" min="0" inputMode="numeric"
            value={targetGoal === null ? '' : targetGoal}
            onChange={e => setTargetGoal(parseInt(e.target.value) || 0)}
            onKeyDown={e => e.key === 'Enter' && handleConfirmTarget()}
            placeholder="Số khách hàng mục tiêu"
            className="fld text-center font-mono font-bold text-[20px] py-4 mb-4" />
          <button onClick={handleConfirmTarget} className="btn w-full py-4 bg-brand text-white text-[13px] uppercase tracking-wider shadow-lift">Xác nhận mục tiêu</button>
        </div>
      </Modal>

      {/* target warning */}
      <Modal open={targetWarning} z={1090} max="max-w-sm">
        <div className="p-8 text-center">
          <Ring color="bg-rose-50 text-crimson" icon={<I.AlertCircle width="26" height="26" />} />
          <h3 className="font-display text-[19px] font-extrabold text-ink mb-4">Cảnh báo mục tiêu</h3>
          <p className="text-[13.5px] text-slate-600 leading-relaxed mb-7">
            Bạn đã không giữ lời hứa chính mục tiêu của mình rồi, việc này bạn phải nỗ lực hơn nếu muốn chúng ta và cả bạn đặt mục tiêu kinh doanh và về doanh số tốt hơn. Hãy tập trung cao khả năng tiếp cận khách hàng bạn nhé
          </p>
          <button onClick={() => setTargetWarning(false)} className="btn w-full py-4 bg-ink text-white text-[13px] uppercase tracking-wider">Tôi đã hiểu</button>
        </div>
      </Modal>

      {/* quick report */}
      {/* HUYỀN GỢI Ý — mở trực tiếp từ danh sách khách hàng, tự chạy ngay */}
      <Modal open={!!advisorCustomer} z={1092} max="max-w-2xl" onClose={() => setAdvisorCustomer(null)}>
        {advisorCustomer && (
          <div className="p-5 sm:p-6">
            <div className="flex items-start justify-between gap-3 mb-4">
              <div className="min-w-0">
                <p className="text-[10.5px] font-extrabold uppercase tracking-[.12em] text-amber2 flex items-center gap-1.5">
                  <I.Sparkles width="13" height="13" /> AI cố vấn từ hồ sơ mới nhất + kho nội bộ
                </p>
                <h3 className="font-display text-[20px] font-extrabold text-ink mt-1 leading-tight">Thay mặt Chú Triết, Huyền gợi ý hướng xử lý...</h3>
                <p className="text-[12px] text-slate-500 mt-1.5 leading-relaxed">
                  Huyền đang đọc bản lưu mới nhất của <b className="text-ink">{advisorCustomer.name}</b>, phản hồi khách hàng, lịch hẹn, trạng thái giao dịch và Kho kiến thức trong Cài đặt.
                </p>
              </div>
              <button onClick={() => setAdvisorCustomer(null)} className="btn w-9 h-9 bg-paper text-slate-400 hover:text-crimson shrink-0"><I.X width="16" height="16" /></button>
            </div>

            <div className={`rounded-2xl border p-3.5 mb-4 transition ${huyenTurbo ? 'border-amber-300 bg-amber-50/80' : 'border-line bg-white'}`}>
              <div className="flex items-center gap-3">
                <div className={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${huyenTurbo ? 'bg-amber2 text-white shadow-lift' : 'bg-paper text-slate-400'}`}>⚡</div>
                <div className="min-w-0 mr-auto">
                  <p className="font-display text-[13.5px] font-extrabold text-ink">Huyền Turbo</p>
                  <p className="text-[10.5px] text-slate-500 mt-0.5">{huyenTurbo ? 'BẬT · Kie.ai · Turbo 3.7 Flash · suy luận cao' : 'TẮT · chế độ thường + API dự phòng'}</p>
                </div>
                <button onClick={toggleHuyenTurbo} className={`relative w-[58px] h-8 rounded-full transition shrink-0 ${huyenTurbo ? 'bg-amber2' : 'bg-slate-200'}`} aria-label="Bật hoặc tắt Huyền Turbo">
                  <span className={`absolute top-1 w-6 h-6 bg-white rounded-full shadow transition-all ${huyenTurbo ? 'left-8' : 'left-1'}`}></span>
                </button>
              </div>
              {turboNotice && huyenTurbo && (
                <div className="mt-3 rounded-xl border border-amber-200 bg-white/80 px-3.5 py-3 text-[11.5px] font-semibold text-amber-800 leading-relaxed fade-in">
                  “Huyền đang ráng hết sức để phản hồi bạn nhé — tuy nhiên nhấn nút này Huyền hơi bị mệt tí, tốn tiền tí nhưng sẽ áp dụng nhé.”
                </div>
              )}
            </div>

            <div className="spine bg-paper rounded-2xl p-4 pl-5 mb-4" style={{ '--spine': tone(advisorCustomer.status).spine }}>
              <div className="flex flex-wrap items-center gap-2">
                <p className="font-display text-[16px] font-extrabold text-ink mr-auto">{advisorCustomer.name}</p>
                <Badge cls={tone(advisorCustomer.status).chip}>{advisorCustomer.status}</Badge>
              </div>
              <p className="text-[11.5px] text-slate-500 mt-1">
                {advisorCustomer.contactPerson || 'Chưa khai người liên hệ'}
                {advisorCustomer.province ? ` · ${advisorCustomer.province}` : ''}
                {advisorCustomer.updatedAt ? ` · Bản lưu ${fbWhen(advisorCustomer.updatedAt)}` : ''}
              </p>
            </div>

            {directAdvisorBusy && (
              <div className="rounded-2xl border border-amber-200 bg-amber-50/70 p-5 text-center fade-in">
                <I.Loader width="22" height="22" className="animate-spin text-amber2 mx-auto" />
                <p className="font-display text-[15px] font-extrabold text-ink mt-3">Thay mặt Chú Triết, Huyền đang gợi ý hướng xử lý...</p>
                <p className="text-[11.5px] text-slate-500 mt-1">{huyenTurbo ? 'Huyền Turbo đang dùng Kie.ai Turbo 3.7 Flash với suy luận cao và đối chiếu Kho kiến thức nội bộ.' : 'Đang đối chiếu dữ liệu khách hàng với Kho kiến thức nội bộ mới nhất.'}</p>
              </div>
            )}

            {directAdvisorError && !directAdvisorBusy && (
              <div className="rounded-2xl border border-rose-200 bg-rose-50 p-4 text-[12px] font-semibold text-crimson">
                {directAdvisorError}
                <button onClick={rerunDirectAdvisor} className="btn w-full py-2.5 mt-3 bg-crimson text-white text-[11.5px]">Thử phân tích lại</button>
              </div>
            )}

            {directAdvisorResult && !directAdvisorBusy && (
              <div className="space-y-3 fade-in max-h-[70vh] overflow-y-auto pr-1">
                <div className="rounded-2xl bg-white border border-amber-100 p-4">
                  <div className="flex flex-wrap gap-2 mb-2">
                    {directAdvisorResult.stage && <Badge cls="bg-violet-50 text-violet-700 border-violet-200">{directAdvisorResult.stage}</Badge>}
                    {directAdvisorResult.priority && <Badge cls={directAdvisorResult.priority === 'Cao' ? 'bg-rose-50 text-rose-700 border-rose-200' : directAdvisorResult.priority === 'Thấp' ? 'bg-slate-50 text-slate-500 border-slate-200' : 'bg-amber-50 text-amber-700 border-amber-200'}>Ưu tiên {directAdvisorResult.priority}</Badge>}
                  </div>
                  <p className="text-[13px] font-semibold text-ink leading-relaxed">{directAdvisorResult.situationSummary}</p>
                  {directAdvisorResult.mainBarrier && <p className="text-[11.5px] text-slate-500 mt-2"><b className="text-ink">Rào cản chính:</b> {directAdvisorResult.mainBarrier}</p>}
                </div>

                {Array.isArray(directAdvisorResult.recommendedActions) && directAdvisorResult.recommendedActions.length > 0 && (
                  <div>
                    <p className="lbl">Hướng xử lý ưu tiên</p>
                    <div className="space-y-2">
                      {directAdvisorResult.recommendedActions.map((a, idx) => (
                        <div key={idx} className="spine bg-white border border-line rounded-xl p-3.5 pl-5" style={{ '--spine':'#e08a1e' }}>
                          <p className="text-[12.5px] font-extrabold text-ink">{a.step || idx+1}. {a.action}</p>
                          {a.reason && <p className="text-[11.5px] text-slate-500 mt-1 leading-relaxed"><b>Lý do:</b> {a.reason}</p>}
                          {a.goal && <p className="text-[11.5px] text-slate-500 mt-1 leading-relaxed"><b>Mục tiêu:</b> {a.goal}</p>}
                          {a.suggestedScript && <div className="mt-2.5 rounded-lg bg-blue-50/70 px-3 py-2.5 text-[11.5px] text-brand leading-relaxed"><b>Gợi ý trao đổi:</b> “{a.suggestedScript}”</div>}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="grid sm:grid-cols-2 gap-3">
                  {Array.isArray(directAdvisorResult.opportunities) && directAdvisorResult.opportunities.length > 0 && (
                    <div className="rounded-xl bg-emerald-50/70 border border-emerald-100 p-3.5">
                      <p className="text-[10.5px] font-extrabold uppercase tracking-wider text-jade mb-2">Cơ hội</p>
                      <ul className="space-y-1.5">{directAdvisorResult.opportunities.map((x,i)=><li key={i} className="text-[11.5px] text-slate-600 leading-relaxed">• {x}</li>)}</ul>
                    </div>
                  )}
                  {Array.isArray(directAdvisorResult.risks) && directAdvisorResult.risks.length > 0 && (
                    <div className="rounded-xl bg-rose-50/70 border border-rose-100 p-3.5">
                      <p className="text-[10.5px] font-extrabold uppercase tracking-wider text-crimson mb-2">Rủi ro cần chú ý</p>
                      <ul className="space-y-1.5">{directAdvisorResult.risks.map((x,i)=><li key={i} className="text-[11.5px] text-slate-600 leading-relaxed">• {x}</li>)}</ul>
                    </div>
                  )}
                </div>

                {Array.isArray(directAdvisorResult.missingInfo) && directAdvisorResult.missingInfo.length > 0 && (
                  <div className="rounded-xl bg-amber-50 border border-amber-100 p-3.5">
                    <p className="text-[10.5px] font-extrabold uppercase tracking-wider text-amber2 mb-2">Thông tin cần khai thác thêm</p>
                    <ul className="space-y-1.5">{directAdvisorResult.missingInfo.map((x,i)=><li key={i} className="text-[11.5px] text-slate-600 leading-relaxed">• {x}</li>)}</ul>
                  </div>
                )}

                {directAdvisorResult.managementSupport && (
                  <div className="spine bg-white border border-line rounded-xl p-3.5 pl-5" style={{ '--spine':'#d8324b' }}>
                    <p className="lbl mb-1">BGĐ nên hỗ trợ</p>
                    <p className="text-[12px] text-ink leading-relaxed">{directAdvisorResult.managementSupport}</p>
                  </div>
                )}

                {directAdvisorResult.nextFollowUp && (
                  <div className="spine bg-white border border-line rounded-xl p-3.5 pl-5" style={{ '--spine':'#1d6fd0' }}>
                    <p className="lbl mb-1">Theo dõi tiếp theo</p>
                    <p className="text-[12px] text-ink leading-relaxed">{directAdvisorResult.nextFollowUp}</p>
                  </div>
                )}

                {directAdvisorResult.finalAdvice && (
                  <div className="rounded-2xl bg-ink text-white p-4 shadow-soft">
                    <p className="text-[10.5px] font-extrabold uppercase tracking-wider text-blue-200 mb-1.5">Đề xuất tốt nhất</p>
                    <p className="text-[13px] font-semibold leading-relaxed">{directAdvisorResult.finalAdvice}</p>
                  </div>
                )}

                {Array.isArray(directAdvisorResult.knowledgeUsed) && directAdvisorResult.knowledgeUsed.length > 0 && (
                  <div className="text-[10.5px] text-slate-400 leading-relaxed"><b>Kho nội bộ đã tham chiếu:</b> {directAdvisorResult.knowledgeUsed.join(' · ')}</div>
                )}

                <button onClick={rerunDirectAdvisor} className="btn w-full py-3 bg-amber-50 text-amber2 border border-amber-100 text-[11.5px]">
                  <I.Refresh width="14" height="14" /> Đọc lại dữ liệu mới nhất & phân tích lại
                </button>
              </div>
            )}
          </div>
        )}
      </Modal>

      <Modal open={!!quickReportCustomer} z={1080} max="max-w-lg" onClose={() => setQuickReportCustomer(null)}>
        {quickReportCustomer && (
          <div className="p-6 sm:p-7 flex flex-col max-h-[88vh]">
            <div className="flex justify-between items-center gap-3 mb-5">
              <h3 className="font-display text-[17px] font-extrabold text-ink flex items-center gap-2">
                <I.Sparkles width="17" height="17" className="text-violet2" /> Báo cáo nhanh
              </h3>
              <button onClick={() => setQuickReportCustomer(null)} className="btn w-9 h-9 bg-paper text-slate-400 hover:text-crimson"><I.X width="16" height="16" /></button>
            </div>

            <div className="flex-1 overflow-y-auto space-y-4 pr-1">
              <div className="spine bg-paper rounded-2xl p-4 pl-5" style={{ '--spine': tone(quickReportCustomer.status).spine }}>
                <p className="lbl mb-1">Khách hàng</p>
                <p className="font-display text-[18px] font-extrabold text-ink">{quickReportCustomer.name}</p>
                <p className="text-[12px] text-slate-500 mt-1">{quickReportCustomer.address}{quickReportCustomer.address ? ', ' : ''}{quickReportCustomer.province}</p>
                <div className="flex flex-wrap items-center gap-2 mt-3">
                  <Badge cls={tone(quickReportCustomer.status).chip}>{quickReportCustomer.status}</Badge>
                  <Badge cls="bg-slate-50 text-slate-500 border-slate-200">{quickReportCustomer.type}</Badge>
                  {quickReportCustomer.phone && <PhoneAction phone={quickReportCustomer.phone} compact />}
                </div>
              </div>

              {/* ================= GÓP Ý CHỈ ĐẠO ================= */}
              <div className={`spine rounded-2xl p-4 pl-5 border ${fb ? 'bg-rose-50/60 border-rose-200' : 'bg-paper border-line'} ${fbShake ? 'shake' : ''}`}
                   style={{ '--spine': fb ? '#d8324b' : '#cbd5e1' }}>

                <div className="flex items-center justify-between gap-2 mb-2">
                  <p className="lbl mb-0 flex items-center gap-1.5" style={{ color: fb ? '#d8324b' : undefined }}>
                    <I.Message width="12" height="12" /> Góp ý chỉ đạo — Quản lý / BGĐ
                  </p>
                  {fb && !fbEditing && (
                    <span className={`text-[10px] font-extrabold uppercase tracking-wide shrink-0 ${fb.seenAt ? 'text-slate-400' : 'text-crimson'}`}>
                      {fb.seenAt ? 'NV đã xem' : 'Chờ NV xem'}
                    </span>
                  )}
                </div>

                {fb && !fbEditing && (
                  <React.Fragment>
                    <p className="text-[13.5px] text-ink leading-relaxed whitespace-pre-line">{fb.text}</p>
                    <p className="text-[11px] text-slate-500 mt-2.5 font-semibold">
                      {fb.by || 'Ban Giám đốc'} · {fbWhen(fb.at)}
                      {fb.seenAt ? ` · NV xem lúc ${fbWhen(fb.seenAt)}` : ''}
                    </p>
                  </React.Fragment>
                )}

                {!fb && !fbEditing && (
                  <p className="text-[12.5px] text-slate-400">Chưa có góp ý nào cho hồ sơ này.</p>
                )}

                {fbEditing && (
                  <div className="space-y-2.5">
                    <textarea value={fbText} onChange={e => setFbText(e.target.value)} rows={5} autoFocus
                      placeholder="Nhập ý kiến chỉ đạo để nhân viên triển khai..."
                      className="fld" style={{ resize: 'vertical', minHeight: '124px', lineHeight: 1.6 }} />
                    <button onClick={toggleFbMic}
                      className={`btn w-full py-2.5 text-[12px] ${fbListening ? 'bg-crimson text-white' : 'bg-white border border-line text-slate-500'}`}>
                      {fbListening
                        ? <React.Fragment><span className="w-2.5 h-2.5 bg-white rounded-sm pulse-ring" /> Đang nghe — bấm để dừng</React.Fragment>
                        : <React.Fragment><I.Mic width="14" height="14" /> Nói để nhập nội dung</React.Fragment>}
                    </button>
                    <div className="grid grid-cols-2 gap-2">
                      <button onClick={doSaveFb} disabled={fbSaving}
                        className="btn py-3 bg-crimson text-white text-[12.5px] uppercase tracking-wide shadow-lift disabled:opacity-60">
                        <I.Save width="15" height="15" /> {fbSaving ? 'Đang lưu…' : 'Lưu'}
                      </button>
                      <button onClick={doDeleteFb} disabled={fbSaving}
                        className="btn py-3 bg-white border border-rose-200 text-crimson text-[12.5px] uppercase tracking-wide disabled:opacity-60">
                        <I.Trash width="15" height="15" /> Xóa
                      </button>
                    </div>
                    <button onClick={() => { stopFbMic(); setFbEditing(false); setFbText(fb ? fb.text : ''); }}
                      className="btn w-full py-2.5 bg-paper text-slate-500 text-[12px]">Hủy bỏ</button>
                  </div>
                )}

                {/* Mở góp ý trực tiếp, không hỏi lại mật khẩu trong Báo cáo nhanh */}

                {!fbEditing && (
                  <button onClick={openFbEditor}
                    className="btn w-full py-3 mt-3 bg-crimson text-white text-[12.5px] uppercase tracking-wide shadow-lift">
                    <I.Edit width="15" height="15" /> {fb ? 'Sửa / Xóa góp ý' : 'Góp ý'}
                  </button>
                )}
              </div>

              {quickReportCustomer.customerFeedback && (
                <div>
                  <p className="lbl">Khách hàng phản hồi</p>
                  <div className="spine bg-amber-50/60 rounded-2xl p-4 pl-5" style={{ '--spine': '#e08a1e' }}>
                    <p className="text-[13.5px] text-ink leading-relaxed whitespace-pre-line">{quickReportCustomer.customerFeedback}</p>
                  </div>
                </div>
              )}

              <div>
                <p className="lbl">Nội dung báo cáo</p>
                <div className="spine bg-violet-50/40 rounded-2xl p-4 pl-5" style={{ '--spine': '#6d4de0' }}>
                  <p className="text-[13.5px] text-ink leading-relaxed whitespace-pre-line">
                    {quickReportCustomer.report || 'Chưa có nội dung báo cáo.'}
                  </p>
                  <p className="text-[10.5px] text-slate-400 mt-3 font-semibold">
                    Bản lưu mới nhất: {quickReportCustomer.updatedAt ? fbWhen(quickReportCustomer.updatedAt) : 'Chưa xác định thời điểm'}
                  </p>
                </div>
              </div>

              {/* AI CO VAN XU LY KHACH HANG TU BAN LUU MOI NHAT + KHO NOI BO */}
              <div className="rounded-2xl border border-violet-200 bg-gradient-to-br from-violet-50/80 to-white p-4">
                <div className="flex items-start justify-between gap-3 mb-3">
                  <div>
                    <p className="text-[11px] font-extrabold uppercase tracking-wider text-violet2 flex items-center gap-1.5">
                      <I.Sparkles width="13" height="13" /> Thay mặt Chú Triết, Huyền gợi ý hướng xử lý
                    </p>
                    <p className="text-[11.5px] text-slate-500 mt-1 leading-relaxed">Phân tích bản lưu mới nhất và đối chiếu Kho kiến thức nội bộ trong Cài đặt.</p>
                  </div>
                </div>
                <button onClick={toggleHuyenTurbo} className={`btn w-full py-2.5 mb-2.5 border text-[11.5px] ${huyenTurbo ? 'bg-amber-50 border-amber-300 text-amber-800' : 'bg-white border-line text-slate-500'}`}>
                  ⚡ Huyền Turbo: {huyenTurbo ? 'BẬT · Turbo 3.7 Flash' : 'TẮT'}
                </button>
                {turboNotice && huyenTurbo && <div className="mb-2.5 rounded-xl bg-amber-50 border border-amber-200 px-3 py-2.5 text-[10.8px] font-semibold text-amber-800 leading-relaxed">Huyền đang ráng hết sức để phản hồi bạn nhé — tuy nhiên nhấn nút này Huyền hơi bị mệt tí, tốn tiền tí nhưng sẽ áp dụng nhé.</div>}
                <button onClick={runAdvisor} disabled={advisorBusy || !quickReportCustomer.report}
                  className="btn w-full py-3.5 bg-violet2 text-white text-[12.5px] uppercase tracking-wide shadow-lift disabled:opacity-50">
                  {advisorBusy ? <I.Loader width="15" height="15" className="animate-spin" /> : <I.Sparkles width="15" height="15" />}
                  {advisorBusy ? (huyenTurbo ? 'Huyền Turbo đang ráng phân tích…' : 'Thay mặt Chú Triết, Huyền đang gợi ý hướng xử lý…') : (huyenTurbo ? 'Phân tích bằng Huyền Turbo' : 'Phân tích bản mới nhất & đề xuất xử lý')}
                </button>

                {advisorError && <div className="mt-3 rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-3 text-[11.5px] font-semibold text-crimson">{advisorError}</div>}

                {advisorResult && (
                  <div className="mt-4 space-y-3 fade-in">
                    <div className="rounded-xl bg-white border border-violet-100 p-3.5">
                      <div className="flex flex-wrap gap-2 mb-2">
                        {advisorResult.stage && <Badge cls="bg-violet-50 text-violet-700 border-violet-200">{advisorResult.stage}</Badge>}
                        {advisorResult.priority && <Badge cls={advisorResult.priority === 'Cao' ? 'bg-rose-50 text-rose-700 border-rose-200' : advisorResult.priority === 'Thấp' ? 'bg-slate-50 text-slate-500 border-slate-200' : 'bg-amber-50 text-amber-700 border-amber-200'}>Ưu tiên {advisorResult.priority}</Badge>}
                      </div>
                      <p className="text-[13px] font-semibold text-ink leading-relaxed">{advisorResult.situationSummary}</p>
                      {advisorResult.mainBarrier && <p className="text-[11.5px] text-slate-500 mt-2"><b className="text-ink">Rào cản chính:</b> {advisorResult.mainBarrier}</p>}
                    </div>

                    {Array.isArray(advisorResult.recommendedActions) && advisorResult.recommendedActions.length > 0 && (
                      <div>
                        <p className="lbl">Hướng xử lý ưu tiên</p>
                        <div className="space-y-2">
                          {advisorResult.recommendedActions.map((a, idx) => (
                            <div key={idx} className="spine bg-white border border-line rounded-xl p-3.5 pl-5" style={{ '--spine':'#6d4de0' }}>
                              <p className="text-[12.5px] font-extrabold text-ink">{a.step || idx+1}. {a.action}</p>
                              {a.reason && <p className="text-[11.5px] text-slate-500 mt-1 leading-relaxed"><b>Lý do:</b> {a.reason}</p>}
                              {a.goal && <p className="text-[11.5px] text-slate-500 mt-1 leading-relaxed"><b>Mục tiêu:</b> {a.goal}</p>}
                              {a.suggestedScript && <div className="mt-2.5 rounded-lg bg-blue-50/70 px-3 py-2.5 text-[11.5px] text-brand leading-relaxed"><b>Gợi ý trao đổi:</b> “{a.suggestedScript}”</div>}
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {Array.isArray(advisorResult.opportunities) && advisorResult.opportunities.length > 0 && (
                      <div className="rounded-xl bg-emerald-50/70 border border-emerald-100 p-3.5">
                        <p className="text-[10.5px] font-extrabold uppercase tracking-wide text-emerald-700 mb-2">Cơ hội</p>
                        {advisorResult.opportunities.map((x,i)=><p key={i} className="text-[11.5px] text-slate-600 leading-relaxed">• {x}</p>)}
                      </div>
                    )}
                    {Array.isArray(advisorResult.risks) && advisorResult.risks.length > 0 && (
                      <div className="rounded-xl bg-rose-50/70 border border-rose-100 p-3.5">
                        <p className="text-[10.5px] font-extrabold uppercase tracking-wide text-crimson mb-2">Rủi ro cần chú ý</p>
                        {advisorResult.risks.map((x,i)=><p key={i} className="text-[11.5px] text-slate-600 leading-relaxed">• {x}</p>)}
                      </div>
                    )}
                    {Array.isArray(advisorResult.missingInfo) && advisorResult.missingInfo.length > 0 && (
                      <div className="rounded-xl bg-amber-50/70 border border-amber-100 p-3.5">
                        <p className="text-[10.5px] font-extrabold uppercase tracking-wide text-amber-700 mb-2">Thông tin nên khai thác thêm</p>
                        {advisorResult.missingInfo.map((x,i)=><p key={i} className="text-[11.5px] text-slate-600 leading-relaxed">• {x}</p>)}
                      </div>
                    )}
                    {advisorResult.managementSupport && (
                      <div className="rounded-xl bg-slate-50 border border-line p-3.5 text-[11.5px] text-slate-600 leading-relaxed"><b className="text-ink">BGĐ nên hỗ trợ:</b> {advisorResult.managementSupport}</div>
                    )}
                    {advisorResult.nextFollowUp && (
                      <div className="rounded-xl bg-blue-50/70 border border-blue-100 p-3.5 text-[11.5px] text-slate-600 leading-relaxed"><b className="text-brand">Theo dõi tiếp:</b> {advisorResult.nextFollowUp}</div>
                    )}
                    {Array.isArray(advisorResult.knowledgeUsed) && advisorResult.knowledgeUsed.length > 0 && (
                      <div className="text-[10.5px] text-slate-400 leading-relaxed"><b>Kho nội bộ đã tham chiếu:</b> {advisorResult.knowledgeUsed.join(' · ')}</div>
                    )}
                    {advisorResult.finalAdvice && (
                      <div className="spine rounded-xl bg-violet-100/60 p-3.5 pl-5" style={{ '--spine':'#6d4de0' }}>
                        <p className="text-[10.5px] font-extrabold uppercase tracking-wide text-violet2 mb-1">Đề xuất tốt nhất</p>
                        <p className="text-[12.5px] font-bold text-ink leading-relaxed">{advisorResult.finalAdvice}</p>
                      </div>
                    )}
                  </div>
                )}
              </div>

              {(quickReportCustomer.appointments || []).length > 0 && (
                <div>
                  <p className="lbl">Lịch hẹn</p>
                  <div className="space-y-2">
                    {quickReportCustomer.appointments.map(a => (
                      <div key={a.id} className={`spine rounded-2xl p-3.5 pl-5 border ${a.isCompleted ? 'bg-paper border-transparent opacity-60' : 'bg-white border-line'}`}
                           style={{ '--spine': a.isCompleted ? '#cbd5e1' : '#e08a1e' }}>
                        <p className="font-mono font-bold text-[12.5px] text-ink">{viDate(a.date)} · {a.time}</p>
                        <p className="text-[12.5px] text-slate-500 mt-0.5">{a.content}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div>
                <p className="lbl">Lời khuyên từ IDECO</p>
                <div className="spine bg-amber-50/40 rounded-2xl p-4 pl-5" style={{ '--spine': '#e08a1e' }}>
                  <p className="text-[12.5px] text-slate-600 italic leading-relaxed">
                    Báo cáo này đã được AI tối ưu để đảm bảo tính chuyên nghiệp và rõ ràng cho Ban Giám đốc.
                  </p>
                </div>
              </div>
            </div>

            <button onClick={() => setQuickReportCustomer(null)} className="btn w-full py-4 mt-5 bg-ink text-white text-[13px] uppercase tracking-wider shrink-0">Đóng cửa sổ</button>
          </div>
        )}
      </Modal>
    </React.Fragment>
  );
}

/* ============================== MOUNT ============================== */
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

<script>
(function () {
  function fatal(msg, detail) {
    document.getElementById('root').innerHTML =
      '<div style="max-width:560px;margin:12vh auto;padding:28px;font-family:system-ui;background:#fff;'
      + 'border-radius:20px;box-shadow:0 20px 50px -20px rgba(11,37,69,.4)">'
      + '<h2 style="margin:0 0 10px;font-size:19px;color:#0b2545">Khong tai duoc ung dung</h2>'
      + '<p style="margin:0 0 14px;font-size:14px;color:#5b6b86">' + msg + '</p>'
      + '<pre style="white-space:pre-wrap;font-size:12px;color:#d8324b;background:#fff5f6;padding:12px;border-radius:10px">'
      + (detail || '') + '</pre></div>';
  }
  try {
    if (!window.Babel) { fatal('Thieu thu vien Babel. Kiem tra ket noi mang roi tai lai trang.', ''); return; }
    var src = document.getElementById('app-source').textContent;
    var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]], filename: 'app.jsx' }).code;
    (0, eval)(out);
  } catch (e) {
    fatal('Loi khi khoi tao ung dung.', (e && (e.message || e)) + '');
    console.error(e);
  }
})();
</script>
