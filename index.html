/* fetch co gioi han thoi gian -> KHONG BAO GIO treo vo han khi mang chap chon */
async function fetchTimeout(url, opts = {}, ms = 20000) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try {
    return await fetch(url, { ...opts, signal: ctl.signal });
  } finally {
    clearTimeout(timer);
  }
}

    return r.ok;
  } catch (e) { console.error('dbSet', e); return false; }
}
async function dbUpdate(path, value) {

    catch (e) { console.error('dbUpdate(SDK)', e); }
  }

    return r.ok;
  } catch (e) { console.error('dbUpdate', e); return false; }
}
/* Ghi 1 lo co thu lai nhieu lan — TRA VE LY DO THAT SU khi that bai */
async function dbUpdateDetailed(path, value, tries = 3, ms = 25000) {
  /* --- Duong chinh: SDK (WebSocket) --- */
  if (FB_READY) {
    for (let t = 0; t < tries; t++) {
      try {
        await Promise.race([
          FBDB.ref(path).update(value),
          new Promise((_, rej) => setTimeout(() => rej(new Error('SDK_TIMEOUT')), ms))
        ]);
        return { ok: true, via: 'SDK' };
      } catch (e) {
        const msg = String((e && (e.message || e.code)) || e);
        if (/permission|denied/i.test(msg)) {
          return { ok: false, err: `Firebase SDK: ${msg}`, fatal: true,
                   hint: 'Database Rules đang chặn ghi. Vào Firebase Console → Realtime Database → Rules, đặt ".write": true rồi bấm Publish.' };
        }
        if (t === tries - 1) { console.warn('[IDECO] SDK ghi lỗi, chuyển sang REST:', msg); break; }
        await new Promise(res => setTimeout(res, 800 * Math.pow(2, t)));
      }
    }
  }

  /* --- Du phong: REST --- */
  let lastErr = 'Không rõ nguyên nhân';
  for (let t = 0; t < tries; t++) {
    try {
      const r = await fetchTimeout(dbUrl(path), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(value)
      }, ms);
      if (r.ok) return { ok: true, via: 'REST' };

      /* Doc thong bao loi that cua Firebase */
      let body = '';
      try { body = (await r.text()).slice(0, 300); } catch (e) {}
      lastErr = `HTTP ${r.status}${body ? ' — ' + body : ''}`;

      if (r.status === 401 || r.status === 403) {
        return { ok: false, err: lastErr, code: r.status, fatal: true,
                 hint: 'Database Rules đang chặn ghi. Vào Firebase Console → Realtime Database → Rules, đặt ".write": true rồi Publish.' };
      }
      if (r.status === 404) {
        return { ok: false, err: lastErr, code: 404, fatal: true,
                 hint: 'Sai databaseURL — kiểm tra lại địa chỉ Realtime Database (chú ý vùng, ví dụ ...-default-rtdb.asia-southeast1.firebasedatabase.app).' };
      }
      if (r.status === 413) {
        return { ok: false, err: lastErr, code: 413, fatal: true,
                 hint: 'Gói dữ liệu quá lớn — hãy giảm số dòng mỗi lô.' };
      }
      if (r.status >= 400 && r.status < 500 && r.status !== 429) {
        return { ok: false, err: lastErr, code: r.status, fatal: true,
                 hint: 'Firebase từ chối dữ liệu. Xem chi tiết lỗi ở trên.' };
      }
    } catch (e) {
      lastErr = e.name === 'AbortError'
        ? `Quá thời gian chờ ${Math.round(ms / 1000)}s (mạng chậm hoặc bị chặn)`
        : `${e.name}: ${e.message}`;
      /* TypeError = bi CORS / tuong lua / chan mang chan hoan toan */
      if (e instanceof TypeError && t === tries - 1) {
        return { ok: false, err: lastErr, fatal: true,
                 hint: 'Trình duyệt không gửi được yêu cầu. Thường do: mở file bằng file:// thay vì http, tường lửa/VPN công ty chặn firebaseio.com, hoặc tiện ích chặn quảng cáo.' };
      }
    }
    if (t < tries - 1) await new Promise(res => setTimeout(res, 800 * Math.pow(2, t)));
  }
  return { ok: false, err: lastErr, hint: 'Mạng không ổn định — thử lại khi đường truyền tốt hơn.' };
}

/** Co the tam dung moi listener khi dang upload lo lon -> tranh nghen mang */
const RT = { paused: false, pending: new Set(), guard: null };
function rtPause()  {
  RT.paused = true;
  /* Chot an toan: du co loi bat ngo, realtime luon tu bat lai sau 3 phut */
  clearTimeout(RT.guard);
  RT.guard = setTimeout(() => { if (RT.paused) rtResume(); }, 180000);
}
function rtResume() {
  clearTimeout(RT.guard); RT.guard = null;
  RT.paused = false;
  RT.pending.forEach(fn => { try { fn(); } catch (e) {} });
  RT.pending.clear();
}

/** Realtime subscription via EventSource (Firebase REST streaming). */
function dbOnValue(path, cb) {
  let es = null, dead = false, poll = null, last = null, fbRef = null, fbHandler = null;
  const emit = (v) => {
    const s = JSON.stringify(v);
    if (s !== last) { last = s; cb(v); }
  };

  /* ---- Duong chinh: SDK onValue (giong het ban goc) ---- */
  if (FB_READY) {
    try {
      fbRef = FBDB.ref(path);
      fbHandler = fbRef.on('value', (snap) => {
        if (dead) return;
        const v = snap.exists() ? snap.val() : null;
        /* Dang upload -> hoan lai de khong ve lai giao dien lien tuc */
        if (RT.paused) { RT.pending.add(() => { if (!dead) emit(v); }); return; }
        emit(v);
      }, (err) => { console.error('[IDECO] onValue lỗi:', path, err); });
      return () => {
        dead = true;
        try { fbRef.off('value', fbHandler); } catch (e) {}
      };
    } catch (e) { console.error('[IDECO] Không đăng ký được onValue:', e); }
  }

  /* ---- Du phong: EventSource / polling qua REST ---- */
  const refresh = async () => { if (!dead) emit(await dbGet(path)); };
  const onChange = () => {
    if (dead) return;
    if (RT.paused) { RT.pending.add(refresh); return; }
    refresh();
  };
  const startPoll = () => {
    if (poll) return;
    onChange();
    poll = setInterval(onChange, 12000);
  };
  try {
    es = new EventSource(dbUrl(path));
    es.addEventListener('put', onChange);
    es.addEventListener('patch', onChange);
    es.onerror = () => { startPoll(); };
    dbGet(path).then(v => { if (!dead) emit(v); });
  } catch (e) { startPoll(); }
  return () => {
    dead = true;
    if (es) try { es.close(); } catch (e) {}
    if (poll) clearInterval(poll);
  };
}

/* ---------------- Gemini service (primary key + Firebase backup key) --------------- */
let BACKUP_GEMINI_KEY = '';

const geminiKeys = () => {
  const keys = [];
  if (GEMINI_API_KEY && !GEMINI_API_KEY.startsWith('PASTE_')) keys.push(GEMINI_API_KEY);
  if (BACKUP_GEMINI_KEY) keys.push(BACKUP_GEMINI_KEY);
  return keys;
};

async function callGemini(prompt, { model = 'gemini-2.5-flash', json = true, tools = null, temperature } = {}) {
  const keys = geminiKeys();
  if (!keys.length) throw new Error('NO_KEY');
  let lastErr = null;
  for (const key of keys) {
    try {
      const body = { contents: [{ parts: [{ text: prompt }] }] };
      const cfg = {};
      if (json && !tools) cfg.responseMimeType = 'application/json';
      if (temperature !== undefined) cfg.temperature = temperature;
      if (Object.keys(cfg).length) body.generationConfig = cfg;
      if (tools) body.tools = tools;

      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,
        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
      );
      if (!res.ok) { lastErr = new Error('HTTP ' + res.status); continue; }
      const data = await res.json();
      const parts = data?.candidates?.[0]?.content?.parts || [];
      const text = parts.map(p => p.text || '').join('').trim();
      if (text) return text;
      lastErr = new Error('EMPTY');
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('AI_FAIL');
}

function safeJson(txt, fallback) {
  if (!txt) return fallback;
  let t = txt.replace(/```json/gi, '').replace(/```/g, '').trim();
  try { return JSON.parse(t); } catch (e) {}
  const m = t.match(/[\{\[][\s\S]*[\}\]]/);
  if (m) { try { return JSON.parse(m[0]); } catch (e) {} }
  return fallback;
}

/** Nhiệm vụ 1: chỉnh sửa văn bản — Nhiệm vụ 2: lời khuyên từ IDECO (giữ nguyên prompt gốc) */

  const prompt = `
    Bạn là một chuyên gia tư vấn bán hàng và quản lý kinh doanh của công ty IDECO.
    Nhiệm vụ: Xử lý văn bản báo cáo thăm viếng khách hàng dưới đây:
    "${text}"

    Hãy thực hiện 2 nhiệm vụ sau và trả về định dạng JSON:

    NHIỆM VỤ 1: CHỈNH SỬA VĂN BẢN (refinedText)
    - Sửa lỗi chính tả, ngữ pháp, viết lại theo phong cách văn phong báo cáo chuyên nghiệp.
    - Đoán ý người viết để làm rõ ràng thông tin hơn, giúp ban giám đốc dễ đọc dễ hiểu.
    - TUYỆT ĐỐI giữ nguyên đại từ nhân xưng của người viết.

    NHIỆM VỤ 2: ĐƯA RA LỜI KHUYÊN TỪ IDECO (advice)
    Hãy phân tích nội dung và đưa ra lời khuyên dựa trên các quy tắc sau (Hãy gộp các lời khuyên thành một đoạn văn mạch lạc, chân thành):

    1. Kiểm tra Tên Sản Phẩm:
       - Nếu nội dung KHÔNG có tên sản phẩm hoặc nhóm sản phẩm cụ thể -> Thêm lời khuyên: "Bạn nên nêu cụ thể tên sản phẩm hay nhóm sản phẩm cụ thể hơn để thuyết phục khách hàng."

    2. Kiểm tra Phản Hồi Khách Hàng:
       - Nếu nội dung KHÔNG nêu phản hồi của khách -> Thêm lời khuyên: "Bạn nên khai báo phản hồi khách hàng để cùng theo dõi tình huống tốt hơn."

    3. Xử lý Từ Khóa Về Giá (giá cao, chiết khấu thấp, giá đắt, giá bán cao, chiết khấu không cao):
       - Nếu xuất hiện -> Thêm lời khuyên: "Hãy phân tích rõ cho khách hàng giá mua vào, hãy thêm yếu tố đổi trả tốt hơn, thậm chí bàn lại công nợ hỗ trợ hay đề nghị nhóm sản phẩm giá phù hợp, đồng thời hỏi khách hàng so sánh giá với sản phẩm nào cụ thể cùng quy cách, cùng tác dụng."

    4. Xử lý Từ Khóa Trì Hoãn (để xem xét, trả lời sau, để hỏi lại, xem sau):
       - Nếu xuất hiện -> Thêm lời khuyên: "Nên hỏi rõ thời điểm phản hồi từ khách hàng và chủ động thiết lập cuộc hẹn."

    5. Lời khuyên mặc định (LUÔN LUÔN THÊM VÀO CUỐI):
       - "Bạn nên chủ động hỏi lý do từ chối, hay xem xét và chủ động gợi ý thêm nhiều sản phẩm khác, dò hỏi nhu cầu tiềm ẩn của khách hàng và luôn chủ động xin cuộc hẹn."

    Output định dạng JSON chuẩn (không dùng markdown block):
    {
      "refinedText": "Văn bản đã chỉnh sửa...",
      "advice": "Tổng hợp các lời khuyên dựa trên logic trên..."
    }
  `;
  try {
    const raw = await callGemini(prompt, { model: 'gemini-2.5-flash', json: true });
    const r = safeJson(raw, null);
    if (!r) return { status: 'warning', text, message: 'Lỗi xử lý dữ liệu AI.' };
    return { status: 'success', text: r.refinedText || text, message: r.advice || 'Đã chuẩn hóa văn bản.' };
  } catch (e) {
    if (e && e.message === 'NO_KEY') {
      return { status: 'warning', text, message: 'Chưa có API key Gemini. Vào Hệ thống → Cài đặt AI để nhập key dự phòng.' };
    }
    return { status: 'warning', text, message: 'Lỗi kết nối AI, vui lòng thử lại.' };
  }
}

/* ---------------- Helpers ---------------- */
const getLocalDateString = (d) => {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
};
const viDate = (s) => (s ? s.split('-').reverse().join('/') : '');

const isCustomerOverdue = (c) => {
  if (c.status !== TransactionStatus.DANG_THEO_DOI) return false;
  const today = getLocalDateString(new Date());
  const un = (c.appointments || []).filter(a => !a.isCompleted);
  const overdue = un.filter(a => a.date < today);
  const future = un.some(a => a.date >= today);
  return overdue.length > 0 && !future;
};

/* ---------------- Phone / contact helpers ---------------- */
// Chuan hoa SDT VN: bo khoang trang, dau cham, gach; +84 -> 0
function normPhone(p) {
  let s = String(p || '').replace(/[^\d+]/g, '');
  if (s.startsWith('+84')) s = '0' + s.slice(3);
  else if (s.startsWith('84') && s.length >= 10) s = '0' + s.slice(2);
  return s;
}
// Zalo dung so quoc te khong dau +
function zaloPhone(p) {
  const s = normPhone(p);
  return s.startsWith('0') ? '84' + s.slice(1) : s.replace(/^\+/, '');
}
const telHref  = (p) => 'tel:' + normPhone(p);
const smsHref  = (p) => 'sms:' + normPhone(p);
const zaloHref = (p) => 'https://zalo.me/' + zaloPhone(p);

/* ============================== UI PRIMITIVES ============================== */

function Toast({ n }) {
  if (!n) return null;
  const map = {
    success: 'bg-jade', error: 'bg-crimson', warning: 'bg-amber2', info: 'bg-brand'
  };
  return (
    <div className="fixed left-1/2 -translate-x-1/2 bottom-6 z-[1500] px-5 py-3 rounded-2xl shadow-pop text-white text-[13px] font-bold max-w-[92vw] text-center fade-in"
         style={{ paddingBottom: 'max(12px, env(safe-area-inset-bottom))' }}>
      <span className={`absolute inset-0 rounded-2xl ${map[n.type] || 'bg-ink'}`}></span>
      <span className="relative">{n.msg}</span>
    </div>
  );
}

function Modal({ open, onClose, children, max = 'max-w-md', z = 900, shake }) {
  if (!open) return null;
  return (
    <div className="modal-wrap fade-in" style={{ zIndex: z }} onClick={onClose ? (e) => { if (e.target === e.currentTarget) onClose(); } : undefined}>
      <div className={`sheet pop-in ${max} ${shake ? 'shake' : ''} max-h-[92vh] overflow-y-auto`}>{children}</div>
    </div>
  );
}

function Badge({ children, cls }) {
  return <span className={`text-[10px] font-extrabold px-2.5 py-1 rounded-lg border uppercase tracking-wide whitespace-nowrap ${cls}`}>{children}</span>;
}

function Field({ label, children }) {
  return <div><label className="lbl">{label}</label>{children}</div>;
}

function Ring({ icon, color }) {
  return (
    <div className={`w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-5 ${color}`}>{icon}</div>
  );
}

/** Nut so dien thoai: bam ra menu Goi / SMS / Zalo */
function PhoneAction({ phone, compact }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  useEffect(() => {
    if (!open) return;
    const away = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', away);
    document.addEventListener('touchstart', away);
    return () => { document.removeEventListener('mousedown', away); document.removeEventListener('touchstart', away); };
  }, [open]);
  if (!phone) return null;
  const stop = (e) => { e.stopPropagation(); };
  const items = [
    { k: 'call', label: 'Gọi điện',   href: telHref(phone),  icon: <I.Phone width="15" height="15" />,   cls: 'text-jade' },
    { k: 'sms',  label: 'Nhắn SMS',   href: smsHref(phone),  icon: <I.Message width="15" height="15" />, cls: 'text-brand' },
    { k: 'zalo', label: 'Nhắn Zalo',  href: zaloHref(phone), icon: <I.Zalo width="15" height="15" />,    cls: 'text-[#0068ff]', ext: true }
  ];
  return (
    <span className="relative inline-block" ref={wrapRef} onClick={stop}>
      <button onClick={(e) => { stop(e); setOpen(o => !o); }}
        className={`btn font-mono font-bold text-brand hover:bg-blue-50 ${compact ? 'text-[13px] px-2 py-1' : 'text-[15px] px-2.5 py-1.5'} -ml-2`}
        title="Bấm để gọi, nhắn SMS hoặc Zalo">
        <I.Phone width={compact ? 13 : 14} height={compact ? 13 : 14} /> {phone}
      </button>
      {open && (
        <span className="absolute left-0 top-full mt-1 z-50 bg-white rounded-2xl shadow-pop border border-line p-1.5 min-w-[168px] flex flex-col pop-in">
          {items.map(it => (
            <a key={it.k} href={it.href}
               {...(it.ext ? { target: '_blank', rel: 'noopener' } : {})}
               onClick={(e) => { stop(e); setOpen(false); }}
               className={`btn justify-start px-3 py-2.5 text-[13px] hover:bg-paper ${it.cls}`}>
              {it.icon} <span className="text-ink font-semibold">{it.label}</span>
            </a>
          ))}
        </span>
      )}
    </span>
  );
}

function burstConfetti() {
  const colors = ['#e08a1e', '#0f9d76', '#1d6fd0', '#d8324b', '#6d4de0', '#f5c451'];
  for (let i = 0; i < 44; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[i % colors.length];
    el.style.animationDuration = (2.4 + Math.random() * 1.8) + 's';
    el.style.animationDelay = (Math.random() * .5) + 's';
    el.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4600);
  }
}

    }
  }, [staffList, currentStaff]);

  /* reset on logout */

    if (!isUnlocked) {
      hasCheckedInitialPopups.current = false;
      setCelebrationQueue([]); setPerformanceAlert(null); setOverdueReminder(null);
      setAdviceModal(null); setOverdueFollowingAlert(null);
      setSettingsUnlocked(false); setSettingsPassInput('');
      dismissedOverdueRef.current.clear();
    }
  }, [isUnlocked]);

  /* ============== report validation (identical rules) ============== */
  const isReportValid = (text) => {
    if (!text || text.trim().length === 0) return { valid: false, msg: 'Vui lòng nhập nội dung báo cáo giao dịch.' };
    const lowerText = text.toLowerCase();
    const wordCount = text.trim().split(/\s+/).length;

    if (wordCount < 25) {
      return { valid: false, msg: `Bạn ơi, báo cáo giao dịch quá ngắn (dưới 25 từ). Làm sao bàn bạc giải pháp để phát triển tiếp theo?\n\nBạn nên viết rất cụ thể tên sản phẩm/thuốc và phản hồi của khách.\n\nBạn nên hiểu việc báo cáo tốt giúp bạn quản lý tốt hơn, hiểu tình huống hơn và cấp trên của bạn và đặc biệt BGĐ hiểu rõ bạn đang giao dịch vì để hỗ trợ xử lý khi cần cho bạn. Bạn phải cập nhật tình huống khi giao dịch xong nhé. Nếu BGĐ đọc mà nội dung cũ thì không tốt. Tôi là trợ lý IDECO của BGĐ giúp bạn tốt hơn.\n\n(Lưu ý: Hệ thống sẽ KHÔNG CHO LƯU hồ sơ nếu nội dung báo cáo không rõ ràng!)` };
    }

    const hasFeedback = /(phản hồi|ý kiến|nói|bảo|chê|khen|đắt|rẻ|giá|cần|muốn|hỏi|quan tâm|ok|chốt|không nhu cầu|chưa có nhu cầu|để xem lại|gởi báo giá|gửi báo giá|hẹn lần sau|loại thuốc nào|từ chối|đồng ý|mua|lấy|xem xét|tham khảo)/i.test(lowerText);
    if (!hasFeedback) {
      return { valid: false, msg: `Bạn ơi, báo cáo giao dịch mà không có nội dung phản hồi của khách hàng (ví dụ: chê giá cao, không nhu cầu, để xem lại, hãy gởi báo giá, hẹn lần sau, loại thuốc nào...)? Dù là lần đầu tiếp xúc cũng cần ghi rõ phản hồi của khách.\n\nBạn nên hiểu việc báo cáo tốt giúp bạn quản lý tốt hơn, hiểu tình huống hơn và cấp trên của bạn và đặc biệt BGĐ hiểu rõ bạn đang giao dịch vì để hỗ trợ xử lý khi cần cho bạn. Bạn phải cập nhật tình huống khi giao dịch xong nhé. Nếu BGĐ đọc mà nội dung cũ thì không tốt. Tôi là trợ lý IDECO của BGĐ giúp bạn tốt hơn.\n\n(Lưu ý: Hệ thống sẽ KHÔNG CHO LƯU hồ sơ nếu nội dung báo cáo không rõ ràng!)` };
    }

    const stopWords = 'cho|đến|tới|về|ở|tại|của|và|các|những|với';
    let hasSpecificProduct = false;
    try {
      hasSpecificProduct =
        lowerText.includes('tất cả') ||
        new RegExp(`uvs\\s+(?!(${stopWords})\\b)\\p{L}+`, 'ui').test(lowerText) ||
        new RegExp(`danh mục( thuốc)?\\s+(?!(${stopWords})\\b)\\p{L}+`, 'ui').test(lowerText) ||
        new RegExp(`nhóm thuốc\\s+(?!(${stopWords})\\b)\\p{L}+`, 'ui').test(lowerText) ||
        new RegExp(`loại thuốc\\s+(?!(${stopWords})\\b)\\p{L}+`, 'ui').test(lowerText) ||
        new RegExp(`thuốc\\s+(?!(${stopWords})\\b)\\p{L}+`, 'ui').test(lowerText);
    } catch (e) {
      hasSpecificProduct = lowerText.includes('tất cả');
    }

    const genericMatch = lowerText.match(/\b(dmp|nhóm thuốc|tên thuốc|danh mục|gam thuốc|loại thuốc|nhóm sp|nhóm sản phẩm)\b/i);
    const hasProductKeyword = /(sản phẩm|sp|máy|thiết bị|bơm|van|model|hàng|catalogue|website|web|báo giá|chào|uvs|thuốc)/i.test(lowerText);

    if (genericMatch && !hasSpecificProduct) {
      return { valid: false, msg: `Bạn ơi, bạn đang viết chung chung là "${genericMatch[0].toUpperCase()}" mà không rõ ${genericMatch[0].toUpperCase()} là gì, tên thuốc cụ thể là gì? Báo cáo giao dịch mà không cụ thể sản phẩm nào, không có ý kiến khách hàng ra sao? Làm sao bàn bạc giải pháp để phát triển tiếp theo? Bạn nên viết rất cụ thể, trình bày những gì bạn đã trao đổi, đặc biệt đã chào sản phẩm, có gởi website báo giá không? Có nội dung gì cần bàn bạc lại vế Sếp, BGĐ không? Bạn đã tính trước các tình huống phản đổi để xoay sở thuyết phục không? Nên nhớ chúng ta bán cảm xúc, bán giải pháp giúp họ kinh doanh nên nói rỏ giải pháp hơn là cứ báo cáo chung chung.` };
    } else if (!hasProductKeyword && !hasSpecificProduct) {
      return { valid: false, msg: `Bạn ơi, báo cáo giao dịch mà không cụ thể sản phẩm nào, không có ý kiến khách hàng ra sao? Làm sao bàn bạc giải pháp để phát triển tiếp theo? Bạn nên viết rất cụ thể, trình bày những gì bạn đã trao đổi, đặc biệt đã chào sản phẩm, có gởi website báo giá không? Có nội dung gì cần bàn bạc lại vế Sếp, BGĐ không? Bạn đã tính trước các tình huống phản đổi để xoay sở thuyết phục không? Nên nhớ chúng ta bán cảm xúc, bán giải pháp giúp họ kinh doanh nên nói rỏ giải pháp hơn là cứ báo cáo chung chung.` };
    }
    return { valid: true };
  };

  /* delayed report warning while typing */
  useEffect(() => {
    if (!formData.report || hasWarnedReport || view !== 'editor') return;
    const t = setTimeout(() => {
      const v = isReportValid(formData.report);
      if (!v.valid && v.msg) { setReportWarningMsg(v.msg); setHasWarnedReport(true); }
    }, 3000);
    return () => clearTimeout(t);
  }, [formData.report, hasWarnedReport, view]);

  useEffect(() => { setHasWarnedReport(false); setReportWarningMsg(null); }, [formData.id, view]);

  /* ============== Hall of fame ============== */
  useEffect(() => {
    if (!isUnlocked || customers.length === 0) return;
    const THREE_DAYS = 72 * 60 * 60 * 1000, now = Date.now();
    const wins = customers.filter(c => {
      const ok = c.status === TransactionStatus.THANH_CONG || c.status === TransactionStatus.THANH_CONG_SP_MOI;
      return ok && (now - (c.updatedAt || 0)) < THREE_DAYS;
    });
    if (!wins.length) return;
    let seen = [];
    try { seen = JSON.parse(localStorage.getItem('seenCelebrationIds') || '[]'); } catch (e) {}
    const unseen = wins.filter(c => !seen.includes(c.id));
    if (!unseen.length) return;
    unseen.sort((a, b) => (a.updatedAt || 0) - (b.updatedAt || 0));
    setCelebrationQueue(prev => {
      const fresh = unseen.filter(c => !prev.some(q => q.id === c.id));
      if (!fresh.length) return prev;
      return [...prev, ...fresh.map(c => ({ id: c.id, staffName: c.salesRep, customerName: c.name }))];
    });
  }, [isUnlocked, customers]);

  /* ============== performance + overdue popups (once per login) ============== */
  useEffect(() => {
    if (!isUnlocked || customers.length === 0 || hasCheckedInitialPopups.current) return;
    const y = new Date(); y.setDate(y.getDate() - 1);
    const yStr = getLocalDateString(y);
    const under = [];
    staffList.forEach(s => {
      const count = customers.filter(c => c.salesRep === s.name && c.transactionDate === yStr).length;
      const isNewbie = (Date.now() - (s.joinedAt || 0)) < 86400000;
      if (count < 3 && !isNewbie) under.push(s.name);
    });
    if (under.length) setPerformanceAlert(under);
    const overdue = customers.filter(isCustomerOverdue);
    if (overdue.length) setOverdueFollowingAlert(overdue);
    hasCheckedInitialPopups.current = true;
  }, [isUnlocked, customers, staffList]);

  /* ============== auto lock staff with >2 overdue ============== */
  useEffect(() => {
    if (!isUnlocked || !customers.length || !staffList.length) return;
    const overdue = customers.filter(isCustomerOverdue);
    const byStaff = overdue.reduce((acc, c) => { acc[c.salesRep] = (acc[c.salesRep] || 0) + 1; return acc; }, {});
    Object.entries(byStaff).forEach(([name, count]) => {
      const s = staffList.find(x => x.name === name);
      if (!s) return;
      if (count > 2 && !s.isLocked) {
        const recentlyUnlocked = s.unlockedAt && (Date.now() - s.unlockedAt < 86400000);
        if (!recentlyUnlocked) dbUpdate(`staff/${s.id}`, { isLocked: true });
      } else if (count <= 2 && s.unlockedAt) {
        dbUpdate(`staff/${s.id}`, { unlockedAt: null });
      }
    });
    staffList.forEach(s => { if (!byStaff[s.name] && s.unlockedAt) dbUpdate(`staff/${s.id}`, { unlockedAt: null }); });
  }, [customers, staffList, isUnlocked]);

  /* ============== appointment monitor ============== */
  useEffect(() => {
    if (!isUnlocked || !currentStaff) return;
    const iv = setInterval(() => {
      if (activeAlert || confirmModal || overdueReminder || adviceModal || quickReportCustomer) return;
      const now = new Date();
      let found = false;
      for (const c of customers) {
        if (c.salesRep !== currentStaff.name) continue;
        for (const apt of (c.appointments || [])) {
          if (apt.isCompleted) continue;
          const at = new Date(`${apt.date}T${apt.time}`);
          const diff = (at.getTime() - now.getTime()) / 60000;
          if (diff > 0 && diff <= 1440) {
            if (!dismissedOverdueRef.current.has(apt.id + '_upcoming')) {
              setActiveAlert({ id: apt.id, customerId: c.id, staffName: c.salesRep, customerName: c.name, type: c.type, alertType: 'upcoming',
                msg: `Bạn có cuộc hẹn với khách hàng ${c.name} vào lúc ${apt.time} ngày ${viDate(apt.date)}.` });
              found = true; break;
            }
          } else if (diff < 0) {
            if (!dismissedOverdueRef.current.has(apt.id + '_late')) {
              setActiveAlert({ id: apt.id, customerId: c.id, staffName: c.salesRep, customerName: c.name, type: c.type, alertType: 'late',
                msg: `Bạn đã bị trễ hẹn với khách hàng ${c.name} lúc ${apt.time} ngày ${viDate(apt.date)}. Vui lòng xác nhận đã hẹn hoặc thiết lập lịch hẹn mới!` });
              found = true; break;
            }
          }
        }
        if (found) break;
      }
      if (!found) setActiveAlert(null);
    }, 20000);
    return () => clearInterval(iv);
  }, [customers, isUnlocked, currentStaff, activeAlert, confirmModal, overdueReminder, adviceModal, quickReportCustomer]);

  /* ============== overdue-with-no-future-appointment monitor ============== */
  useEffect(() => {
    if (!isUnlocked || !currentStaff) return;
    const iv = setInterval(() => {
      if (activeAlert || confirmModal || overdueReminder || adviceModal || quickReportCustomer) return;
      for (const c of customers) {
        if (c.salesRep !== currentStaff.name) continue;
        if (!isCustomerOverdue(c)) continue;
        const today = getLocalDateString(new Date());
        const items = (c.appointments || []).filter(a => !a.isCompleted && a.date < today);
        items.sort((a, b) => b.date.localeCompare(a.date));
        const target = items[0];
        if (target && !dismissedOverdueRef.current.has(target.id)) {
          setOverdueReminder({ customerName: c.name, content: target.content, date: target.date, id: target.id });
          break;
        }
      }
    }, 5000);
    return () => clearInterval(iv);
  }, [isUnlocked, currentStaff, customers, activeAlert, confirmModal, overdueReminder, adviceModal, quickReportCustomer]);

  /* ============== target goal ============== */
  useEffect(() => {
    if (!isUnlocked || !currentStaff) return;
    const check = () => {
      const raw = localStorage.getItem(`targetGoal_${currentStaff.name}`);
      if (!raw) return;
      try {
        const saved = JSON.parse(raw);
        if (Date.now() - saved.timestamp < 12 * 3600 * 1000) return;
        const made = customers.filter(c => c.salesRep === currentStaff.name && c.transactionDate === saved.date).length;
        if (made < saved.goal) {
          const k = `targetWarningShown_${currentStaff.name}_${saved.date}`;
          if (!localStorage.getItem(k)) { setTargetWarning(true); localStorage.setItem(k, 'true'); }
        }
      } catch (e) {}
    };
    check();
    const iv = setInterval(check, 60000);
    return () => clearInterval(iv);
  }, [isUnlocked, currentStaff, customers]);

  /* ============================= ACTIONS ============================= */

  const runConfirm = () => {

  const handleSaveCustomer = async () => {
    if (currentStaff?.isLocked) {

    const fail = formData.status === TransactionStatus.KHONG_THANH_CONG;

  const handleAnalyze = async () => {

  const handleEnhanceText = async () => {

    setIsEnhancing(true);

  const handleFindInfo = async () => {
    if (!formData.name.trim()) { notify('Nhập tên khách hàng trước khi tra cứu', 'warning'); return; }
    setIsFindingInfo(true);
    const r = await searchSingleCustomerPhone(formData.name.trim());

    setFormData(prev => ({

    }));

  const handleFilterData = () => {
    setFilteredResults(customers.filter(c => {
      const ms = filterStaff ? c.salesRep === filterStaff : true;
      const m1 = dateRange.start ? c.transactionDate >= dateRange.start : true;

  const handleExportExcel = () => {
    if (!dateRange.start || !dateRange.end) { notify('Vui lòng chọn khoảng thời gian để xuất báo cáo!', 'warning'); return; }
    const filtered = customers.filter(c => {
      const ms = filterStaff ? c.salesRep === filterStaff : true;
      return ms && c.transactionDate >= dateRange.start && c.transactionDate <= dateRange.end;
    });
    if (!filtered.length) { notify('Không có dữ liệu trong khoảng thời gian này!', 'info'); return; }
    const data = filtered.map(c => ({
      'Tên nhân viên': c.salesRep,
      'Tên khách hàng': c.name,
      'Người liên hệ': c.contactPerson,
      'Điện thoại': c.phone,
      'Báo cáo giao dịch': c.report,
      'Trạng thái giao dịch': c.status,
      'Nội dung hẹn': (c.appointments && c.appointments.length)
        ? c.appointments.map(a => `${a.date} ${a.time}: ${a.content}`).join('; ') : '',
      'Địa chỉ': c.address
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    ws['!cols'] = [{ wch: 16 }, { wch: 28 }, { wch: 18 }, { wch: 14 }, { wch: 60 }, { wch: 22 }, { wch: 40 }, { wch: 34 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Báo cáo');
    XLSX.writeFile(wb, `Bao_cao_giao_dich_${dateRange.start}_to_${dateRange.end}.xlsx`);
    notify('Xuất file Excel thành công!', 'success');
  };

  const handleFileUpload = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setPendingFileName(file.name);
    setExcelRawData(null); setExcelHeaders([]);
    setUploadBusy(true); setUploadMsg('Đang đọc file...');
    const reader = new FileReader();
    reader.onerror = () => {
      setUploadBusy(false); setUploadMsg('');
      notify('Không đọc được file (lỗi trình duyệt)', 'error'); setPendingFileName('');
    };
    reader.onload = (ev) => {
      try {
        /* ArrayBuffer thay cho readAsBinaryString: doc dung file .xlsx lon, khong loi ky tu */
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array', cellDates: true });
        if (!wb.SheetNames.length) throw new Error('no sheet');
        const ws = wb.Sheets[wb.SheetNames[0]];

        /* Doc dang mang 2 chieu de KHONG bo sot cot khi o dau tien trong */
        const matrix = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', blankrows: false, raw: false });
        if (matrix.length < 2) {
          setUploadBusy(false); setUploadMsg('');
          notify('File Excel không có dữ liệu (cần ít nhất 1 dòng tiêu đề + 1 dòng dữ liệu)', 'error');
          setPendingFileName(''); return;
        }

        /* Tim dong tieu de that su: dong dau tien co >=2 o co chu */
        let hIdx = 0;
        for (let i = 0; i < Math.min(matrix.length, 12); i++) {
          const filled = matrix[i].filter(v => String(v ?? '').trim() !== '').length;
          if (filled >= 2) { hIdx = i; break; }
        }

        const rawHeaders = matrix[hIdx].map((h, i) => {
          const t = String(h ?? '').trim();
          return t || `Cột ${i + 1}`;
        });
        /* Chong trung ten cot -> tranh mat cot khi Excel co 2 cot cung ten */
        const seen = {};
        const headers = rawHeaders.map(h => {
          if (seen[h] === undefined) { seen[h] = 0; return h; }
          seen[h] += 1; return `${h} (${seen[h] + 1})`;
        });

        const data = [];
        for (let i = hIdx + 1; i < matrix.length; i++) {
          const row = matrix[i];
          if (!row || row.every(v => String(v ?? '').trim() === '')) continue;
          const obj = {};
          headers.forEach((h, c) => { obj[h] = row[c] ?? ''; });
          data.push(obj);
        }

        if (!data.length) {
          setUploadBusy(false); setUploadMsg('');
          notify('File Excel không có dòng dữ liệu nào', 'error'); setPendingFileName(''); return;
        }

        setExcelHeaders(headers);
        setExcelRawData(data);

        /* Tu doan cot theo dung khung: Ten KH - Nguoi lien he - Dien thoai - Dia chi.
           Moi cot chi duoc nhan 1 lan (taken) de "Người liên hệ" khong bi cot SDT cuop mat. */
        const low = headers.map(h => h.toLowerCase().trim().replace(/\s+/g, ' '));
        const taken = new Set();
        const pick = (exact, partial) => {
          for (const k of exact) {
            const i = low.findIndex((h, idx) => !taken.has(idx) && h === k);
            if (i > -1) { taken.add(i); return headers[i]; }
          }
          for (const k of partial) {
            const i = low.findIndex((h, idx) => !taken.has(idx) && h.includes(k));
            if (i > -1) { taken.add(i); return headers[i]; }
          }
          return '';
        };

        /* Thu tu doan quan trong: doan cai co tu khoa dac trung nhat truoc */
        const mPhone = pick(
          ['số điện thoại', 'điện thoại', 'sđt', 'sdt', 'phone', 'mobile', 'số đt', 'đt'],
          ['điện thoại', 'sđt', 'sdt', 'phone', 'mobile']);
        const mContact = pick(
          ['người liên hệ', 'nguoi lien he', 'người đại diện', 'đại diện', 'liên hệ',
           'contact', 'người phụ trách', 'chủ nhà thuốc', 'dược sĩ'],
          ['người liên hệ', 'đại diện', 'liên hệ', 'contact', 'phụ trách', 'dược sĩ']);
        const mAddress = pick(
          ['địa chỉ', 'dia chi', 'address'],
          ['địa chỉ', 'dia chi', 'address']);
        const mName = pick(
          ['tên khách hàng', 'tên kh', 'khách hàng', 'tên nhà thuốc', 'nhà thuốc', 'tên', 'name'],
          ['tên', 'name', 'khách hàng', 'nhà thuốc', 'công ty', 'cơ sở']);

        setExcelMapping({ name: mName, contactPerson: mContact, phone: mPhone, address: mAddress });
        setUploadBusy(false);
        setUploadMsg(`Đã đọc ${data.length} dòng · ${headers.length} cột`);
        notify(`Đã đọc file: ${data.length} dòng, ${headers.length} cột`, 'success');
      } catch (err) {
        console.error('Excel read error:', err);
        setUploadBusy(false); setUploadMsg('');
        notify('Không đọc được file Excel. Hãy lưu lại dạng .xlsx rồi thử lại.', 'error');
        setPendingFileName('');
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';
  };

  /* Bo ve an toan: du loi gi xay ra, giao dien khong bao gio ket o trang thai "Dang luu" */
  const safeFinish = () => { try { rtResume(); } catch (e) {} setUploadBusy(false); setUploadMsg(''); };

  /* Them file moi vao Firebase (KHONG xoa cac file da co) — chia lo de khong vo gioi han REST */
  const handleConfirmMapping = async () => {
    if (!excelRawData) return;
    if (!excelMapping.name) { notify('Vui lòng chọn cột Tên khách hàng', 'error'); return; }
    if (uploadBusy) return;

    const fileId = uuid();
    const norm = (v) => {
      if (v === null || v === undefined) return '';
      if (v instanceof Date) return v.toLocaleDateString('vi-VN');
      return String(v).trim();
    };

    const rows = excelRawData.map(r => ({
      id: uuid(),
      fileId,
      name: norm(r[excelMapping.name]),
      /* Nguoi lien he: khong bat buoc -> de trong neu file khong co */
      contactPerson: excelMapping.contactPerson ? norm(r[excelMapping.contactPerson]) : '',
      /* SDT: bo dau cach/cham/gach, giu lai so 0 dau neu Excel da cat mat */
      phone: excelMapping.phone ? norm(r[excelMapping.phone]).replace(/[\s.\-()]/g, '') : '',
      address: excelMapping.address ? norm(r[excelMapping.address]) : '',
      isCalled: false,
      claimedBy: ''
    })).filter(c => c.name);

    if (!rows.length) {
      notify(`Không có dòng nào hợp lệ — cột "${excelMapping.name}" đang trống. Hãy chọn lại cột tên khách hàng.`, 'error', 5200);
      return;
    }

    /* AN TOAN: hien danh sach + luu localStorage NGAY, truoc khi dung toi Firebase.
       Du Firebase co hong hoan toan, nhan vien van co danh sach de goi. */
    setExcelCustomers(prev => {
      const ids = new Set(prev.map(p => p.id));
      const merged = [...prev, ...rows.filter(r => !ids.has(r.id))];
      try { localStorage.setItem('ideco_excelBackup', JSON.stringify(merged.slice(0, 8000))); } catch (e) {}
      return merged;
    });

    setUploadBusy(true);
    uploadCancelRef.current = false;
    setUploadMsg(`Kiểm tra kết nối Firebase...`);
    try {

    /* Thu ghi 1 ban ghi nho truoc -> phat hien ngay loi quyen/mang,
       thay vi treo giua chung khi da lưu do dang */
    const probeId = '__probe__';
    const probe = await dbUpdateDetailed('excelCustomers', { [probeId]: { t: Date.now() } }, 2, 12000);
    if (!probe.ok) {
      setUploadBusy(false); setUploadMsg('');
      setDbError({
        stage: 'Kiểm tra ghi thử',
        err: probe.err,
        hint: probe.hint,
        url: `${DB}/excelCustomers.json`
      });
      notify('Không ghi được vào Firebase — xem khung đỏ để biết nguyên nhân', 'error', 6000);
      return;
    }
    setDbError(null);
    await dbRemove(`excelCustomers/${probeId}`);

    setUploadMsg(`Chuẩn bị lưu ${rows.length} dòng...`);
    rtPause();   /* tam dung realtime -> khong tai lai ca danh sach giua chung */

    /* Chia lo theo DUNG LUONG (khong theo so dong): tieng Viet co dau 3 byte/ky tu,
       nen 400 dong co the vuot 1MB va Firebase se im lang tu choi -> treo. */
    const MAX_BYTES = 256 * 1024;   /* 256KB / lo — an toan tuyet doi */
    const MAX_ROWS  = 150;
    const batches = [];
    let cur = {}, curBytes = 0, curCount = 0;
    for (const r of rows) {
      const sz = JSON.stringify(r).length + r.id.length + 4;
      if (curCount > 0 && (curBytes + sz > MAX_BYTES || curCount >= MAX_ROWS)) {
        batches.push(cur); cur = {}; curBytes = 0; curCount = 0;
      }
      cur[r.id] = r; curBytes += sz; curCount++;
    }
    if (curCount > 0) batches.push(cur);

    let saved = 0;
    const failedBatches = [];
    let lastErr = null;
    for (let b = 0; b < batches.length; b++) {
      if (uploadCancelRef.current) break;
      const n = Object.keys(batches[b]).length;
      setUploadMsg(`Đang lưu ${saved}/${rows.length} dòng  ·  lô ${b + 1}/${batches.length}`);
      const res = await dbUpdateDetailed('excelCustomers', batches[b], 3, 25000);
      if (res.ok) saved += n;
      else {
        failedBatches.push(batches[b]);
        lastErr = res;
        /* Loi khong the khac phuc (rules/URL) -> dung ngay, khong nem tiep 30 lo vo ich */
        if (res.fatal) {
          setDbError({ stage: `Lưu lô ${b + 1}/${batches.length}`, err: res.err, hint: res.hint, url: `${DB}/excelCustomers.json` });
          break;
        }
      }
      /* nhuong CPU cho giao dien ve lai -> khong bi "dung hinh" */
      await new Promise(res2 => setTimeout(res2, 60));
    }
    if (lastErr && !lastErr.fatal) {
      setDbError({ stage: 'Lưu dữ liệu', err: lastErr.err, hint: lastErr.hint, url: `${DB}/excelCustomers.json` });
    }

    const cancelled = uploadCancelRef.current;

    if (saved === 0) {
      rtResume();
      setUploadBusy(false); setUploadMsg('');
      notify(cancelled
        ? 'Đã hủy — chưa lưu dòng nào.'
        : 'Không lưu được lên Firebase. Kiểm tra mạng / quyền ghi Database rồi thử lại.', 'error', 5500);
      return;
    }

    const okFile = await dbSet(`excelFiles/${fileId}`, {
      id: fileId,
      name: pendingFileName || ('File ' + new Date().toLocaleDateString('vi-VN')),
      uploadedAt: Date.now(),
      uploadedBy: currentStaff?.name || '',
      count: saved
    });

    /* Hien ngay tren man hinh, khong doi realtime day ve */
    const savedIds = new Set();
    batches.forEach((bt, i) => { if (!failedBatches.includes(bt)) Object.keys(bt).forEach(k => savedIds.add(k)); });
    setExcelCustomers(prev => {
      const ids = new Set(prev.map(p => p.id));
      return [...prev, ...rows.filter(r => savedIds.has(r.id) && !ids.has(r.id))];
    });
    if (okFile) {
      setExcelFiles(prev => ({
        ...prev,
        [fileId]: { id: fileId, name: pendingFileName || ('File ' + new Date().toLocaleDateString('vi-VN')),
                    uploadedAt: Date.now(), uploadedBy: currentStaff?.name || '', count: saved }
      }));
    }

    rtResume();
    setUploadBusy(false); setUploadMsg('');
    const missing = rows.length - saved;

    if (missing > 0) {
      /* Giu lai phan chua luu de bam "Lưu tiếp phần còn thiếu", khong phai lam lai tu dau */
      const savedNameSet = new Set(rows.filter(r => savedIds.has(r.id)).map(r => r.name));
      setResumeState({
        fileId,
        fileName: pendingFileName || 'File',
        rows: rows.filter(r => !savedIds.has(r.id)),
        total: rows.length,
        saved
      });
      notify(cancelled
        ? `Đã dừng — lưu được ${saved}/${rows.length} dòng. Bấm "Lưu tiếp" để hoàn tất.`
        : `Lưu được ${saved}/${rows.length} dòng — còn ${missing} dòng lỗi mạng. Bấm "Lưu tiếp" để hoàn tất.`, 'warning', 6000);
    } else {
      setResumeState(null);
      notify(`Đã thêm ${saved} khách hàng từ file "${pendingFileName}"`, 'success');
    }
    setExcelRawData(null); setExcelHeaders([]); setPendingFileName('');
    } catch (err) {
      console.error('upload error:', err);
      safeFinish();
      notify('Có lỗi bất ngờ khi lưu. Phần đã lưu vẫn giữ nguyên — hãy thử lại.', 'error', 5500);

  /* Luu tiep phan con thieu — dung lai dung fileId cu */

    if (!resumeState || uploadBusy) return;

    setUploadBusy(true);
    uploadCancelRef.current = false;
    rtPause();
    try {
    const MAX_BYTES = 256 * 1024, MAX_ROWS = 150;
    const batches = [];
    let cur = {}, curBytes = 0, curCount = 0;
    for (const r of rows) {
      const sz = JSON.stringify(r).length + r.id.length + 4;
      if (curCount > 0 && (curBytes + sz > MAX_BYTES || curCount >= MAX_ROWS)) {
        batches.push(cur); cur = {}; curBytes = 0; curCount = 0;
      }
      cur[r.id] = r; curBytes += sz; curCount++;
    }
    if (curCount > 0) batches.push(cur);

    let saved = 0;
    const stillFailed = [];
    for (let b = 0; b < batches.length; b++) {
      if (uploadCancelRef.current) break;
      const n = Object.keys(batches[b]).length;
      setUploadMsg(`Đang lưu tiếp ${already + saved}/${total} dòng  ·  lô ${b + 1}/${batches.length}`);
      const ok = await dbUpdateRetry('excelCustomers', batches[b], 4, 25000);
      if (ok) saved += n; else stillFailed.push(batches[b]);
      await new Promise(res => setTimeout(res, 60));
    }

    const okIds = new Set();
    batches.forEach(bt => { if (!stillFailed.includes(bt)) Object.keys(bt).forEach(k => okIds.add(k)); });
    setExcelCustomers(prev => {
      const ids = new Set(prev.map(p => p.id));
      return [...prev, ...rows.filter(r => okIds.has(r.id) && !ids.has(r.id))];
    });
    const totalSaved = already + saved;
    await dbUpdate(`excelFiles/${fileId}`, { count: totalSaved });
    setExcelFiles(prev => prev[fileId] ? { ...prev, [fileId]: { ...prev[fileId], count: totalSaved } } : prev);

    rtResume();
    setUploadBusy(false); setUploadMsg('');
    const left = rows.filter(r => !okIds.has(r.id));
    if (left.length) {
      setResumeState({ ...resumeState, rows: left, saved: totalSaved });
      notify(`Còn ${left.length} dòng chưa lưu được. Thử lại khi mạng ổn định hơn.`, 'warning', 5500);
    } else {
      setResumeState(null);
      notify(`Hoàn tất — đã lưu đủ ${totalSaved}/${total} khách hàng`, 'success');
    }
    } catch (err) {
      console.error('resume error:', err);
      safeFinish();
      notify('Có lỗi bất ngờ khi lưu tiếp. Hãy thử lại.', 'error', 5000);

  /* ===== KIEM TRA KET NOI FIREBASE — chay tung buoc de biet CHINH XAC hong o dau ===== */
  const runDiagnostic = async () => {
    if (diagRunning) return;
    setDiagRunning(true);
    setDiagResult(null);
    const steps = [];
    const add = (name, ok, detail) => steps.push({ name, ok, detail });

    /* 0. Dang dung duong truyen nao */
    add('Kết nối Firebase', FB_READY,
      FB_READY ? 'Dùng SDK WebSocket (giống bản gốc AI Studio chạy tốt)'
               : 'KHÔNG tải được Firebase SDK — đang chạy REST dự phòng. Kiểm tra mạng có chặn gstatic.com không.');

    /* 1. Giao thuc trang */
    const proto = location.protocol;
    add('Giao thức trang', proto !== 'file:', proto === 'file:'
      ? 'Đang mở bằng file:// — trình duyệt chặn gọi mạng. Hãy tải file lên hosting (Netlify/GitHub Pages) hoặc mở qua http://localhost.'

  const stopMicMonitor = useCallback(() => {

    try { micStreamRef.current?.getTracks().forEach(t => t.stop()); } catch (e) {}

  /* Mo stream de do muc am thanh -> giup chon dung micro */
  const startMicMonitor = useCallback(async (deviceId) => {
    stopMicMonitor();
    try {
      const constraints = {
        audio: deviceId
          ? { deviceId: { exact: deviceId }, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
          : { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      micStreamRef.current = stream;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      micAudioCtxRef.current = ctx;
      const src = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      const buf = new Uint8Array(analyser.frequencyBinCount);
      const loop = () => {
        analyser.getByteTimeDomainData(buf);
        let peak = 0;
        for (let i = 0; i < buf.length; i++) { const v = Math.abs(buf[i] - 128) / 128; if (v > peak) peak = v; }
        setMicLevel(Math.min(100, Math.round(peak * 260)));
        micRafRef.current = requestAnimationFrame(loop);
      };
      loop();
      return true;
    } catch (e) {
      return false;
    }
  }, [stopMicMonitor]);

  const startGlobalRecognition = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { notify('Trình duyệt không hỗ trợ nhận diện giọng nói', 'error'); return; }
    if (globalRecognitionRef.current) {
      const old = globalRecognitionRef.current;
      old.onend = null; old.onresult = null;
      try { old.stop(); } catch (e) {}
    }
    const rec = new SR();
    rec.lang = 'vi-VN'; rec.interimResults = true; rec.continuous = true;
    globalRecognitionRef.current = rec;
    let interimNow = '';
    rec.onresult = (e) => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      const field = activeFieldRef.current;
      if (!field) return;
      if (final) {
        let p = final;
        if (field === 'phone') p = p.replace(/\s+/g, '');
        else if (['name', 'contactPerson', 'address', 'province'].includes(field))
          p = p.toLowerCase().replace(/(?:^|\s)\S/g, a => a.toUpperCase());
        else p = p.charAt(0).toUpperCase() + p.slice(1);
        textBeforeRecordingRef.current += (textBeforeRecordingRef.current ? ' ' : '') + p;
        interimNow = '';
      } else interimNow = interim;
      const stream = textBeforeRecordingRef.current + (interimNow ? (textBeforeRecordingRef.current ? ' ' : '') + interimNow : '');
      applyTranscript(field, stream);
    };
    rec.onend = () => { if (isGlobalListeningRef.current) setTimeout(() => { if (isGlobalListeningRef.current) startGlobalRecognition(); }, 120); };
    try { rec.start(); } catch (e) {
      setTimeout(() => { if (isGlobalListeningRef.current) { try { rec.start(); } catch (err) {} } }, 500);
    }
  };

  const toggleGlobalListening = () => {
    if (isGlobalListeningRef.current) {
      isGlobalListeningRef.current = false;
      setIsGlobalListening(false);
      const r = globalRecognitionRef.current;
      if (r) { r.onend = null; r.onresult = null; try { r.stop(); } catch (e) {} }
    } else {
      if (listeningFieldRef.current) { listeningFieldRef.current = null; setListeningField(null); try { recognitionRef.current?.stop(); } catch (e) {} }
      const f = activeFieldRef.current;
      textBeforeRecordingRef.current = f
        ? (f === 'appointmentContent' ? (newAppointment.content || '') : (formData[f] || ''))
        : '';
      isGlobalListeningRef.current = true;
      setIsGlobalListening(true);
      ensureSelectedMicStream().finally(() => startGlobalRecognition());
    }
  };

  const startRecognition = (field) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { notify('Trình duyệt không hỗ trợ nhận diện giọng nói', 'error'); return; }
    const rec = new SR();
    rec.lang = 'vi-VN'; rec.interimResults = true;
    recognitionRef.current = rec;
    rec.onresult = (e) => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (final) {
        let p = final;
        if (field === 'name') p = p.toLowerCase().replace(/(?:^|\s)\S/g, a => a.toUpperCase());
        if (field === 'phone') p = p.replace(/\s+/g, '');
        textBeforeRecordingRef.current += (textBeforeRecordingRef.current ? ' ' : '') + p;
      }
      const stream = textBeforeRecordingRef.current + (interim ? (textBeforeRecordingRef.current ? ' ' : '') + interim : '');
      applyTranscript(field, stream);
    };
    rec.onend = () => { if (listeningFieldRef.current === field) { try { rec.start(); } catch (e) {} } };
    try { rec.start(); } catch (e) {}
  };

  const toggleListening = (field) => {
    if (listeningFieldRef.current === field) {
      listeningFieldRef.current = null; setListeningField(null);
      try { recognitionRef.current?.stop(); } catch (e) {}
    } else {
      try { recognitionRef.current?.stop(); } catch (e) {}
      textBeforeRecordingRef.current = field === 'appointmentContent' ? (newAppointment.content || '') : (formData[field] || '');
      listeningFieldRef.current = field; setListeningField(field);
      ensureSelectedMicStream().finally(() => startRecognition(field));
    }
  };

  const handleFocus = (field) => {
    activeFieldRef.current = field;
    if (isGlobalListeningRef.current) {
      textBeforeRecordingRef.current = field === 'appointmentContent' ? (newAppointment.content || '') : (formData[field] || '');
      startGlobalRecognition();
    }
  };

  /* ============== derived ============== */
  const myCustomers = useMemo(() => customers
    .filter(c => currentStaff ? c.salesRep === currentStaff.name : true)
    .filter(c => statusFilter ? c.status === statusFilter : true)
    .filter(c => {
      const q = searchTerm.toLowerCase().trim();
      if (!q) return true;
      return (c.name || '').toLowerCase().includes(q)
        || (c.phone || '').includes(q)
        || (c.contactPerson || '').toLowerCase().includes(q)
        || (c.province || '').toLowerCase().includes(q);
    })
    .sort((a, b) => {
      const oa = isCustomerOverdue(a) ? 0 : 1, ob = isCustomerOverdue(b) ? 0 : 1;
      if (oa !== ob) return oa - ob;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    }), [customers, currentStaff, searchTerm, statusFilter]);

  const todayStats = useMemo(() => {
    const today = getLocalDateString(new Date());
    const mine = customers.filter(c => currentStaff ? c.salesRep === currentStaff.name : true);
    return {
      total: mine.length,
      today: mine.filter(c => c.transactionDate === today).length,
      won: mine.filter(c => c.status === TransactionStatus.THANH_CONG || c.status === TransactionStatus.THANH_CONG_SP_MOI).length,
      overdue: mine.filter(isCustomerOverdue).length
    };
  }, [customers, currentStaff]);


  /* ============================== LOGIN ============================== */
  if (!isUnlocked) {
    return (
      <div className="h-full flex items-center justify-center p-5 relative overflow-hidden"
           style={{ background: 'linear-gradient(150deg,#0b2545 0%,#13315c 45%,#1d6fd0 100%)' }}>
        <div className="absolute -top-24 -right-20 w-80 h-80 rounded-full blur-3xl" style={{ background: 'rgba(61,155,233,.28)' }} />
        <div className="absolute -bottom-24 -left-16 w-72 h-72 rounded-full blur-3xl" style={{ background: 'rgba(15,157,118,.22)' }} />

        <div className={`relative z-10 w-full max-w-[400px] bg-white rounded-[28px] p-8 sm:p-10 shadow-pop ${loginShake ? 'shake' : 'pop-in'}`}>
          <div className="flex items-center gap-3 mb-8">
            <div className="w-12 h-12 rounded-2xl bg-ink text-white flex items-center justify-center shrink-0">
              <I.UserCheck width="22" height="22" />
            </div>
            <div className="leading-tight">
              <p className="font-display text-[19px] font-extrabold tracking-tight text-ink">IDECO</p>
              <p className="text-[10px] font-bold tracking-[.18em] uppercase text-slate-400">Báo cáo giao dịch</p>
            </div>
          </div>

          <h1 className="font-display text-[19px] sm:text-[21px] leading-[1.28] font-extrabold text-ink mb-2">
            Hãy cùng nhau khai báo <span className="text-brand">real time</span> tại thời điểm giao để cập nhật đúng tình hình xử lý khách — giúp cùng nhau chốt thành công.
          </h1>
          <p className="text-[13px] text-slate-500 mb-7">Nhập mật khẩu truy cập để bắt đầu phiên làm việc.</p>

          <input
            type="password" autoFocus value={loginInput}
            onChange={e => setLoginInput(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleLogin()}
            placeholder="••••••••"
            className="fld text-center font-mono text-lg tracking-[.35em] py-4 mb-3"
          />

          <label className="flex items-center gap-2.5 mb-4 cursor-pointer select-none">
            <input type="checkbox" checked={rememberLogin}
                   onChange={e => {
                     const v = e.target.checked;
                     setRememberLogin(v);
                     try {
                       if (!v) { localStorage.removeItem('ideco_savedPass'); localStorage.removeItem('ideco_remember'); }
                       else localStorage.setItem('ideco_remember', '1');
                     } catch (err) {}
                   }}
                   className="w-4 h-4 accent-[#1d6fd0] shrink-0" />
            <span className="text-[12.5px] font-semibold text-slate-500">Ghi nhớ mật khẩu trên máy này</span>
          </label>

          <button onClick={handleLogin}
            className="btn w-full py-4 bg-ink text-white text-[13px] tracking-[.14em] uppercase shadow-lift hover:bg-ink2">
            Truy cập hệ thống
          </button>

          <p className="text-[11px] text-slate-400 mt-6 text-center leading-relaxed">
            Quên mật khẩu? Liên hệ quản trị viên — đổi mật khẩu trong <span className="font-bold text-slate-500">Hệ thống → Bảo mật</span>.
          </p>
          <p className="text-[10.5px] text-slate-400 mt-3 text-center font-semibold tracking-wide">
            Ứng dụng được phát triển bởi: <span className="font-extrabold text-ink">MTRIET</span>
          </p>
        </div>
      </div>
    );
  }

  const locked = !!currentStaff?.isLocked;

  /* ============================== MAIN ============================== */
  return (

      <Popups

      {/* appointment alert */}
      <Modal open={!!activeAlert} z={1000} max="max-w-sm" shake={activeAlert?.alertType === 'late'}>

        </div>
      </Modal>

      {/* overdue following list */}
      <Modal open={!!overdueFollowingAlert} z={1015} max="max-w-lg">
        {overdueFollowingAlert && (
          <div className="p-7">
            <div className="flex items-center gap-3 mb-4">
              <div className="w-11 h-11 rounded-2xl bg-amber-50 text-amber2 flex items-center justify-center"><I.Alert width="20" height="20" /></div>

            </div>
            <p className="text-[13px] text-slate-500 mb-5 leading-relaxed">Các bạn nên xem lại những khách hàng này gấp hay đổi ngay phương án khác để kịp mục tiêu:</p>
            <div className="space-y-2 max-h-[42vh] overflow-y-auto pr-1">
              {overdueFollowingAlert.map((c) => {

                const items = (c.appointments || []).filter(a => !a.isCompleted && a.date < today).sort((a, b) => b.date.localeCompare(a.date));
                const d = items[0] ? items[0].date : c.transactionDate;
                return (
                  <button key={c.id} onClick={() => { setOverdueFollowingAlert(null); handleEditCustomer(c); }}
                    className="spine w-full text-left bg-white border border-line rounded-2xl p-4 pl-5 hover:border-amber2 transition" style={{ '--spine': '#e08a1e' }}>
                    <p className="font-bold text-ink text-[14px] mb-1">{c.name}</p>
                    <div className="flex justify-between text-[11px] font-semibold">
                      <span className="text-slate-400">NV <span className="text-amber2">{c.salesRep}</span></span>
                      <span className="text-slate-400">Hẹn trễ <span className="text-crimson font-mono">{viDate(d)}</span></span>
                    </div>
                  </button>

            </div>
            <button onClick={() => setOverdueFollowingAlert(null)} className="btn w-full py-4 mt-6 bg-amber2 text-white text-[13px] uppercase tracking-wider shadow-lift">Dạ vâng</button>
          </div>
        )}
      </Modal>

      {/* report warning */}
      <Modal open={!!reportWarningMsg} z={1030} max="max-w-md">
        <div className="p-7">
          <div className="flex items-center gap-3 mb-5">
            <div className="w-11 h-11 rounded-2xl bg-amber-50 text-amber2 flex items-center justify-center"><I.Sparkles width="20" height="20" /></div>
            <h3 className="font-display text-[18px] font-extrabold text-ink leading-tight">AI nhắc nhở từ BGĐ</h3>
          </div>
          <div className="spine bg-amber-50/60 rounded-2xl p-5 pl-6 max-h-[50vh] overflow-y-auto" style={{ '--spine': '#e08a1e' }}>
            <p className="text-[13.5px] text-ink leading-relaxed whitespace-pre-line">{reportWarningMsg}</p>
          </div>
          <button onClick={() => setReportWarningMsg(null)} className="btn w-full py-4 mt-6 bg-amber2 text-white text-[13px] uppercase tracking-wider shadow-lift">Đã hiểu, tôi sẽ bổ sung</button>
        </div>
      </Modal>

      {/* ============ CHON MICRO ============ */}
      <Modal open={showMicPicker} z={1060} max="max-w-md" onClose={() => setShowMicPicker(false)}>
        <div className="p-6 sm:p-7">
          <div className="flex items-center gap-3 mb-1">
            <div className="w-11 h-11 rounded-2xl bg-blue-50 text-brand flex items-center justify-center shrink-0"><I.Mic width="20" height="20" /></div>
            <div className="min-w-0">
              <h3 className="font-display text-[18px] font-extrabold text-ink leading-tight">Thiết bị micro</h3>
              <p className="text-[11.5px] text-slate-400 font-semibold">Chọn micro của máy hoặc thiết bị gắn ngoài</p>
            </div>
            <button onClick={() => refreshMicDevices(true)} className="btn ml-auto w-9 h-9 bg-paper text-slate-400 hover:text-brand shrink-0" title="Quét lại thiết bị">
              <I.Refresh width="15" height="15" className={micLoading ? 'animate-spin' : ''} />

              <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400">Mức âm thanh</span>
              <span className="text-[11px] font-bold text-slate-400">{micLevel > 6 ? 'Đang thu tốt ✓' : 'Hãy nói thử...'}</span>

            <button onClick={() => chooseMic(null)}
              className={`w-full text-left rounded-2xl border px-4 py-3 flex items-center gap-3 transition ${!selectedMicId ? 'border-brand bg-blue-50/50' : 'border-line bg-white hover:border-brand/40'}`}>
              <div className="min-w-0 flex-1">

                className={`w-full text-left rounded-2xl border px-4 py-3 flex items-center gap-3 transition ${selectedMicId === d.deviceId ? 'border-brand bg-blue-50/50' : 'border-line bg-white hover:border-brand/40'}`}>
                <div className="min-w-0 flex-1">

                    {/usb|headset|tai nghe|external|webcam|bluetooth|airpod/i.test(d.label || '') ? 'Thiết bị gắn ngoài' : 'Thiết bị trên máy'}
                  </p>

              </button>

            {micDevices.length === 0 && !micLoading && (
              <div className="border border-dashed border-line rounded-2xl p-6 text-center">
                <p className="text-[12.5px] text-slate-400">Chưa thấy micro nào. Hãy bấm quét lại và cho phép quyền Micro.</p>
              </div>

          <p className="text-[11px] text-slate-400 mt-4 leading-relaxed">

          </p>

        </div>
      </Modal>

      {/* confirm */}
      <Modal open={!!confirmModal} z={1040} max="max-w-sm" onClose={() => { setConfirmModal(null); setConfirmPassInput(''); }}>
        {confirmModal && (
          <div className="p-8 text-center">

            {confirmModal.requirePassword && (
              <div className={`mb-6 ${confirmShake ? 'shake' : ''}`}>

                <input type="password" autoFocus autoComplete="off" value={confirmPassInput}
                       onChange={e => setConfirmPassInput(e.target.value)}
                       onKeyDown={e => e.key === 'Enter' && runConfirm()}
                       placeholder="••••••••"
                       className="fld text-center font-mono tracking-[.3em] py-3" />

            <div className="grid grid-cols-2 gap-3">

      </Modal>

      {/* lock / unlock staff */}
